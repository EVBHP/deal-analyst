<style>
:root{--navy:#202124;--navy-light:#3c4043;--accent:#1a73e8;--accent-light:#4285f4;--accent-bg:#e8f0fe;--bg:#f8f9fa;--bg-white:#fff;--surface:#fff;--border:#dadce0;--border-light:#e8eaed;--text:#202124;--text-sec:#5f6368;--text-muted:#80868b;--green:#1e8e3e;--green-bg:#e6f4ea;--green-border:#ceead6;--amber:#e37400;--amber-bg:#fef7e0;--amber-border:#fde293;--red:#d93025;--red-bg:#fce8e6;--red-border:#f5c6c0;--blue-bg:#e8f0fe;--blue-border:#aecbfa;--r:12px;--r-sm:8px;--r-lg:16px;--shadow:0 1px 2px 0 rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);--shadow-md:0 1px 3px 0 rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15);--sans:'Google Sans','Google Sans Text','Inter',-apple-system,'Helvetica Neue',sans-serif;--mono:'DM Mono','SF Mono','Roboto Mono',monospace}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
input,select,textarea,button{font-family:inherit;font-size:inherit}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#dadce0;border-radius:3px}

.hdr{background:var(--surface);color:var(--text);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border);box-shadow:0 1px 2px rgba(60,64,67,.1)}
.hdr h1{font-size:1.25rem;font-weight:600;letter-spacing:-.01em;color:var(--text)}
.hdr .sub{font-size:.8rem;color:var(--text-muted);font-weight:400;margin-left:12px}
.hdr-r{display:flex;align-items:center;gap:12px}
.deal-sel{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:var(--r-sm);font-size:.82rem;cursor:pointer;font-weight:500}
.deal-sel:focus{border-color:var(--accent);outline:none}
.deal-sel option{color:var(--text);background:#fff}

.tabs{background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:0;padding:0 24px;position:sticky;top:49px;z-index:99}
.tab{padding:14px 20px;background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;font-weight:500;color:var(--text-sec);transition:all .2s;white-space:nowrap;font-size:.875rem;letter-spacing:.01em}
.tab:hover{color:var(--text);background:var(--bg)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

.main{padding:24px;max-width:1400px;margin:0 auto}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:none;margin-bottom:20px}
.card-h{padding:14px 20px;border-bottom:1px solid var(--border-light);font-weight:600;font-size:.92rem;display:flex;align-items:center;justify-content:space-between}
.card-b{padding:20px}

.tbl{width:100%;border-collapse:collapse;font-size:.85rem}
.tbl th{text-align:left;padding:10px 14px;font-weight:500;color:var(--text-sec);border-bottom:1px solid var(--border);white-space:nowrap;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--border-light);vertical-align:middle}
.tbl tr:hover{background:var(--bg)}
.tbl .r{text-align:right}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r-sm);font-weight:500;font-size:.82rem;cursor:pointer;border:none;transition:all .2s;letter-spacing:.01em}
.btn-p{background:var(--accent);color:#fff}.btn-p:hover{background:#1765cc;box-shadow:0 1px 3px rgba(60,64,67,.3)}
.btn-s{background:var(--surface);color:var(--accent);border:1px solid var(--border)}.btn-s:hover{background:var(--accent-bg)}
.btn-sm{padding:6px 12px;font-size:.78rem}
.btn-d{background:var(--surface);color:var(--red);border:1px solid var(--red-border)}.btn-d:hover{background:var(--red-bg)}
.btn-i{padding:4px 6px;background:none;border:none;cursor:pointer;color:var(--text-muted);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px}.btn-i:hover{background:var(--bg);color:var(--text)}

.inp{padding:8px 12px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:.85rem;background:var(--surface);color:var(--text);transition:all .2s;width:100%}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.inp:disabled{background:var(--bg);color:var(--text-sec);cursor:not-allowed}
.inp-m{font-family:var(--mono)}
select.inp{appearance:auto;cursor:pointer}

.fg{margin-bottom:14px}
.fg label{display:block;font-size:.72rem;font-weight:500;color:var(--text-sec);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.fg .hint{font-size:.72rem;color:var(--text-muted);margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}

.mr{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.mc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;box-shadow:none}
.mc .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-sec);margin-bottom:6px;font-weight:500}
.mc .val{font-family:var(--mono);font-size:1.3rem;font-weight:600;color:var(--text)}
.mc .sub{font-size:.75rem;color:var(--text-muted);margin-top:4px}
.mc.hl{border-left:3px solid var(--accent)}

.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.72rem;font-weight:500;text-transform:uppercase;letter-spacing:.03em}
.bg-g{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.bg-a{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
.bg-r{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}

.tag{display:inline-block;padding:2px 8px;border-radius:var(--r-sm);font-size:.68rem;font-weight:500;text-transform:uppercase}
.tag-ai{background:var(--amber-bg);color:var(--amber)}.tag-rn{background:var(--green-bg);color:var(--green)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 24px;border-radius:var(--r);font-size:.85rem;font-weight:500;box-shadow:var(--shadow-md);z-index:300;animation:fiu .2s ease}
@keyframes fiu{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

.empty{text-align:center;padding:40px 20px;color:var(--text-muted)}
.warn-box{padding:10px 16px;background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:var(--r-sm);margin-bottom:16px;font-size:.82rem;color:var(--amber)}

/* Scenario grid — default 4 data columns, can be overridden inline */
.sg{display:grid;grid-template-columns:200px 1fr 1fr 1fr;gap:0;border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.sg .rl{padding:10px 14px;background:var(--bg);font-weight:500;font-size:.82rem;border-bottom:1px solid var(--border-light);display:flex;align-items:center}
.sg .ch{padding:10px 14px;color:#fff;font-weight:600;font-size:.82rem;text-align:center;text-transform:uppercase;letter-spacing:.03em}
.sg .lh{background:var(--bg);color:var(--text-sec);font-size:.78rem;padding:10px 14px}
.sg .cl{padding:10px 14px;border-bottom:1px solid var(--border-light);border-left:1px solid var(--border-light);font-family:var(--mono);font-size:.82rem;text-align:right}
.sg .cl.bd{font-weight:700;background:var(--bg);border-top:2px solid var(--border)}
.sg .sh{grid-column:1/-1;padding:10px 14px;background:var(--navy);color:#fff;font-weight:600;font-size:.82rem}

/* Sensitivity */
.sx{display:grid;grid-template-columns:auto repeat(3,1fr);gap:0;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;font-size:.82rem}
.sx .co{background:var(--bg);padding:8px}.sx .colh{background:var(--navy);color:#fff;padding:8px;text-align:center;font-weight:600}
.sx .rowh{background:var(--bg);padding:8px;font-weight:500}
.sx .v{padding:8px;text-align:right;font-family:var(--mono);border-left:1px solid var(--border-light);border-top:1px solid var(--border-light)}

.verdict{padding:18px 24px;border-radius:var(--r);font-weight:600;font-size:1rem;text-align:center;margin-bottom:20px}
.verdict.go{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.verdict.maybe{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
.verdict.nogo{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}

.f{display:flex}.ac{align-items:center}.jb{justify-content:space-between}.g2{gap:8px}.g3{gap:12px}.g4{gap:16px}
.mb2{margin-bottom:8px}.mb3{margin-bottom:12px}.mb4{margin-bottom:16px}.mt2{margin-top:8px}.mt4{margin-top:16px}
.tr{text-align:right}.tc{text-align:center}
.tred{color:var(--red)}.tgrn{color:var(--green)}.tamb{color:var(--amber)}.tmut{color:var(--text-muted)}
.mono{font-family:var(--mono)}

details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
</style>
</head>

<div id="root"></div>
<script type="text/babel">
const {useState,useCallback,useEffect,useRef,useMemo}=React;

/* ═══════════════════════════════════════
   CALCULATION ENGINE
   ═══════════════════════════════════════ */
const fmt=n=>{if(n==null||isNaN(n))return'—';return'$'+Math.round(n).toLocaleString()};
const fmtPct=n=>{if(n==null||isNaN(n))return'—';return(n*100).toFixed(1)+'%'};
const fmtSF=n=>{if(n==null||isNaN(n))return'—';return'$'+n.toFixed(0)+'/SF'};

function calcRenoBudget(scope,rc,contingencyPctOverride){
  if(rc&&rc.lineItems&&rc.lineItems.length>0){
    // Custom mode: use uploaded line items
    let sub=0;const li=[];
    for(const it of rc.lineItems){sub+=it.total;li.push(it)}
    // Add selected pool option
    const poolChoice=rc.poolChoice||'renovate';
    const pool=(rc.poolOptions||[]).find(p=>poolChoice==='fill'?/fill/i.test(p.category):/renovate/i.test(p.category));
    if(pool){sub+=pool.total;li.push(pool)}
    const pct=contingencyPctOverride!=null?contingencyPctOverride/100:(rc.contingency?.pct||0.1);
    return{lineItems:li,subtotal:sub,contingency:Math.round(sub*pct),total:Math.round(sub*(1+pct)),contingencyPct:pct,poolOptions:rc.poolOptions,poolChoice}
  }
  // Standard mode: use scope dropdowns
  const pct=contingencyPctOverride!=null?contingencyPctOverride/100:0.2;
  let t=0;const li={};for(const[c,l]of Object.entries(scope)){const cost=RENO_COSTS[c]?.[l]??0;li[c]=cost;t+=cost}return{lineItems:li,subtotal:t,contingency:Math.round(t*pct),total:Math.round(t*(1+pct)),contingencyPct:pct}
}
function calcQFBudget(fullLI,pct){
  if(Array.isArray(fullLI)){const t=Math.round(fullLI.reduce((s,it)=>s+it.total,0)*.45);const cp=pct||0.2;return{subtotal:t,contingency:Math.round(t*cp),total:Math.round(t*(1+cp))}}
  const qi={};let t=0;for(const[c,v]of Object.entries(fullLI)){const q=Math.round(v*.45);qi[c]=q;t+=q}return{lineItems:qi,subtotal:t,contingency:t*.2,total:t*1.2}
}
function calcAIBudget(fullLI,pct){
  if(Array.isArray(fullLI)){const t=Math.round(fullLI.reduce((s,it)=>s+it.total,0)*.1);const cp=pct||0.2;return{subtotal:t,contingency:Math.round(t*cp),total:Math.round(t*(1+cp))}}
  const ai={};let t=0;for(const[c,v]of Object.entries(fullLI)){const a=Math.round(v*.1);ai[c]=a;t+=a}return{lineItems:ai,subtotal:t,contingency:t*.2,total:t*1.2}
}

function calcARV(comps,sqft,adj=1){const v=comps.filter(c=>c.price&&c.sqft&&c.sqft>0);if(!v.length||!sqft)return null;const avg=v.reduce((s,c)=>s+c.price/c.sqft,0)/v.length;return Math.round(avg*adj*sqft)}
function calcAvgPSF(comps){const v=comps.filter(c=>c.price&&c.sqft&&c.sqft>0);if(!v.length)return null;return v.reduce((s,c)=>s+c.price/c.sqft,0)/v.length}
function calcDaysSince(d){if(!d)return null;return Math.abs(Math.round((new Date()-new Date(d))/(864e5)))}
function calcMOS(active,closed){if(!closed||closed===0)return null;return active/closed}

const DEF_IA={closingCostBuy:1,utilitiesMonthly:200,hoaMonthly:0,titleEscrowPct:1,listingCommPct:0,buyerCommPct:2,minROI:15,targetROI:20,propTaxRate:1.1,contingencyPct:20,insuranceAnnual:2875,interestRate:0};

function calcIA({purchasePrice:pp,arv,sqft,holdMonths:hm,renoSubtotal:rs,contingencyPct:cp,ia:raw,hoaMonthly:hoaOverride,takeover}){
  if(!pp||!arv)return null;
  const u={};for(const[k,v]of Object.entries(raw))u[k]=PCT_KEYS.has(k)?v/100:v;
  const reno=rs||0,cont=reno*(cp!=null?cp/100:u.contingencyPct||0.2),totReno=reno+cont;
  const hoaM=hoaOverride!=null?hoaOverride:(u.hoaMonthly||0);
  const cBuy=pp*(u.closingCostBuy||0);

  // Two ways to structure an installment:
  //   takeover — leave the seller's existing loan in place and make their payment
  //              (subject-to). Carry is the real PITI, and their taxes and
  //              insurance are already inside it, so they are not charged twice.
  //   new note — seller carries a new note at an agreed rate, interest only.
  const isTakeover=!!(takeover&&takeover.on&&takeover.payment>0);
  const pmt=isTakeover?takeover.payment:0;
  const balance=isTakeover?(takeover.balance||0):0;
  // An escrowed payment covers the seller's property tax, so charging tax again
  // would double-count. Insurance does NOT come out: the policy in that escrow is
  // the seller's, and we carry our own liability/hazard policy on top. HOA is
  // never inside a mortgage payment either. Both always carry separately.
  const escrowed=isTakeover&&takeover.escrowed!==false;
  const pTax=escrowed?0:pp*(u.propTaxRate||0)*(hm/12);
  const ins=(u.insuranceAnnual||0)*(hm/12);
  const util=(u.utilitiesMonthly||0)*hm,hoa=hoaM*hm;
  const pmtTotal=isTakeover?pmt*hm:0;
  const totAC=cBuy+pTax+ins+util+hoa+pmtTotal;

  const loan=isTakeover?balance:pp;
  // On a subject-to takeover there is no separate interest line: the PITI payment
  // covers principal, interest, taxes and insurance and is reported on its own row
  // inside carry. Reporting it as "interest" here printed the same figure twice.
  const mi=isTakeover?null:loan*(u.interestRate||0)/12;
  const ti=isTakeover?null:mi*hm;
  const pr=isTakeover?balance:loan+ti;
  // Subject-to: cash at closing has to cover the seller's equity above the loan.
  const equityToSeller=isTakeover?Math.max(0,pp-balance):0;
  const cashClose=isTakeover?(cBuy+totReno+equityToSeller):(cBuy+totReno);
  const totFin=isTakeover?0:ti;   // takeover payments are already counted in carry

  const titleEsc=arv*(u.titleEscrowPct||0.01);
  // Commissions apply on the installment exit exactly as on any other sale.
  const lComm=arv*(u.listingCommPct||0),bComm=arv*(u.buyerCommPct||0);
  const totSell=titleEsc+lComm+bComm;
  const totProj=(isTakeover?equityToSeller+balance:pp)+totReno+totAC+totFin+totSell;
  const netP=arv-totProj;
  const roi=totProj>0?netP/totProj:0;
  const netCash=arv-totSell-pr,coc=cashClose>0?(netCash-cashClose)/cashClose:0;
  const ppm=hm>0?netP/hm:0,ppsf=sqft>0?netP/sqft:0;
  const minProfit=raw.minProfitTarget||75000,targetProfit=raw.targetProfit||100000;
  return{renoSubtotal:reno,contingency:cont,totalReno:totReno,closingBuy:cBuy,propTax:pTax,insurance:ins,utilities:util,hoa,totalAcqCarry:totAC,loanAmount:loan,monthlyInterest:mi,totalInterest:ti,principalRepay:pr,cashAtClosing:cashClose,totalFinancingCost:totFin,titleEscrow:titleEsc,listingComm:lComm,buyerComm:bComm,totalSellingCost:totSell,totalProjectCost:totProj,netProfit:netP,allCostROI:roi,netCashProceeds:netCash,cashOnCash:coc,profitPerMonth:ppm,profitPerSF:ppsf,minProfitTarget:minProfit,targetProfit,
    isTakeover,escrowed,monthlyPayment:pmt,existingBalance:balance,equityToSeller,paymentsTotal:pmtTotal}
}

function calcUW({purchasePrice:pp,arv,sqft,holdMonths:hm,renoSubtotal:rs,contingencyPct:cp,uw:raw,downPayment:dp,hoaMonthly:hoaOverride}){
  if(!pp||!arv)return null;
  const u=uwCalc(raw);
  const reno=rs||0,cont=reno*(cp!=null?cp/100:u.contingencyPct),totReno=reno+cont;
  const hoaM=hoaOverride!=null?hoaOverride:u.hoaMonthly;
  const cBuy=pp*u.closingCostBuy,pTax=pp*u.propTaxRate*(hm/12),ins=u.insuranceAnnual*(hm/12),util=u.utilitiesMonthly*hm,hoa=hoaM*hm;
  const totAC=cBuy+pTax+ins+util+hoa+u.miscCarry;
  const dpAmt=dp||0;
  const ltcB=(pp+totReno)*u.ltc,ltvB=arv*u.ltv,maxLoan=dpAmt>0?(pp-dpAmt):Infinity,loan=Math.min(ltcB,ltvB,maxLoan);
  const pts=loan*u.loanPoints,mi=loan*(u.interestRate/12),ti=mi*hm,pr=loan+ti;
  const cashClose=(pp-loan)+pts+u.lenderFees,totFin=pts+u.lenderFees+ti;
  const listComm=arv*(u.listingCommPct||0),buyComm=arv*(u.buyerCommPct||.02),titleEsc=arv*(u.titleEscrowPct||.01);
  const comm=listComm+buyComm,cSell=titleEsc,totSell=comm+cSell+u.stagingCost;
  const totProj=pp+totReno+totAC+totFin+totSell,netP=arv-totProj;
  const roi=totProj>0?netP/totProj:0,netCash=arv-totSell-pr,coc=cashClose>0?(netCash-cashClose)/cashClose:0;
  const ppm=hm>0?netP/hm:0,ppsf=sqft>0?netP/sqft:0,cpsf=sqft>0?totProj/sqft:0;
  // MAO: the highest purchase price that still clears the minimum profit target.
  // The old closed-form treated financing as fixed, but the loan is sized off the
  // purchase price (LTC basis), so the answer moved with whatever price was already
  // typed in. Solve it numerically instead: net profit falls monotonically as price
  // rises, so a bisection converges and the result depends only on the deal.
  const netAtPrice=(price)=>{
    const cB=price*u.closingCostBuy;
    const pT=price*u.propTaxRate*(hm/12);
    const aCarry=cB+pT+ins+util+hoa+u.miscCarry;
    const lB=(price+totReno)*u.ltc;
    const mL=dpAmt>0?(price-dpAmt):Infinity;
    const ln=Math.min(lB,ltvB,mL);
    const fin=ln*u.loanPoints+u.lenderFees+ln*(u.interestRate/12)*hm;
    return arv-(price+totReno+aCarry+fin+totSell);
  };
  // Two floors, and the more restrictive one binds:
  //   dollar floor  — keeps small deals from being technically fine but not worth doing
  //   annualised ROI — scales with deal size and penalises long holds, which a flat
  //                    dollar target cannot do. A 15% return in 3 months and the same
  //                    15% over 12 months are not the same deal.
  const target=raw.minProfitTarget||0;
  const roiFloor=(raw.minAnnualROI!=null?raw.minAnnualROI:0)/100;
  const okAt=(price)=>{
    const net=netAtPrice(price);
    if(net<target)return false;
    if(roiFloor>0){
      const cost=price+totReno+(()=>{
        const cB=price*u.closingCostBuy,pT=price*u.propTaxRate*(hm/12);
        const aC=cB+pT+ins+util+hoa+u.miscCarry;
        const lB=(price+totReno)*u.ltc,mL=dpAmt>0?(price-dpAmt):Infinity;
        const ln=Math.min(lB,ltvB,mL);
        return aC+ln*u.loanPoints+u.lenderFees+ln*(u.interestRate/12)*hm;
      })()+totSell;
      if(cost<=0)return false;
      const roi=net/cost;
      // A zero-month hold cannot be annualised; apply the floor flat instead.
      const annual=hm>0?roi*12/hm:roi;
      if(annual<roiFloor)return false;
    }
    return true;
  };
  let lo=0,hi=arv;
  if(!okAt(0)){lo=hi=0}                       // deal cannot clear both floors at any price
  else{for(let i=0;i<80;i++){const mid=(lo+hi)/2;if(okAt(mid))lo=mid;else hi=mid}}
  const mao=lo;
  const maoBinding=(()=>{
    if(mao<=0)return 'none';
    const net=netAtPrice(mao);
    return Math.abs(net-target)<Math.max(50,target*0.005)?'profit':'roi';
  })();
  const maoP=arv>0?mao/arv:0;
  return{renoSubtotal:reno,contingency:cont,totalReno:totReno,closingBuy:cBuy,propTax:pTax,insurance:ins,utilities:util,hoa,miscCarry:u.miscCarry,totalAcqCarry:totAC,ltcBasis:ltcB,ltvBasis:ltvB,loanAmount:loan,points:pts,monthlyInterest:mi,totalInterest:ti,principalRepay:pr,cashAtClosing:cashClose,totalFinancingCost:totFin,lenderFees:u.lenderFees,listingComm:listComm,buyerComm:buyComm,titleEscrow:titleEsc,commission:comm,closingSell:cSell,staging:u.stagingCost,totalSellingCost:totSell,totalProjectCost:totProj,netProfit:netP,allCostROI:roi,netCashProceeds:netCash,cashOnCash:coc,profitPerMonth:ppm,profitPerSF:ppsf,costPerSF:cpsf,mao,maoArvPct:maoP,maoBinding,minProfitTarget:raw.minProfitTarget,targetProfit:raw.targetProfit}
}

function calcSens(bp,arv,tr){const aa=[0,-.02,-.04],ra=[0,.05,.10],g=[];for(const r of ra){const row=[];for(const a of aa)row.push(Math.round(bp+(arv*a)-(tr*r)));g.push(row)}return g}

/* ── EXIT STRATEGIES ───────────────────────────────────────────────
   One registry used by the Underwriting comparison, the Deal Summary and
   the PDF, so the three can never disagree about what an exit means.
   arv:  which value the exit sells into
   reno: which renovation budget it carries
   Both are overridable per deal via deal.exitBasis. */
const EXITS=[
  {id:'fullReno',  label:'Full Rehab',   color:'#2563eb', arv:'reno', reno:'full', hold:'holdFullReno',  internal:false},
  {id:'quickFlip', label:'Quick Flip',   color:'#d97706', arv:'qf',   reno:'qf',   hold:'holdQuickFlip', internal:false},
  {id:'installment',label:'Installment', color:'#7c3aed', arv:'reno', reno:'qf',   hold:'ia',            internal:false},
  {id:'asIs',      label:'As-Is',        color:'#16a34a', arv:'asIs', reno:'none', hold:'holdAsIs',      internal:false},
  {id:'listing',   label:'Listing',      color:'#0891b2', arv:'asIs', reno:'none', hold:'holdAsIs',      internal:true},
];
const EXIT_BY_ID=Object.fromEntries(EXITS.map(e=>[e.id,e]));
const DEFAULT_EXITS=['fullReno','quickFlip'];
const ARV_LABELS={reno:'Renovated ARV',qf:'Quick Flip ARV',asIs:'As-Is Value'};
const RENO_LABELS={full:'Full Rehab budget',qf:'Quick Flip budget',none:'No renovation'};

/* Resolve every exit against the current deal numbers. Returns one row per
   exit whether selected or not, so the picker can preview profit before the
   exit is added to the summary. */
function buildExits({pp,sqft,arvReno,arvQf,arvAsIs,renoFull,renoQf,renoNone,holds,iaHold,u,dpAmt,hoaMonthly,basis,iaCalc}){
  return EXITS.map(e=>{
    const b=(basis&&basis[e.id])||{};
    const arvKey=b.arv||e.arv, renoKey=b.reno||e.reno;
    const arv=arvKey==='reno'?arvReno:arvKey==='qf'?(arvQf||arvAsIs):arvAsIs;
    const renoSubtotal=renoKey==='full'?renoFull:renoKey==='qf'?renoQf:renoNone;
    const hold=e.hold==='ia'?iaHold:(holds[e.hold]??0);
    let res=null;
    if(pp&&arv){
      res=e.id==='installment'&&iaCalc
        ?iaCalc({arv,renoSubtotal,holdMonths:hold})
        :calcUW({purchasePrice:pp,arv,sqft,holdMonths:hold,renoSubtotal,contingencyPct:u.contingencyPct,uw:u,downPayment:dpAmt,hoaMonthly:e.id==='asIs'?0:hoaMonthly});
    }
    return{...e,arvKey,renoKey,arv,renoSubtotal,hold,res};
  });
}



/* ── SELLER SUMMARY (investor-facing) ──────────────────────────────
   Goes to partner-investors on the Deal Summary, a different audience from
   the public InvestorBase listing. Investors legitimately need the seller's
   reason for selling, timeline, occupancy and anything affecting whether the
   deal closes. They must NOT see the negotiating position: the seller's
   number, our leverage, competing offers, or the seller's finances. */
const SS_EXCLUDE=['winWinPrice','painPointLeverage','offersInHand','offerTerms','offerStalled',
  'speedVsPrice','priceFlexibility','mortgageDetails','mortgageBalance','mortgagePayment',
  'mortgageRate','paymentsCurrent','contactName','legalOwner','otherParties','listedBefore'];

function generateSellerSummary(deal){
  const f=deal.fdif||{};
  const has=v=>String(v==null?'':v).trim()!=='';
  const t=v=>String(v).trim();
  const parts=[];

  if(has(f.sellerMotivation))parts.push(t(f.sellerMotivation));
  if(has(f.idealCloseDate))parts.push('Their ideal closing is '+t(f.idealCloseDate)+'.');

  const occ=t(f.occupancy||'');
  if(occ){
    let line='The property is '+occ.toLowerCase()+'.';
    if(/owner/i.test(occ)&&has(f.occupiedMovePlan))line+=' '+t(f.occupiedMovePlan);
    if(/tenant/i.test(occ)&&has(f.tenantLease))line+=' '+t(f.tenantLease);
    parts.push(line);
  }
  if(has(f.situationFlags))parts.push(t(f.situationFlags));

  // Situation flags alone are not a seller summary. Without a reason, a timeline
  // or an occupancy status there is nothing to tell an investor, so return
  // nothing rather than a one-line fragment that reads like an answer.
  const hasSubstance=has(f.sellerMotivation)||has(f.idealCloseDate)||has(f.occupancy);
  const draft=hasSubstance?parts.join(' ').replace(/\s+/g,' ').trim():'';
  const missing=[];
  if(!has(f.sellerMotivation))missing.push('reason for selling');
  if(!has(f.idealCloseDate))missing.push('timeline');
  if(!has(f.occupancy))missing.push('occupancy');
  return{draft,missing};
}

/* Assert nothing from the negotiating position reached the text. Used by the
   UI before export and by the audit. */
function sellerSummaryLeaks(deal,text){
  const f=deal.fdif||{};
  const leaks=[];
  SS_EXCLUDE.forEach(k=>{
    const v=String(f[k]||'').trim();
    if(v.length>3&&text.includes(v))leaks.push(k);
  });
  return leaks;
}

/* ── INVESTORBASE LISTING GENERATOR ────────────────────────────────
   Produces the public wholesale listing. Two hard rules:
     1. Never infer. A blank source field prints [NEEDED] so the gap is
        visible rather than silently filled with a guess.
     2. Never leak the seller's private position. The excluded keys below
        are what a buyer must not see, and the audit asserts their values
        never appear in the output.
   The wording below is a scaffold. Paste the real InvestorBase template
   text into IB_TEMPLATE and the generator will use it verbatim. */
const IB_INTERNAL_KEYS=['titleCompany','escrowOfficer'];  // TPHP eyes only, never published
const IB_PRIVATE_KEYS=['sellerMotivation','whyInvestor','contactName','legalOwner',
  'speedVsPrice','painPointLeverage','offersInHand','mortgageDetails','mortgageBalance',
  'mortgagePayment','mortgageRate','paymentsCurrent','winWinPrice','priceFlexibility'];

const IB_TEMPLATE={
  disclaimer:'All information is deemed reliable but not guaranteed. Buyer is responsible for verifying all information including but not limited to square footage, lot size, condition, permits, liens, and title. Property is sold as-is, where-is, with no warranties expressed or implied. This is an assignment of contract, not a listing. Buyer must perform independent due diligence.',
};

const NEEDED='[NEEDED]';
const ibHas=v=>String(v==null?'':v).trim()!=='';
const ibVal=v=>String(v==null?'':v).trim();
const ibMoney=v=>{const n=pn(v);return n>0?fmt(n):''};
/* Push a labelled line only when there is something to say. An empty source
   field is omitted from the listing entirely rather than printed as a
   placeholder; the pre-publish panel is where gaps are reported. */
const ibPush=(L,label,v)=>{if(ibHas(v))L.push(label+': '+ibVal(v))};

function selectedListingComps(deal){
  const d=deal.dispo||{};
  const all=[...(deal.comps?.asIs||[]),...(deal.comps?.renovated||[])];
  const chosen=(d.selectedComps||[]).map(id=>all.find(c=>c.id===id)).filter(Boolean);
  const pool=chosen.length?chosen:all;
  // Closed sales only unless explicitly overridden. An active listing is an
  // asking price, not evidence of value.
  const filtered=d.includeActiveComps?pool:pool.filter(c=>/closed/i.test(c.status||''));
  return filtered.filter(c=>pn(c.price)>0);
}

function generateInvestorBaseListing(deal,{arv}={}){
  const f=deal.fdif||{}, d=deal.dispo||{};
  const contract=pn(d.contractPrice)||pn(deal.underwriting?.purchasePrice);
  const asking=pn(d.askingPrice);
  const fee=asking>0&&contract>0?asking-contract:null;
  const comps=selectedListingComps(deal);

  const L=[];
  if(ibHas(f.address))L.push(ibVal(f.address));
  L.push('');
  ibPush(L,'ASKING',ibMoney(d.askingPrice));
  ibPush(L,'EMD',ibMoney(d.emdAmount));
  ibPush(L,'CLOSING',d.closingDate);
  L.push('PROOF OF FUNDS: '+(d.pofRequired==='No'?'Not required':'Required'));
  L.push('');

  const prop=[];
  ibPush(prop,'Beds/Baths',f.bedsBaths);
  ibPush(prop,'Square feet',f.sqft);
  ibPush(prop,'Lot size',f.lotSize);
  ibPush(prop,'Year built',f.yearBuilt);
  ibPush(prop,'HOA',f.hoaDues);
  ibPush(prop,'Solar',f.solar);
  ibPush(prop,'Pool',f.poolDetails);
  if(prop.length){L.push('PROPERTY');L.push(...prop);L.push('')}

  const cond=[];
  ibPush(cond,'Overall',f.conditionRating);
  ibPush(cond,'Roof',f.roofAgeType);
  ibPush(cond,'HVAC',f.hasAC);
  ibPush(cond,'Water heater',f.waterHeater);
  ibPush(cond,'Windows',f.windowsReplaced);
  ibPush(cond,'Paint',f.lastPainted);
  ibPush(cond,'Kitchen',f.kitchenCondition);
  ibPush(cond,'Bathrooms',f.bathroomsRemodeled);
  ibPush(cond,'Known repairs',f.majorRepairsNeeded);
  if(cond.length){L.push('CONDITION');L.push(...cond);L.push('')}

  // The only place financing terms may appear, and only when the contract
  // actually permits a takeover. Published from the Dispo fields only.
  if(d.takeoverPermitted==='Yes'){
    L.push('FINANCING');
    L.push('Subject-to available: existing financing may be taken over per contract.');
    ibPush(L,'Rate',ibHas(d.takeoverRate)?ibVal(d.takeoverRate)+'%':'');
    ibPush(L,'Monthly payment',ibMoney(d.takeoverPayment));
    L.push('');
  }

  if(comps.length){
    L.push('COMPS (closed sales)');
    comps.forEach(c=>{
      const segs=[];
      if(ibHas(c.sqft))segs.push(ibVal(c.sqft)+' sqft');
      if(ibHas(c.bedBath))segs.push(ibVal(c.bedBath));
      const dt=c.saleDate?new Date(c.saleDate):null;
      if(dt&&!isNaN(dt))segs.push('Closed '+(dt.getMonth()+1)+'/'+dt.getDate()+'/'+dt.getFullYear());
      else if(ibHas(c.saleDate))segs.push('Closed '+ibVal(c.saleDate));
      const head=[ibVal(c.address),ibMoney(c.price)].filter(Boolean).join(' - ');
      L.push(head+(segs.length?': '+segs.join(' | '):''));
    });
    L.push('');
  }

  const acc=[];
  const wt=[ibVal(d.walkthroughDates),ibVal(d.walkthroughWindow)].filter(Boolean).join(', ');
  ibPush(acc,'Walkthrough',wt);
  ibPush(acc,'Instructions',d.accessInstructions);
  if(acc.length){L.push('ACCESS');L.push(...acc);L.push('')}

  if(ibHas(d.overview)){L.push('OVERVIEW');L.push(ibVal(d.overview));L.push('')}
  L.push(IB_TEMPLATE.disclaimer);

  return{text:L.join('\n'),contract,asking,fee,comps};
}

/* Bed/bath comparability. "3/2" -> {beds:3,baths:2}. A comp with a different
   bed count is not evidence of value for this subject, which is why the ARV
   ceiling is built from matched comps first. */
function parseBedBath(v){
  const m=String(v||'').match(/(\d+(?:\.\d+)?)\s*[\/xX|-]\s*(\d+(?:\.\d+)?)/);
  if(m)return{beds:parseFloat(m[1]),baths:parseFloat(m[2])};
  const n=String(v||'').match(/(\d+(?:\.\d+)?)/);
  return n?{beds:parseFloat(n[1]),baths:null}:{beds:null,baths:null};
}

/* Split closed comps by how well they match the subject, so a flag can say
   WHICH comps it relied on rather than quoting the highest number available. */
function compComparability(deal){
  const f=deal.fdif||{};
  const subj=parseBedBath(f.bedsBaths);
  const subjSqft=pn(f.sqft);
  const closed=[...(deal.comps?.asIs||[]),...(deal.comps?.renovated||[])]
    .filter(c=>/closed/i.test(c.status||'')&&pn(c.price)>0&&pn(c.sqft)>0);
  const scored=closed.map(c=>{
    const cb=parseBedBath(c.bedBath);
    const bedMatch=subj.beds!=null&&cb.beds!=null?cb.beds===subj.beds:null;
    const sqftVar=subjSqft>0?(pn(c.sqft)-subjSqft)/subjSqft:null;
    return{...c,psf:pn(c.price)/pn(c.sqft),beds:cb.beds,baths:cb.baths,bedMatch,sqftVar};
  });
  const matched=scored.filter(c=>c.bedMatch===true);
  const mismatched=scored.filter(c=>c.bedMatch===false);
  const unknown=scored.filter(c=>c.bedMatch===null);
  return{subj,subjSqft,all:scored,matched,mismatched,unknown};
}

/* Pre-publish checks. Advisory, shown above the preview, never copied. */
function investorBaseFlags(deal,{arv}={}){
  const f=deal.fdif||{}, d=deal.dispo||{};
  const out=[];
  const gen=generateInvestorBaseListing(deal,{arv});

  // Missing fields are reported here by name rather than printed into the
  // listing, so the buyer-facing text stays clean and the gaps stay visible.
  const missing=[];
  const want=[['Address',f.address],['Beds/Baths',f.bedsBaths],['Square feet',f.sqft],
    ['Lot size',f.lotSize],['Year built',f.yearBuilt],['Condition',f.conditionRating],
    ['Asking price',d.askingPrice],['EMD',d.emdAmount],['Closing date',d.closingDate],
    ['Walkthrough',d.walkthroughDates],['Access instructions',d.accessInstructions]];
  want.forEach(([l,v])=>{if(!String(v==null?'':v).trim())missing.push(l)});
  if(d.takeoverPermitted==='Yes'){
    if(!String(d.takeoverRate||'').trim())missing.push('Takeover rate');
    if(!String(d.takeoverPayment||'').trim())missing.push('Takeover payment');
  }
  if(missing.length)out.push({level:'red',msg:'Not published because they are blank: '+missing.join(', ')+'.'});

  // ARV ceiling, built from comps that actually match the subject.
  const cmp=compComparability(deal);
  const sqft=cmp.subjSqft;
  if(arv>0&&sqft>0&&cmp.all.length){
    const basis=cmp.matched.length?cmp.matched:cmp.all;
    const basisLabel=cmp.matched.length
      ?cmp.matched.length+' comp'+(cmp.matched.length>1?'s':'')+' matching '+cmp.subj.beds+' bed'
      :'all '+cmp.all.length+' closed comp'+(cmp.all.length>1?'s':'')+' (none match the bed count)';
    const top=basis.reduce((a2,c)=>c.psf>a2.psf?c:a2,basis[0]);
    const ceiling=top.psf*sqft;
    if(arv>ceiling){
      out.push({level:'amber',msg:'ARV '+fmt(arv)+' exceeds '+fmt(ceiling)+', the ceiling from '+basisLabel
        +' at '+fmt(top.psf)+'/sqft ('+(top.address||'comp')+').'});
    }
    // Say plainly when the comp set does not describe this property.
    if(cmp.mismatched.length){
      const detail=cmp.mismatched.map(c=>(c.address||'comp')+' is '+c.beds+' bed').join('; ');
      out.push({level:'amber',msg:cmp.mismatched.length+' of '+cmp.all.length+' closed comps do not match the subject at '
        +(cmp.subj.beds!=null?cmp.subj.beds+' bed':'unknown beds')+': '+detail
        +(cmp.matched.length?'. The ARV check used the '+cmp.matched.length+' that match.'
          :'. No comp matches the bed count, so the ARV check is weak.')});
    }
    const wide=cmp.all.filter(c=>c.sqftVar!=null&&Math.abs(c.sqftVar)>0.20);
    if(wide.length)out.push({level:'amber',msg:wide.length+' comp'+(wide.length>1?'s are':' is')+' more than 20% off the subject\u2019s '
      +Math.round(sqft).toLocaleString()+' sqft: '+wide.map(c=>(c.address||'comp')+' at '+Math.round(pn(c.sqft)).toLocaleString()+' sqft ('
      +(c.sqftVar>0?'+':'')+Math.round(c.sqftVar*100)+'%)').join('; ')+'.'});
  }
  if(arv>0&&!cmp.all.length)out.push({level:'amber',msg:'No closed comps with price and sqft, so the ARV cannot be checked against anything.'});

  // Seller equity: does the contract price clear the loan plus their costs?
  const contract=pn(d.contractPrice)||pn(deal.underwriting?.purchasePrice);
  const bal=pn(f.mortgageBalance);
  if(contract>0&&bal>0){
    const sellerCosts=contract*0.02;
    const net=contract-bal-sellerCosts;
    if(net<0)out.push({level:'red',msg:'Seller equity is thin: '+fmt(contract)+' less '+fmt(bal)+' payoff and '+fmt(sellerCosts)+' costs leaves '+fmt(net)+'. This may not close.'});
  }

  // HOA stated two different ways.
  const hoaText=pn(String(f.hoaDues||'').replace(/[^0-9.]/g,''));
  const hoaUW=pn((deal.iaDefaults||{}).hoaMonthly);
  if(hoaText>0&&hoaUW>0&&Math.abs(hoaText-hoaUW)>1)
    out.push({level:'amber',msg:'HOA conflict: intake says '+fmt(hoaText)+'/mo, underwriting uses '+fmt(hoaUW)+'/mo.'});

  if(d.takeoverPermitted!=='Yes'&&(String(f.mortgageRate||'').trim()||String(f.mortgageBalance||'').trim()))
    out.push({level:'info',msg:'Financing details suppressed: the contract does not permit a takeover. Set field 10 to Yes only if it actually does.'});

  return out;
}

function calcAsIsListing(fmv){
  if(!fmv)return null;
  const commission=fmv*0.03;
  return{netProfit:commission,commission,totalReno:0,totalAcqCarry:0,totalFinancingCost:0,totalSellingCost:0,totalProjectCost:0,cashAtClosing:0,allCostROI:null,cashOnCash:null,profitPerMonth:null,mao:null}
}

/* Quick Offer, derived from the same engine as the Underwriting tab.
   Inputs are all already on the page: ARV from the AVM average (what the house
   is worth in ordinary condition), as-is from distressed comps, and the reno
   estimate. Everything else comes from TPHP house assumptions, never an
   investor profile, because the DIS is usually on the call before a deal is
   assigned. The old version hardcoded 8% fees and no carry, financing, hold or
   profit target, which overstated the cash ceiling by tens of thousands. */
function calcQuickOffers(asIs,estReno=0,{arv,uw,holdMonths=6,assignmentFees=[10000,15000,25000]}={}){
  if(!asIs)return null;
  const u=uw||DEF_UW;
  const arvUsed=arv&&arv>0?arv:asIs;
  const target=u.minProfitTarget||0;

  // Cash offer = the most we can pay and still clear the house profit target.
  // calcUW solves this the same way the Underwriting tab does.
  const probe=calcUW({purchasePrice:Math.max(1,Math.round(arvUsed*0.5)),arv:arvUsed,sqft:0,
    holdMonths,renoSubtotal:estReno,uw:u,downPayment:0,hoaMonthly:0});
  const cashOffer=probe?Math.max(0,probe.mao):0;
  // Rule-of-thumb cross-check the DIS can do in his head while the seller talks.
  // Fitted against the exact engine across deals from 220k to 900k ARV and light
  // to heavy rehab: average error under 10k. If the two diverge badly, an input
  // is wrong, usually the ARV or a mistyped reno.
  const ruleOfThumb=Math.max(0,arvUsed*0.80-estReno*1.5);
  // First-call inputs are estimates. ARV from an AVM runs about +/-8% and a $/SF
  // reno guess about +/-25%, so a point estimate implies precision we do not have.
  const band=(arvMul,renoMul)=>{
    const pr=calcUW({purchasePrice:Math.max(1,Math.round(arvUsed*arvMul*0.5)),arv:arvUsed*arvMul,sqft:0,
      holdMonths,renoSubtotal:estReno*renoMul,uw:u,downPayment:0,hoaMonthly:0});
    return pr?Math.max(0,pr.mao):0;
  };
  const conservative=band(0.92,1.25), optimistic=band(1.08,0.85);
  // Re-run at the cash offer so the disclosed carry, financing and selling
  // figures describe the offer actually shown, not the probe price used to
  // find it. Property tax and loan size both move with the purchase price.
  const atOffer=cashOffer>0?calcUW({purchasePrice:cashOffer,arv:arvUsed,sqft:0,
    holdMonths,renoSubtotal:estReno,uw:u,downPayment:0,hoaMonthly:0}):probe;

  // Selling costs on the seller's side use the same commission and title rates
  // as underwriting, not a hardcoded 8%.
  const sellPct=((u.listingCommPct||0)+(u.buyerCommPct||0)+(u.titleEscrowPct||0))/100;
  const closingFees=asIs*sellPct;
  const netToSeller=asIs-closingFees;

  // Wholesale: the end buyer needs the MAO to work, so our price is MAO less
  // the assignment fee we intend to make. Percentages of as-is meant nothing.
  const wholesale=assignmentFees.map(fee=>({fee,price:Math.max(0,cashOffer-fee)}));

  return{asIsValue:asIs,arvUsed,holdMonths,sellPct,closingFees,netToSeller,
    novationPrice:netToSeller,cashOffer,minProfitTarget:target,
    renoWithContingency:atOffer?atOffer.totalReno:estReno,
    carry:atOffer?atOffer.totalAcqCarry:0,financing:atOffer?atOffer.totalFinancingCost:0,
    sellingCost:atOffer?atOffer.totalSellingCost:0,
    profitAtOffer:atOffer?atOffer.netProfit:0,
    wholesale,ruleOfThumb,conservative,optimistic,
    maoBinding:probe?probe.maoBinding:'none',
    minAnnualROI:u.minAnnualROI||0,
    wholesale80:wholesale[0]?wholesale[0].price:0,
    wholesale75:wholesale[1]?wholesale[1].price:0,
    wholesale70:wholesale[2]?wholesale[2].price:0}
}

/* ═══════════════════════════════════════
   HOUSE CANARY PDF PARSER
   ═══════════════════════════════════════ */
async function parseHouseCanaryPDF(file){
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const result={valueEstimate:null,subjectProperty:{},comps:[],market:{}};
  const compMap={}; // keyed by normalized address

  // Extract full text per page
  const pageTexts=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    const items=tc.items.filter(it=>it.str.trim()).map(it=>({text:it.str,x:Math.round(it.transform[4]),y:Math.round(it.transform[5])}));
    items.sort((a,b)=>b.y-a.y||a.x-b.x);
    const lines=[];let curLine=null;
    for(const it of items){
      if(!curLine||Math.abs(it.y-curLine.y)>4){curLine={y:it.y,items:[]};lines.push(curLine)}
      curLine.items.push(it);
    }
    const text=lines.map(l=>{l.items.sort((a,b)=>a.x-b.x);return l.items.map(i=>i.text).join(' ')}).join('\n');
    pageTexts.push({pageNum:p,text});
  }

  // --- Extract Value Estimate ---
  for(const pg of pageTexts.slice(0,3)){
    if(result.valueEstimate)break;
    const veMatch=pg.text.match(/Value\s+Estimate[\s\S]{0,50}?\$\s*([\d,]+(?:\.\d+)?)/i);
    if(veMatch&&veMatch[1].replace(/,/g,'').length>=5){result.valueEstimate=veMatch[1].replace(/,/g,'');break}
    const hcMatch=pg.text.match(/HouseCanary\s+Value[\s\S]{0,100}?\$\s*([\d,]+(?:\.\d+)?)/i);
    if(hcMatch&&hcMatch[1].replace(/,/g,'').length>=5){result.valueEstimate=hcMatch[1].replace(/,/g,'');break}
  }

  // Helper: normalize address for matching — strip city/state/zip so PASS 1 & 2 produce same key
  const normAddr=a=>{const s=(a||'').split(',')[0].trim();return s.replace(/[^a-zA-Z0-9]/g,'').toLowerCase()};

  // Helper: parse date M/D/YYYY → YYYY-MM-DD
  const parseDate=s=>{const m=(s||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?m[3]+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0'):''};

  // Helper: clean price string → raw number string
  const cleanPrice=s=>(s||'').replace(/[$,\s]/g,'').replace(/^-/,'');
  const cleanNum=s=>(s||'').replace(/[^0-9.]/g,'');

  // --- PASS 1: Extract basic comp data from summary table pages ---
  for(const pg of pageTexts){
    if(!/Selected\s+Sold\s*&?\s*Active\s+Comparable/i.test(pg.text))continue;
    if(!/# Address|Address\s+Distance/i.test(pg.text))continue;

    const lines=pg.text.split('\n');
    let headerIdx=-1;
    for(let i=0;i<lines.length;i++){
      if(/address/i.test(lines[i])&&/distance/i.test(lines[i])&&(/market|status/i.test(lines[i]))){headerIdx=i;break}
    }
    if(headerIdx<0)continue;

    const compLines=lines.slice(headerIdx+1);
    let i=0;
    while(i<compLines.length){
      const line=compLines[i];
      if(!line.trim()||/order\s*date|property\s*explorer|powered|pg\.|similarity|legend|sales\s*\$/i.test(line)){i++;continue}
      if(/^\d{1,2}$/.test(line.trim())){i++;continue}

      const distMatch=line.match(/(\d+\.\d+)\s*mi/);
      const priceMatch=line.match(/\$\s*([\d,]+(?:\.\d+)?)/);
      const dateMatch=line.match(/(\d{1,2}\/\d{1,2}\/\d{4})/);

      if(distMatch&&priceMatch){
        const distPos=line.indexOf(distMatch[0]);
        let address=line.substring(0,distPos).trim().replace(/^\d+\s+/,'');
        const afterDist=line.substring(distPos+distMatch[0].length).trim();
        const statusMatch=afterDist.match(/\b(Closed|Active|Pending)\b/i);
        const status=statusMatch?statusMatch[1]:'';
        const saleDate=parseDate(dateMatch?dateMatch[1]:'');
        const price=cleanPrice(priceMatch[1]);

        const datePos=dateMatch?line.indexOf(dateMatch[0]):-1;
        const afterDate=datePos>=0?line.substring(datePos+dateMatch[0].length).trim():afterDist;
        const numFields=afterDate.match(/^(\d+)\s+([\d.]+)\s+([\d,]+)\s*ft²?\s+([\d,]+)\s*ft²?\s+(.+?)\s+(\d{4})\s*$/);
        let beds='',baths='',sqft='',lotSize='',propType='',yearBuilt='';
        if(numFields){beds=numFields[1];baths=numFields[2];sqft=numFields[3].replace(/,/g,'');lotSize=numFields[4];propType=numFields[5].trim();yearBuilt=numFields[6]}
        else{
          const ftM=[...afterDate.matchAll(/([\d,]+)\s*ft²/g)];
          if(ftM.length>=1)sqft=ftM[0][1].replace(/,/g,'');if(ftM.length>=2)lotSize=ftM[1][1];
          const bbM=afterDate.match(/^(\d+)\s+([\d.]+)/);if(bbM){beds=bbM[1];baths=bbM[2]}
          const yrM=afterDate.match(/\b(19|20)\d{2}\b/g);if(yrM)yearBuilt=yrM[yrM.length-1];
          const ptM=afterDate.match(/(Single Family Detached|Condominium|Townhouse|Multifamily|Manufactured)/i);if(ptM)propType=ptM[1];
        }

        // Merge city/state from following lines
        if(i+1<compLines.length){
          const nl=compLines[i+1].trim();
          if(/^[A-Z].*\b[A-Z]{2}\b\s+\d{5}/i.test(nl)){address+=', '+nl;i++}
          else if(/^\d{1,2}$/.test(nl)){i++;if(i+1<compLines.length){const cl=compLines[i+1].trim();if(/^[A-Z].*\b[A-Z]{2}\b\s+\d{5}/i.test(cl)){address+=', '+cl;i++}}}
        }

        const key=normAddr(address);
        if(!compMap[key]&&price&&parseFloat(price)>0){
          compMap[key]={address,distance:distMatch[0],status,price,saleDate,beds,baths,bedBath:beds&&baths?beds+'/'+baths:'',sqft,lotSize,propertyType:propType,yearBuilt,
            listPrice:'',similarity:'',dom:'',pool:'',garageSpaces:'',flip:'',condition:'',classification:'asIs'};
        }
      }
      i++;
    }
  }

  // --- PASS 2: Extract detailed fields from column-format detail pages ---
  // These pages have "Subject  Comp 1  Comp 2 ..." header and row-per-field layout
  for(const pg of pageTexts){
    if(!/Selected\s+Sold\s*&?\s*Active\s+Comparable/i.test(pg.text))continue;
    // Detail pages have "Subject" and "Comp" labels but NOT the "# Address Distance" header
    if(/# Address/i.test(pg.text))continue;
    if(!/\bSubject\b/.test(pg.text)||!/\bComp\s+\d/i.test(pg.text))continue;

    const lines=pg.text.split('\n');

    // Determine number of columns from "Subject Comp 1 Comp 2..." header
    let numCols=0; // total columns including subject
    let compAddresses=[];
    for(let i=0;i<lines.length;i++){
      if(/^Subject\s+Comp/i.test(lines[i].trim())){
        numCols=1+(lines[i].match(/Comp\s+\d/gi)||[]).length;
        // Find address line — may be next line or merged with "Address" label
        for(let j=i+1;j<Math.min(i+4,lines.length);j++){
          const al=lines[j].trim();
          // Address line contains the subject address and comp addresses
          // Could start with "Address " label or just be the addresses
          let addrText=al.replace(/^Address\s+/i,'');
          // Skip if it's just "Address" alone or a city line
          if(/^Address$/i.test(al)||/^\d{5}$/.test(al))continue;
          if(!addrText||addrText.length<10)continue;
          // Split by 2+ spaces
          let addrs=addrText.split(/\s{2,}/).map(a=>a.trim()).filter(a=>a);
          if(addrs.length<numCols){
            // Try splitting by known address patterns (number + street)
            const addrParts=addrText.match(/\d+\s+[A-Z][a-zA-Z][\w\s]*?(?=\s+\d+\s+[A-Z]|$)/g);
            if(addrParts&&addrParts.length>=numCols)addrs=addrParts.map(a=>a.trim());
          }
          if(addrs.length>=2){
            // Find city line
            let cityLine='';
            for(let k=j+1;k<Math.min(j+3,lines.length);k++){
              const cl=lines[k].trim().replace(/^Address\s*/i,'');
              if(/\b[A-Z]{2}\b\s+\d{5}/.test(cl)){cityLine=cl;break}
            }
            const cities=cityLine?cityLine.split(/\s{2,}/).map(c=>c.trim()).filter(c=>c):[];
            compAddresses=addrs.map((a,idx)=>a+(cities[idx]?', '+cities[idx]:''));
            break;
          }
        }
        break;
      }
    }
    if(compAddresses.length<2)continue;

    // Helper: parse row values, aware of expected column count
    function parseRow(label,mode){
      // mode: 'dollar','number','yesno','text','condition','distance','date','proptype','status'
      const escaped=label.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      const re=new RegExp('^'+escaped+'(?![/\\w])\\s+','i');
      for(const line of lines){
        const trimmed=line.trim();
        if(!re.test(trimmed))continue;
        const after=trimmed.replace(re,'').trim();

        // Strategy depends on value type
        if(mode==='dollar'){
          // Split on $ boundaries: "$––  $1,039,900  $1,199,000"
          const parts=after.match(/\$[^\s$]+|\$?––[^\s]*/g)||after.split(/\s{2,}/);
          return parts.map(v=>v.trim());
        }
        if(mode==='number'||mode==='yesno'){
          // Simple single-token values separated by spaces
          return after.split(/\s+/).map(v=>v.trim());
        }
        if(mode==='distance'){
          // Values like "–– 0.33 mi 0.17 mi 0.17 mi 0.39 mi"
          const parts=after.match(/––|[\d.]+\s*mi/g);
          return parts?parts.map(v=>v.trim()):after.split(/\s{2,}/).map(v=>v.trim());
        }
        if(mode==='date'){
          const parts=after.match(/––|\d{1,2}\/\d{1,2}\/\d{4}/g);
          return parts||[];
        }
        if(mode==='sqft'){
          const parts=after.match(/––\s*ft²?|[\d,]+\s*ft²/g);
          return parts?parts.map(v=>v.replace(/\s*ft²?/,'').trim()):after.split(/\s{2,}/).map(v=>v.trim());
        }
        if(mode==='condition'){
          // Known condition values (multi-word)
          const known=['Excellent','Nearly New','Well Maintained','Worn But Adequate','Significant Repairs','Poor','Good','Fair','Average','Above Average','Below Average'];
          const vals=[];let rem=after;
          // Remove "––" entries first
          while(rem.startsWith('––')){vals.push('––');rem=rem.replace(/^––\s*/,'');}
          while(rem.length>0){
            let found=false;
            for(const k of known){
              if(rem.startsWith(k)){vals.push(k);rem=rem.substring(k.length).trim();found=true;break}
            }
            if(!found){
              // Take first word as unknown condition
              const m=rem.match(/^(\S+)\s*/);
              if(m){vals.push(m[1]);rem=rem.substring(m[0].length)}else break;
            }
          }
          return vals;
        }
        if(mode==='proptype'){
          const known=['Single Family Detached','Condominium','Townhouse','Multifamily','Manufactured'];
          const vals=[];let rem=after;
          while(rem.length>0){
            let found=false;
            for(const k of known){
              if(rem.startsWith(k)){vals.push(k);rem=rem.substring(k.length).trim();found=true;break}
            }
            if(!found){const m=rem.match(/^(\S+)\s*/);if(m){vals.push(m[1]);rem=rem.substring(m[0].length)}else break}
          }
          return vals;
        }
        if(mode==='status'){
          return after.match(/Closed|Active|Pending|––/gi)||[];
        }
        // Default: split by 2+ spaces
        const vals=after.split(/\s{2,}/).map(v=>v.trim());
        return vals;
      }
      return [];
    }

    const simVals=parseRow('Similarity','number');
    const listPriceVals=parseRow('List Price','dollar');
    const domVals=parseRow('Active D.O.M.','number');
    const poolVals=parseRow('Pool','yesno');
    const garageVals=parseRow('Garage Spaces','number');
    const flipVals=parseRow('Flip','yesno');
    const condVals=parseRow('Condition','condition');
    const yrVals=parseRow('Year Built','number');
    const salePriceVals=parseRow('Sale Price','dollar');
    const bedsVals=parseRow('Bedrooms','number');
    const bathsVals=parseRow('Bathrooms','number');
    const sqftVals=parseRow('Square Feet','sqft');
    const distVals=parseRow('Distance','distance');
    const saleDateVals=parseRow('Sale Date','date');
    const statusVals=parseRow('Listing Status','status');
    const propTypeVals=parseRow('Property Type','proptype');

    // Save subject property data (index 0)
    if(yrVals[0]&&yrVals[0]!=='––')result.subjectProperty.yearBuilt=yrVals[0];
    if(poolVals[0]&&poolVals[0]!=='––')result.subjectProperty.pool=poolVals[0];

    // Map detail data to comps (index 1+ corresponds to comp addresses 1+)
    for(let ci=1;ci<compAddresses.length;ci++){
      const cAddr=compAddresses[ci];
      const key=normAddr(cAddr);

      if(!compMap[key]){
        const price=salePriceVals[ci]?cleanPrice(salePriceVals[ci]):'';
        const beds=bedsVals[ci]||'';
        const baths=bathsVals[ci]||'';
        const sqft=sqftVals[ci]?cleanNum(sqftVals[ci]):'';
        compMap[key]={address:cAddr,distance:distVals[ci]||'',status:statusVals[ci]||'',price,
          saleDate:parseDate(saleDateVals[ci]||''),beds,baths,bedBath:beds&&baths?beds+'/'+baths:'',
          sqft,lotSize:'',propertyType:propTypeVals[ci]||'',yearBuilt:yrVals[ci]||'',
          listPrice:'',similarity:'',dom:'',pool:'',garageSpaces:'',flip:'',condition:'',classification:'asIs'};
      }

      const c=compMap[key];
      if(simVals[ci]&&simVals[ci]!=='––'&&!/–/.test(simVals[ci]))c.similarity=simVals[ci];
      if(listPriceVals[ci]&&!/–/.test(listPriceVals[ci]))c.listPrice=cleanPrice(listPriceVals[ci]);
      if(domVals[ci]&&domVals[ci]!=='––'&&!/–/.test(domVals[ci]))c.dom=domVals[ci];
      if(poolVals[ci]&&!/–/.test(poolVals[ci]))c.pool=poolVals[ci];
      if(garageVals[ci]&&!/–/.test(garageVals[ci]))c.garageSpaces=garageVals[ci];
      if(flipVals[ci]&&!/–/.test(flipVals[ci]))c.flip=flipVals[ci];
      if(condVals[ci]&&!/–/.test(condVals[ci]))c.condition=condVals[ci];
      if(yrVals[ci]&&!/–/.test(yrVals[ci])&&!c.yearBuilt)c.yearBuilt=yrVals[ci];
      if(propTypeVals[ci]&&!c.propertyType)c.propertyType=propTypeVals[ci];
    }
  }

  // Convert compMap to array
  result.comps=Object.values(compMap);

  // --- Extract Market Data from "Market Risk" / "Neighborhood & Subject Marketability" page ---
  for(const pg of pageTexts){
    if(!/Neighborhood\s*&?\s*Subject\s*Marketability/i.test(pg.text)&&!/Market\s+Risk/i.test(pg.text))continue;
    const lines=pg.text.split('\n');

    // Extract Risk of Decline + Risk Level + last year value
    const riskLine=pg.text.match(/Risk\s+of\s+Decline\s+Risk\s+Level\s+This\s+month\s+last\s+year[\s\S]*?([\d.]+)%\s+(Low|Neutral|Moderate|Medium|High|Very\s*High)\s+([\d.]+)%/i);
    if(riskLine){
      result.market.riskOfDecline=riskLine[1];
      result.market.riskLevel=riskLine[2];
      result.market.riskLastYear=riskLine[3];
    }else{
      const riskSimple=pg.text.match(/Risk\s+of\s+Decline[\s\S]*?([\d.]+)%/i);
      if(riskSimple)result.market.riskOfDecline=riskSimple[1];
      const lvlM=pg.text.match(/Risk\s+Level[\s\S]*?\b(Low|Neutral|Moderate|Medium|High|Very\s*High)\b/i);
      if(lvlM)result.market.riskLevel=lvlM[1];
    }

    // Extract MOS and DOM from "This month last year  This month" row
    for(let i=0;i<lines.length;i++){
      const ln=lines[i];
      if(/this\s+month\s+last\s+year/i.test(ln)&&/this\s+month/i.test(ln)){
        for(let j=i+1;j<Math.min(i+3,lines.length);j++){
          const vln=lines[j].trim();
          const nums=vln.match(/\d+/g);
          if(nums&&nums.length>=2){
            if(nums.length>=4){
              result.market.mosLastYear=nums[0];
              result.market.monthsOfSupply=nums[1];
              result.market.domLastYear=nums[2];
              result.market.avgDOM=nums[3];
            }else{
              result.market.monthsOfSupply=nums[0];
              result.market.avgDOM=nums[1];
            }
            break;
          }
        }
      }
    }

    // Extract HouseCanary Forecast (1yr, 2yr, 3yr growth + values)
    const forecastMatch=pg.text.match(/(?:3\s*Year\s*Growth|HouseCanary\s*Forecast)[\s\S]*?1\s*Year\s+([\d.]+)%\s*2\s*Year\s+([\d.]+)%\s*3\s*Year\s+([\d.]+)%/i);
    if(forecastMatch){
      result.market.forecast1yrPct=forecastMatch[1];
      result.market.forecast2yrPct=forecastMatch[2];
      result.market.forecast3yrPct=forecastMatch[3];
    }
    const fVals=pg.text.match(/20\d{2}\s+\$([\d,]+)\s+20\d{2}\s+\$([\d,]+)\s+20\d{2}\s+\$([\d,]+)/);
    if(fVals){
      result.market.forecast1yrVal=fVals[1].replace(/,/g,'');
      result.market.forecast2yrVal=fVals[2].replace(/,/g,'');
      result.market.forecast3yrVal=fVals[3].replace(/,/g,'');
      // Extract years
      const yrs=pg.text.match(/(20\d{2})\s+\$[\d,]+\s+(20\d{2})\s+\$[\d,]+\s+(20\d{2})\s+\$[\d,]+/);
      if(yrs){result.market.forecastYr1=yrs[1];result.market.forecastYr2=yrs[2];result.market.forecastYr3=yrs[3]}
    }

    break;
  }

  // Count active/closed/pending from comps
  const compArr=Object.values(compMap);
  const activeCt=compArr.filter(c=>/active/i.test(c.status)).length;
  const closedCt=compArr.filter(c=>/closed/i.test(c.status)).length;
  const pendingCt=compArr.filter(c=>/pending/i.test(c.status)).length;
  if(activeCt)result.market.activeFromComps=activeCt;
  if(closedCt)result.market.closedFromComps=closedCt;
  if(pendingCt)result.market.pendingFromComps=pendingCt;

  return result;
}

/* ═══════════════════════════════════════
   CMA (MLS) PDF PARSER
   ═══════════════════════════════════════ */
async function parseCMAPDF(file){
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const result={summary:{lpAvg:null,lpMedian:null,spAvg:null,spMedian:null,lpHigh:null,lpLow:null,spHigh:null,spLow:null}};
  const debug=[];

  // Collect every text item from every page with positions
  const allItems=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    for(const it of tc.items){
      if(!it.str||!it.str.trim())continue;
      allItems.push({
        str:it.str.trim(),
        x:Math.round(it.transform[4]),
        y:Math.round(it.transform[5]),
        page:p
      });
    }
  }

  debug.push('Total text items: '+allItems.length);
  // Show first 30 items for debugging
  debug.push('First 30 items: '+allItems.slice(0,30).map(it=>'['+it.str+' @'+it.x+','+it.y+']').join(' '));

  // Normalize: replace Unicode variants of $ and special whitespace
  const norm=s=>s.replace(/[\uFF04\uFE69]/g,'$').replace(/[\u00A0\u2000-\u200B\u202F\u205F\u3000]/g,' ');

  // Build line-grouped text: group items by Y (within 6px tolerance), sort by X
  const yGroups={};
  for(const it of allItems){
    let matched=false;
    for(const yk of Object.keys(yGroups)){
      if(Math.abs(Number(yk)-it.y)<=6){yGroups[yk].push(it);matched=true;break}
    }
    if(!matched)yGroups[it.y]=[it];
  }
  const lines=Object.entries(yGroups).sort((a,b)=>Number(b[0])-Number(a[0])).map(([y,items])=>{
    items.sort((a,b)=>a.x-b.x);
    return {y:Number(y),text:norm(items.map(i=>i.str).join(' ')),items};
  });

  // Also build one big raw string
  const rawText=norm(allItems.map(i=>i.str).join(' '));

  // Helper: find 4 dollar values from text
  const findDollarVals=(text)=>{
    // Try with $ sign first
    let vals=[...text.matchAll(/\$([\d,]+)/g)].map(m=>m[1].replace(/,/g,'')).filter(v=>v.length>=5);
    if(vals.length>=4)return vals.slice(0,4);
    // Try without $ - just large numbers
    vals=[...text.matchAll(/\b([\d,]{6,})\b/g)].map(m=>m[1].replace(/,/g,'')).filter(v=>Number(v)>=100000);
    if(vals.length>=4)return vals.slice(0,4);
    return null;
  };

  // Find LP and SP lines
  let lpVals=null,spVals=null;
  for(const ln of lines){
    const t=ln.text;
    if(!lpVals && /\bLP\s*:/i.test(t)){
      debug.push('LP line found: "'+t.substring(0,100)+'"');
      lpVals=findDollarVals(t);
      debug.push('LP vals extracted: '+JSON.stringify(lpVals));
    }
    if(!spVals && /\bSP\s*:/i.test(t)){
      debug.push('SP line found: "'+t.substring(0,100)+'"');
      spVals=findDollarVals(t);
      debug.push('SP vals extracted: '+JSON.stringify(spVals));
    }
  }

  // Fallback: search raw text for LP:/SP: and grab next 4 dollar values
  if(!lpVals||!spVals){
    debug.push('Fallback: searching raw text (length='+rawText.length+')');
    const tryRaw=(label)=>{
      const rx=new RegExp(label+'\\s*:','i');
      const m=rx.exec(rawText);
      if(!m)return null;
      const after=rawText.substring(m.index,m.index+400);
      debug.push('Raw after '+label+': "'+after.substring(0,120)+'"');
      return findDollarVals(after);
    };
    if(!lpVals){lpVals=tryRaw('LP');debug.push('Raw LP vals: '+JSON.stringify(lpVals))}
    if(!spVals){spVals=tryRaw('SP');debug.push('Raw SP vals: '+JSON.stringify(spVals))}
  }

  // Fallback 2: position-based — find items containing LP or SP, get same-Y items
  if(!lpVals||!spVals){
    debug.push('Position-based fallback');
    const findByPos=(label)=>{
      const labelItem=allItems.find(it=>new RegExp(label+'\\s*:','i').test(norm(it.str)));
      if(!labelItem){debug.push('No item found matching '+label+':');return null}
      debug.push('Found '+label+' item: "'+labelItem.str+'" at '+labelItem.x+','+labelItem.y);
      const sameY=allItems.filter(it=>Math.abs(it.y-labelItem.y)<=8).sort((a,b)=>a.x-b.x);
      const joined=norm(sameY.map(i=>i.str).join(' '));
      debug.push('Same-Y text: "'+joined.substring(0,120)+'"');
      return findDollarVals(joined);
    };
    if(!lpVals)lpVals=findByPos('LP');
    if(!spVals)spVals=findByPos('SP');
  }

  // Apply results — order is High, Low, Average, Median
  if(lpVals){result.summary.lpHigh=lpVals[0];result.summary.lpLow=lpVals[1];result.summary.lpAvg=lpVals[2];result.summary.lpMedian=lpVals[3]}
  if(spVals){result.summary.spHigh=spVals[0];result.summary.spLow=spVals[1];result.summary.spAvg=spVals[2];result.summary.spMedian=spVals[3]}

  debug.push('FINAL: lpVals='+JSON.stringify(lpVals)+' spVals='+JSON.stringify(spVals));
  result.summary._debug=debug.join('\n');
  return result;
}

/* ═══════════════════════════════════════
   RENO DOCX PARSER
   ═══════════════════════════════════════ */
async function parseRenoDocx(file){
  const buf=await file.arrayBuffer();
  const zip=await JSZip.loadAsync(buf);
  const xml=await zip.file('word/document.xml').async('string');
  const doc=new DOMParser().parseFromString(xml,'application/xml');
  const result={lineItems:[],poolOptions:[],contingency:null,subtotal:null,totals:[],keyNotes:[],propertyInfo:{}};

  function cleanNum(s){if(!s||s==='-')return 0;return Number(s.replace(/[$,\s]/g,'').split('/')[0].replace(/[^0-9.\-]/g,''))||0}
  function getCellText(cell){const ts=cell.getElementsByTagName('w:t');let s='';for(let i=0;i<ts.length;i++)s+=ts[i].textContent;return s.trim()}

  // Extract paragraphs for Key Notes and Property Info
  const paras=doc.getElementsByTagName('w:p');
  let inKeyNotes=false;
  for(let i=0;i<paras.length;i++){
    const t=getCellText(paras[i]);
    if(!t)continue;
    if(/^key\s*notes$/i.test(t)){inKeyNotes=true;continue}
    if(inKeyNotes){
      // Stop when we hit a table or non-note content
      if(t.match(/^(Category|Materials|Labor)/i))break;
      if(t.match(/^Range:/i)){result.keyNotes.push(t);inKeyNotes=false;continue}
      if(t.length>10)result.keyNotes.push(t);
    }
    // Property info extraction
    if(t.includes('ARV:'))result.propertyInfo.arv=cleanNum(t.match(/ARV:\s*\$([\d,]+)/)?.[0]||'');
    if(t.includes('Size:'))result.propertyInfo.size=t.match(/Size:\s*(.+)/)?.[1]?.split('\n')[0]||'';
  }

  // Row classification
  function classifyRow(cat){
    const c=cat.toLowerCase();
    if(!cat||c==='category')return'header';
    if(/^subtotal/i.test(c))return'subtotal';
    if(/^total/i.test(c))return'total';
    if(/^contingency/i.test(c))return'contingency';
    if(/pool\s*-\s*fill/i.test(c)||/pool\s*-\s*renovate/i.test(c))return'pool_option';
    if(cat.trim()==='')return'blank';
    return'line_item';
  }

  // Parse tables
  const tables=doc.getElementsByTagName('w:tbl');
  for(let ti=0;ti<tables.length;ti++){
    const rows=tables[ti].getElementsByTagName('w:tr');
    for(let ri=0;ri<rows.length;ri++){
      const cells=rows[ri].getElementsByTagName('w:tc');
      const vals=[];for(let ci=0;ci<cells.length;ci++)vals.push(getCellText(cells[ci]));
      if(vals.length<4)continue;
      const cat=vals[0],type=classifyRow(cat);
      if(type==='header'||type==='blank')continue;
      const row={category:cat,materials:cleanNum(vals[1]),labor:cleanNum(vals[2]),total:cleanNum(vals[3]),notes:vals[4]||''};
      if(type==='line_item')result.lineItems.push(row);
      else if(type==='pool_option')result.poolOptions.push(row);
      else if(type==='contingency'){
        // Parse contingency percentage from category text or notes
        const pctMatch=(cat+' '+row.notes).match(/(\d+)\s*%/);
        result.contingency={...row,pct:pctMatch?Number(pctMatch[1])/100:0.1};
      }
      else if(type==='subtotal')result.subtotal=row;
      else if(type==='total')result.totals.push(row);
    }
  }
  return result;
}

/* Grows to fit its content, so text written by the bot or pulled in from a sync
   is never hidden below the visible box. Module scope on purpose: declared
   inside a component it would remount on every keystroke and lose focus.
   Re-fits whenever the value changes, which covers programmatic writes as well
   as typing. */
function AutoTextarea({value,onChange,minHeight=34,maxHeight=400,style,...rest}){
  const ref=useRef(null);
  const fit=useCallback(()=>{
    const el=ref.current; if(!el)return;
    el.style.height='auto';
    const h=Math.min(Math.max(el.scrollHeight,minHeight),maxHeight);
    el.style.height=h+'px';
    // Only show a scrollbar once the content passes the cap.
    el.style.overflowY=el.scrollHeight>maxHeight?'auto':'hidden';
  },[minHeight,maxHeight]);
  useEffect(()=>{fit()},[value,fit]);
  // The box has no width until its tab is painted, so scrollHeight is wrong on
  // first render. Re-fit once the browser has laid it out.
  useEffect(()=>{const t=setTimeout(fit,0);return()=>clearTimeout(t)},[fit]);
  return <textarea ref={ref} value={value??''} rows={1}
    onChange={e=>{onChange&&onChange(e);fit()}}
    style={{resize:'vertical',minHeight,overflowY:'hidden',...style}} {...rest}/>;
}

/* Match a comp package to a deal. The dispatcher passes the Airtable record id,
   the app generates its own deal id, and neither knows about the other, so try
   in order of confidence and report which way it matched. Address matching is a
   fallback, never silent: the preview names the deal it chose. */
function normAddr(a){
  return String(a||'').toLowerCase().replace(/[.,#]/g,' ')
    .replace(/\b(st|street|rd|road|dr|drive|ln|lane|ave|avenue|ct|court|pl|place|way|blvd|cir|circle|trl|trail)\b/g,'')
    .replace(/\b(az|ca|nv|arizona|california|nevada)\b/g,'')
    .replace(/\b\d{5}(-\d{4})?\b/g,'')
    .replace(/\s+/g,' ').trim();
}
function matchPackageToDeal(pkgRow,deals){
  if(!pkgRow)return{deal:null,how:'none'};
  const byId=deals.find(d=>d.id===pkgRow.dealId);
  if(byId)return{deal:byId,how:'deal id'};
  const byRec=pkgRow.dealId&&deals.find(d=>d.leadRecordId&&d.leadRecordId===pkgRow.dealId);
  if(byRec)return{deal:byRec,how:'Airtable record id'};
  // One side usually carries city and state and the other does not, so compare
  // by prefix rather than equality. The shorter string must be a whole-token
  // prefix of the longer, which keeps "910 E Kristal" matching "910 E Kristal
  // Way, Phoenix AZ" while "912" never matches "910".
  const target=normAddr(pkgRow.address);
  if(target){
    const pre=(a,b)=>a===b||(a.length>b.length?a.startsWith(b+' '):b.startsWith(a+' '));
    const hits=deals.filter(d=>{
      const da=normAddr(d.fdif&&d.fdif.address);
      return da&&pre(da,target);
    });
    if(hits.length===1)return{deal:hits[0],how:'address'};
    if(hits.length>1)return{deal:null,how:'ambiguous address'};
  }
  return{deal:null,how:'none'};
}

/* ── ARV RESOLUTION ────────────────────────────────────────────────
   When an underwriter package carries explicit valuations, those govern. The
   package adjusts every comp to the subject (size, beds, pool, lot, style,
   condition) and weights by reliability. The app's own figure is an unweighted
   $/sqft average with no adjustments, which on a property whose comps differ in
   bed count, pool and condition runs high. It stays visible as a cross-check,
   never as the number the deal is priced on. */
function resolveARVs(deal,sqft){
  const comps=deal.comps||{};
  const aiC=(comps.asIs||[]).filter(c=>/closed/i.test(c.status||'')||!c.status);
  const rnC=(comps.renovated||[]).filter(c=>/closed/i.test(c.status||'')||!c.status);
  const compAsIs=calcARV(aiC,sqft,(comps.adjustAsIs||100)/100);
  const compReno=calcARV(rnC,sqft,(comps.adjustReno||100)/100);
  const v=(deal.uwPackage&&deal.uwPackage.valuations)||null;
  const useUW=!!(deal.uwPackage&&deal.uwPackage.useArvOverride!==false&&v);
  const pkgAsIs=useUW&&v.asIs&&v.asIs.value>0?v.asIs.value:null;
  const pkgReno=useUW&&v.arv&&v.arv.value>0?v.arv.value:null;
  const pkgLight=useUW&&v.lightPrep&&v.lightPrep.value>0?v.lightPrep.value:null;
  const dev=(a,b)=>(a&&b)?Math.abs(a-b)/b:null;
  return{
    aiARV:pkgAsIs||compAsIs,
    frARV:pkgReno||compReno,
    lightARV:pkgLight,
    compAsIs,compReno,
    source:(pkgAsIs||pkgReno)?'underwriter':'comps',
    asIsDeviation:dev(compAsIs,pkgAsIs),
    renoDeviation:dev(compReno,pkgReno),
  };
}

/* ── UNDERWRITER COMP PACKAGE ──────────────────────────────────────
   Replaces the HouseCanary paste. Tolerant by design: the bot's output has
   changed shape once already, so anything missing is reported rather than
   guessed, and nothing is applied until the operator approves the preview. */
const CP_COND=['Nearly New','Excellent','Well Maintained','Worn But Adequate','Significant Repairs'];

function parseCompPackage(raw){
  let d=raw;
  if(typeof raw==='string'){
    try{d=JSON.parse(raw)}catch(e){return{ok:false,error:'Not valid JSON: '+e.message}}
  }
  if(!d||typeof d!=='object')return{ok:false,error:'Empty or unreadable package.'};
  const warn=[];
  const num=v=>{const n=pn(v);return n>0?n:null};
  const s=d.subject||{};

  // Valuations: the bot has emitted these two different ways. Read both.
  const V=d.valuations||{};
  const band=(o,fallbackVal,fallbackLo,fallbackHi)=>{
    if(o&&typeof o==='object')return{value:num(o.value),low:num(o.low),high:num(o.high),confidence:o.confidence||''};
    return{value:num(fallbackVal),low:num(fallbackLo),high:num(fallbackHi),confidence:''};
  };
  const asIs=band(V.asIs,s.estimatedValue,s.estimatedValueLow,s.estimatedValueHigh);
  const lightPrep=band(V.lightPrep);
  const arv=band(V.arv);
  if(!arv.value)warn.push('No ARV in the package. Every exit and MAO is built on ARV, so it will fall back to the value computed from the renovated comps.');
  if(!asIs.value)warn.push('No as-is value in the package.');

  const comps=(Array.isArray(d.comps)?d.comps:[]).map(c=>{
    const beds=pn(c.beds),baths=pn(c.baths);
    const cond=CP_COND.includes(c.condition)?c.condition:'';
    if(c.condition&&!cond)warn.push('Unrecognised condition "'+c.condition+'" on '+(c.address||'a comp')+', left blank.');
    return{
      address:String(c.address||'').trim(),
      price:c.salePrice?String(pn(c.salePrice)):'',
      listPrice:c.listPrice?String(pn(c.listPrice)):'',
      sqft:c.sqft?String(pn(c.sqft)):'',
      bedBath:(beds||baths)?((beds||'')+'/'+(baths||'')):'',
      saleDate:String(c.saleDate||'').trim(),
      status:['Closed','Active','Pending'].includes(c.status)?c.status:'',
      distance:c.distanceMiles!=null?String(c.distanceMiles):'',
      dom:c.daysOnMarket!=null?String(c.daysOnMarket):'',
      yearBuilt:c.yearBuilt?String(pn(c.yearBuilt)):'',
      condition:cond,
      pool:c.pool===true?'Yes':c.pool===false?'No':'',
      garageSpaces:c.garageSpaces!=null?String(c.garageSpaces):'',
      notes:String(c.note||'').trim(),
      classification:c.classification==='renovated'?'renovated':'asIs',
      flip:'',similarity:'',
    };
  }).filter(c=>c.address);

  comps.forEach(c=>{
    if(c.status==='Closed'&&(!c.price||!c.sqft))
      warn.push(c.address+' is closed but missing '+(!c.price?'sale price':'square footage')+', so it cannot contribute to value.');
    if(!c.status)warn.push(c.address+' has no status, so it will be treated as unusable for valuation.');
  });
  if(!comps.length)warn.push('No comps in the package.');

  const closed=comps.filter(c=>c.status==='Closed');
  if(closed.filter(c=>c.classification==='renovated').length===0)
    warn.push('No closed renovated comps, so the renovated ARV cannot be computed from comps.');
  if(closed.filter(c=>c.classification==='asIs').length===0)
    warn.push('No closed as-is comps.');

  const subject={
    address:String(s.address||'').trim(),
    bedsBaths:(pn(s.beds)||pn(s.baths))?((pn(s.beds)||'')+'/'+(pn(s.baths)||'')):'',
    sqft:s.sqft?String(pn(s.sqft)):'',
    lotSize:s.lotSqft?pn(s.lotSqft).toLocaleString()+' sqft':'',
    yearBuilt:s.yearBuilt?String(pn(s.yearBuilt)):'',
    poolDetails:s.pool===true?'Yes':s.pool===false?'No':'',
  };

  const m=d.market||{};
  const market={
    activeListings:m.activeListings!=null?String(m.activeListings):'',
    closedLast30:m.closedLast30!=null?String(m.closedLast30):'',
  };
  const mao=d.underwriterMAO||{};
  return{ok:true,dealId:String(d.dealId||'').trim(),subject,comps,market,
    valuations:{asIs,lightPrep,arv},
    // lightContract is the light rent-ready lane. The bot marks it photo
    // dependent because it assumes a condition nobody has verified yet, so it
    // stays hidden until photos are actually in hand.
    underwriterMAO:{contract:num(mao.contract),funded:num(mao.funded),target:num(mao.target),
      lightContract:num(mao.lightContract),
      lightPhotoDependent:mao.lightContractPhotoDependent!==false},
    warnings:warn,
    counts:{total:comps.length,closed:closed.length,
      asIsClosed:closed.filter(c=>c.classification==='asIs').length,
      renovatedClosed:closed.filter(c=>c.classification==='renovated').length,
      context:comps.length-closed.length}};
}

/* ── RENOVATION SCREENING TIERS ────────────────────────────────────
   Screening rates for the Quick Offer, not scoped budgets. Rates are per
   market because Phoenix labour and materials do not price San Diego work.
   A market with no saved rates falls back to the default set. */
const RENO_TIER_DEFS=[
  {id:'refresh',  label:'Refresh',          desc:'Interior paint, minor repairs, deep clean, trash-out. Existing flooring stays. Wholetail-grade.'},
  {id:'cosmetic', label:'Cosmetic',         desc:'Paint, new flooring, light fixtures and hardware, landscaping and curb, minor repairs. No kitchen or bath remodel.'},

  {id:'major',    label:'Major / Structural',desc:'Full gut plus foundation work, added square footage, or fire and flood restoration.'},
];
const DEFAULT_TIER_ID='cosmetic';
/* Seeded from the Phoenix market. Other markets inherit these until set. */
const DEFAULT_RENO_RATES={refresh:8,cosmetic:22,moderate:38,heavy:68,major:90};
const SEED_MARKET_RATES={__default:{...DEFAULT_RENO_RATES},Phoenix:{...DEFAULT_RENO_RATES}};

/* Resolve the rate card for a market: its own rates, else the saved default,
   else the seeded values. Always returns all five tiers in order. */
function renoTiersFor(marketRates,market){
  const mr=marketRates||{};
  const key=String(market||'').trim();
  const rates={...DEFAULT_RENO_RATES,...(mr.__default||{}),...(key&&mr[key]?mr[key]:{})};
  return RENO_TIER_DEFS.map(t=>({...t,psf:Number(rates[t.id])||0}));
}
function marketHasOwnRates(marketRates,market){
  const key=String(market||'').trim();
  return !!(key&&marketRates&&marketRates[key]);
}

/* A deal is "empty" if nothing meaningful has been entered. Used to prune the
   leftover "New Deal" placeholders that otherwise pile up in the deal dropdown. */
function isEmptyDeal(d){
  if(!d)return false;
  const f=d.fdif||{};
  // An empty object (e.g. yesChecks:{}) must not count as entered data,
  // or blank placeholders start syncing again.
  const filled=v=>{
    if(v===''||v===false||v==null)return false;
    if(typeof v==='object')return Object.values(v).some(filled);
    return true;
  };
  if(Object.values(f).some(filled))return false;
  if((d.photos||[]).length)return false;
  if(d.renoCustom)return false;
  if(d.renoPSF||d.qfRenoPSF||d.qfArv)return false;
  const u=d.underwriting||{};
  if(u.purchasePrice)return false;
  const compHas=arr=>(arr||[]).some(c=>Object.entries(c).some(([k,v])=>k!=='id'&&k!=='classification'&&v!==''&&v!=null));
  if(compHas(d.comps&&d.comps.asIs)||compHas(d.comps&&d.comps.renovated))return false;
  return true;
}
