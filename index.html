}

/* Underwriting assumption fields, shared by the deal-level editor and the
   investor profile editor so the two can never drift apart. */
const UW_FIELDS=[['closingCostBuy','Buy Closing %',0.1],['propTaxRate','Property Tax Rate %',0.1],['insuranceAnnual','Insurance $/yr',100],['utilitiesMonthly','Utilities $/mo',50],['contingencyPct','Contingency %',1],['loanPoints','Loan Points %',0.5],['ltc','LTC %',1],['ltv','LTV %',1],['interestRate','Interest Rate %',0.1],['lenderFees','Lender Fees $',100],['listingCommPct','Listing Agent %',0.5],['buyerCommPct','Buyer Agent %',0.5],['titleEscrowPct','Title/Escrow %',0.5],['minProfitTarget','Min Profit Target $',5000],['targetProfit','Target Profit $',5000],['minROI','Min ROI %',1],['targetROI','Target ROI %',1]];

/* Investor capital profiles are read from the DFYA Buy Box table in Airtable,
   which the onboarding questionnaire already populates. The app does not keep
   its own copy, so there is one place to maintain an investor's terms. */
function useBuyBox(){
  const[profiles,setProfiles]=useState([]);
  const[state,setState]=useState('idle');   // idle|loading|ready|error
  const[err,setErr]=useState('');
  const load=useCallback(async()=>{
    setState('loading');
    try{
      const r=await syncCall('buybox_list',{});
      setProfiles(r.records||[]);setState('ready');setErr('');
      return r.records||[];
    }catch(e){setState('error');setErr(e.message);return null}
  },[]);
  useEffect(()=>{load()},[load]);
  return{profiles,state,err,reload:load};
}

function InvestorPanel({D,u,uwDefaults}){
  const bb=useBuyBox();
  const investors=bb.profiles;
  const linkedId=D.deal.investorId||'';
  const linked=investors.find(i=>i.id===linkedId);
  // Does the deal still match the profile it was loaded from?
  const drifted=linked&&UW_FIELDS.some(([k])=>{
    const a=(linked.uw||{})[k]??DEF_UW[k], b=uwDefaults[k]??DEF_UW[k];
    return Number(a)!==Number(b);
  });

  // Buy box checks. Advisory only: a deal outside the box may still be worth
  // underwriting for an internal exit if the investor passes.
  const dealMkt=(D.deal.fdif.marketArea||'').trim();
  const invMkts=((linked&&linked.markets)||'').split(/[,\n]/).map(s=>s.trim()).filter(Boolean);
  const mktMismatch=linked&&invMkts.length&&dealMkt&&!invMkts.some(m=>m.toLowerCase().includes(dealMkt.toLowerCase())||dealMkt.toLowerCase().includes(m.toLowerCase()));

  return <div className="card mb4" style={{borderLeft:'4px solid '+(linked?'var(--accent)':'var(--border)')}}>
    <div className="card-h" style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,flexWrap:'wrap'}}>
      <span>Investor Capital Profile</span>
      {linked
        ? <span style={{fontSize:'.78rem',fontWeight:700,color:'var(--accent)'}}>{linked.name}{linked.company?' \u00b7 '+linked.company:''}</span>
        : <span style={{fontSize:'.75rem',fontWeight:600,color:'var(--text-sec)'}}>No investor selected, using TPHP house defaults</span>}
    </div>
    <div className="card-b">
      <div style={{display:'flex',gap:10,alignItems:'flex-end',flexWrap:'wrap'}}>
        <div className="fg" style={{flex:'1 1 280px',marginBottom:0}}>
          <label>Load a saved investor {bb.state==='loading'&&<span style={{fontWeight:400,color:'var(--text-sec)'}}>(loading...)</span>}</label>
          <select className="inp" value={linkedId} disabled={bb.state==='loading'} onChange={e=>{
            const v=e.target.value;
            if(!v){D.clearInvestor();return}
            const inv=investors.find(i=>i.id===v);
            if(!inv)return;
            if(!inv.complete&&!confirm(inv.name+"'s questionnaire is missing "+inv.missing.length+" underwriting field(s):\n\n"+inv.missing.join(', ')+"\n\nLoad anyway? Missing values fall back to TPHP defaults."))return;
            else if(inv.complete&&!confirm('Load '+inv.name+"'s assumptions into this deal?\n\nThis replaces the underwriting assumptions below."))return;
            D.applyInvestorProfile(inv);
          }}>
            <option value="">TPHP house defaults</option>
            {investors.map(i=><option key={i.id} value={i.id}>{i.name}{i.company?' ('+i.company+')':''}{i.complete?'':'  \u26a0 incomplete'}</option>)}
          </select>
        </div>
        <button className="btn btn-sm btn-s" disabled={bb.state==='loading'} onClick={async()=>{
          // Reloading the list alone left the deal holding its old snapshot, with
          // no way to pull corrected terms onto it: re-picking the same investor
          // in the dropdown fires no change event. Re-apply here instead.
          const fresh=await bb.reload();
          if(!linkedId)return;
          const inv=(fresh||[]).find(i=>i.id===linkedId);
          if(!inv){alert('That investor is no longer in the DFYA Buy Box table.');return}
          const differs=UW_FIELDS.some(([k])=>Number((inv.uw||{})[k]??DEF_UW[k])!==Number(uwDefaults[k]??DEF_UW[k]));
          if(!differs){alert('Already up to date with '+inv.name+"'s Buy Box record.");return}
          if(confirm("Pull "+inv.name+"'s current Buy Box terms onto this deal?\n\nThis replaces the underwriting assumptions below, including any edits you made here."))
            D.applyInvestorProfile(inv);
        }}>Refresh from Airtable</button>
      </div>

      <div style={{marginTop:10,fontSize:'.75rem',color:'var(--text-sec)'}}>
        Profiles come from the <strong>DFYA Buy Box</strong> table. Edit an investor's terms there, then Refresh.
      </div>

      {bb.state==='error'&&<div className="warn-box" style={{marginTop:10,fontSize:'.78rem'}}>
        Could not load investor profiles: {bb.err}
      </div>}
      {bb.state==='ready'&&!investors.length&&<div style={{marginTop:10,fontSize:'.78rem',color:'var(--text-sec)'}}>
        No investor profiles found in DFYA Buy Box yet.
      </div>}

      {linked&&!linked.complete&&<div className="warn-box" style={{marginTop:10,fontSize:'.78rem'}}>
        <strong>{linked.name}'s questionnaire is incomplete.</strong> Missing: {linked.missing.join(', ')}.
        Those fields fell back to TPHP defaults, so this underwriting is not fully their terms.
      </div>}

      {mktMismatch&&<div className="warn-box" style={{marginTop:10,fontSize:'.78rem'}}>
        <strong>Outside {linked.name}'s stated markets.</strong> This deal is in {dealMkt}. Their Geographic Targets read: {linked.markets}.
        Still worth underwriting for an internal exit if they pass.
      </div>}

      {drifted&&<div className="warn-box" style={{marginTop:10,fontSize:'.78rem'}}>
        The assumptions on this deal no longer match {linked.name}'s Buy Box record. Fine for a one-off. If these are their new standing terms, update the DFYA Buy Box table.
      </div>}

      {linked&&(linked.contact||linked.propertyTypes||linked.conditionNotes)&&<div style={{marginTop:10,fontSize:'.75rem',color:'var(--text-sec)',lineHeight:1.6}}>
        {linked.contact&&<div>Contact: {linked.contact}</div>}
        {linked.propertyTypes&&<div>Property types: {linked.propertyTypes}</div>}
        {linked.excludes&&<div>Hard excludes: {linked.excludes}</div>}
        {linked.conditionNotes&&<div>Condition tolerance: {linked.conditionNotes}</div>}
      </div>}
    </div>
  </div>;
}

function TabUW({D}){

  const iaRenoChoice=iaData.renoChoice||'qf';

  const rnC=comps.renovated.filter(c=>c.price&&c.sqft).map(c=>({price:pn(c.price),sqft:pn(c.sqft)}));
  const arvRes=resolveARVs(D.deal,sqft);
  const frARV=arvRes.frARV, aiARV=arvRes.aiARV;
  const qfArvOverride=pn(D.deal.qfArv||'');
  const qfARV=qfArvOverride||aiARV;
  const rc1=renoCustom||{};

  const baseFr=useMemo(()=>calcRenoBudget(renoScope,rc1,cpct1),[renoScope,rc1,cpct1]);
  const fr=useMemo(()=>{
    if(renoPSFVal>0&&sqft){
      const sub=Math.round(renoPSFVal*sqft);
      const pct=cpct1!=null?cpct1/100:0.2;
      return{lineItems:baseFr.lineItems,subtotal:sub,contingency:Math.round(sub*pct),total:Math.round(sub*(1+pct)),contingencyPct:pct};
    }
    return baseFr;
  },[baseFr,renoPSFVal,sqft,cpct1]);
  const baseQf=useMemo(()=>calcQFBudget(fr.lineItems,fr.contingencyPct),[fr]);
  const qfPSFVal=pn(D.deal.qfRenoPSF||'');
  const qf=useMemo(()=>{
    if(qfPSFVal>0&&sqft){const sub=Math.round(qfPSFVal*sqft);const pct=cpct1!=null?cpct1/100:0.2;return{lineItems:baseQf.lineItems,subtotal:sub,contingency:Math.round(sub*pct),total:Math.round(sub*(1+pct)),contingencyPct:pct};}
    return baseQf;
  },[baseQf,qfPSFVal,sqft,cpct1]);
  const aib=useMemo(()=>calcAIBudget(fr.lineItems,fr.contingencyPct),[fr]);

  const v=(i,f)=>res[i]?.[f]??null;

  const sgs=useMemo(()=>res.map((r,i)=>r?calcSens(r.netProfit,arvs[i],r.totalReno):null),[res,arvs]);

  const hasData=pp>0&&(frARV||aiARV);

  const selExits=Array.isArray(D.deal.selectedExits)?D.deal.selectedExits:DEFAULT_EXITS;
  const allExits=useMemo(()=>buildExits({
    pp,sqft,arvReno:arvs[0],arvQf:arvs[1],arvAsIs:arvs[2],

    iaHold,u,dpAmt,hoaMonthly:fdifHOA,

    iaCalc:({arv,renoSubtotal,holdMonths})=>calcIA({purchasePrice:iaPP||pp,arv,sqft,holdMonths,renoSubtotal,
      contingencyPct:iau.contingencyPct,ia:iau,hoaMonthly:fdifHOA,
      takeover:{on:!!iaData.takeover,balance:takeoverBalance,payment:takeoverPayment,escrowed:iaData.takeoverEscrowed!==false}}),
  }),[pp,sqft,JSON.stringify(arvs),JSON.stringify(rsubs),JSON.stringify(holds),iaHold,dpAmt,fdifHOA,
      JSON.stringify(D.deal.exitBasis),iaRenoChoice,JSON.stringify(u),iaPP,iaData.takeover,takeoverBalance,takeoverPayment,JSON.stringify(iau)]);

  return <div>

// Resize a File (image) to a max longest-edge dimension and return a JPEG data URL.
// Defaults chosen to give print-quality PDF output at ~3.5x3" cells while keeping size down.
function resizeImageFile(file,{maxDim=1200,quality=0.78}={}){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('Could not read '+file.name));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('Invalid image: '+file.name));
      img.onload=()=>{
        const w=img.naturalWidth,h=img.naturalHeight;
        const longest=Math.max(w,h);
        const scale=longest>maxDim?maxDim/longest:1;
        const tw=Math.round(w*scale),th=Math.round(h*scale);
        const canvas=document.createElement('canvas');
        canvas.width=tw;canvas.height=th;
        const ctx=canvas.getContext('2d');
        ctx.fillStyle='#ffffff';ctx.fillRect(0,0,tw,th); // flatten transparency
        ctx.drawImage(img,0,0,tw,th);
        resolve({dataUrl:canvas.toDataURL('image/jpeg',quality),width:tw,height:th});
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function generateDealPDF({fdif,pp,sqft,aiARV,frARV,qfARV,fr,holds,res,comps,u,mc,vc,vt,market,sgs,photos,renoCustom,renoScope,exits,sellerSummary}){
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'letter'});
  const W=215.9,H=279.4,M=18,CW=W-2*M;
  let y=0;
  const navy='#1a2332',accent='#2563eb',green='#16a34a',amber='#d97706',red='#dc2626';
  const addPage=()=>{doc.addPage();y=M;drawFooter()};
  const checkY=(need)=>{if(y+need>H-20){addPage();return true}return false};
  // Track footed pages: addPage() draws a footer, and several sections also
  // call drawFooter() directly. Without this the two overlap and print twice.
  const footed=new Set();
  const drawFooter=()=>{
    const pg=doc.internal.getCurrentPageInfo().pageNumber;
    if(footed.has(pg))return;
    footed.add(pg);
    doc.setFontSize(7);doc.setTextColor(150);
    doc.text('Torrey Pines House Partners — Confidential',M,H-8);
    doc.text('Generated '+new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}),W-M,H-8,{align:'right'});
    doc.setDrawColor(200);doc.line(M,H-12,W-M,H-12);
  };

  // ─── HEADER BAR ───
  doc.setFillColor(26,35,50);doc.rect(0,0,W,28,'F');
  try{doc.addImage(LOGO_MD,'PNG',M,2,48,20)}catch(e){
    doc.setFontSize(8);doc.setFont('helvetica','normal');doc.setTextColor(255,255,255);
    doc.text('TORREY PINES',M,10);
    doc.setFontSize(6.5);doc.setTextColor(200);doc.text('House Partners',M,14.5);
  }
  doc.setFontSize(16);doc.setTextColor(255);doc.setFont('helvetica','bold');
  doc.text('Deal Summary',M+54,13);
  doc.setFontSize(8);doc.setFont('helvetica','normal');doc.setTextColor(180);
  doc.text(new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}),W-M,13,{align:'right'});
  y=34;

  // ─── PROPERTY HEADER ───
  doc.setFontSize(14);doc.setFont('helvetica','bold');doc.setTextColor(26,35,50);
  doc.text(fdif.address||'No Address',M,y);y+=5;
  doc.setFontSize(9);doc.setFont('helvetica','normal');doc.setTextColor(100);
  const propLine=[fdif.bedsBaths,sqft?sqft.toLocaleString()+' SF':'',fdif.yearBuilt?'Built '+fdif.yearBuilt:''].filter(Boolean).join('  |  ');
  doc.text(propLine,M,y);y+=4;
  doc.setTextColor(mc==='Seller\'s Market'?220:mc==='Buyer\'s Market'?37:217, mc==='Seller\'s Market'?38:mc==='Buyer\'s Market'?163:119, mc==='Seller\'s Market'?38:mc==='Buyer\'s Market'?74:6);
  doc.setFont('helvetica','bold');doc.text(mc||'',M,y);y+=6;

  // ─── VERDICT ───
  const vCol=vc==='go'?green:vc==='maybe'?amber:red;
  doc.setFillColor(...(vc==='go'?[220,252,231]:vc==='maybe'?[254,243,199]:[254,226,226]));
  doc.roundedRect(M,y,CW,10,2,2,'F');
  doc.setFontSize(9);doc.setFont('helvetica','bold');
  doc.setTextColor(vc==='go'?22:vc==='maybe'?146:185,vc==='go'?101:vc==='maybe'?64:28,vc==='go'?52:vc==='maybe'?14:28);
  doc.text(vt||'',W/2,y+6.5,{align:'center',maxWidth:CW-8});y+=16;

  // ─── KEY METRICS ROW ───
  const metrics=[
    {lbl:'Purchase Price',val:fmt(pp),sub:sqft&&pp?fmtSF(pp/sqft):''},
    {lbl:'As-Is FMV',val:fmt(aiARV),sub:sqft&&aiARV?fmtSF(aiARV/sqft):''},
    {lbl:'Full Reno ARV',val:fmt(frARV),sub:sqft&&frARV?fmtSF(frARV/sqft):''},
    {lbl:'Full Reno Budget',val:fmt(fr.total),sub:sqft?fmtSF(fr.total/sqft):''},
  ];
  const mw=CW/4;
  metrics.forEach((m,i)=>{
    const x=M+i*mw;
    doc.setFillColor(i===0?232:245,i===0?240:245,i===0?254:250);doc.roundedRect(x+1,y,mw-2,18,1.5,1.5,'F');
    doc.setFontSize(7);doc.setFont('helvetica','normal');doc.setTextColor(120);doc.text(m.lbl,x+mw/2,y+5,{align:'center'});
    doc.setFontSize(11);doc.setFont('helvetica','bold');doc.setTextColor(26,35,50);doc.text(m.val||'—',x+mw/2,y+11,{align:'center'});
    if(m.sub){doc.setFontSize(7);doc.setFont('helvetica','normal');doc.setTextColor(100);doc.text(m.sub,x+mw/2,y+15.5,{align:'center'})}
  });
  y+=24;

  // ─── SELLER MOTIVATION & SITUATION ───
  // Only when explicitly approved on the Deal Summary tab. An unapproved or
  // empty draft is left out rather than exported half-written.
  if(sellerSummary&&sellerSummary.approved&&String(sellerSummary.draft||'').trim()){
    checkY(30);
    doc.setFontSize(10);doc.setFont('helvetica','bold');doc.setTextColor(26,35,50);
    doc.text('Seller Motivation & Situation',M,y);y+=5;
    doc.setFontSize(8);doc.setFont('helvetica','normal');doc.setTextColor(60);
    const lines=doc.splitTextToSize(String(sellerSummary.draft).trim(),CW);
    lines.forEach(ln=>{checkY(6);doc.text(ln,M,y);y+=4.6});
    y+=6;
  }

  // ─── EXIT COMPARISON TABLE (driven by the exits selected on Underwriting) ───
  const ex=(exits&&exits.length?exits:[]);
  doc.setFontSize(10);doc.setFont('helvetica','bold');doc.setTextColor(26,35,50);
  doc.text(ex.length===1?'Exit Analysis':`${ex.length}-Exit Comparison`,M,y);y+=5;
  const metricW=CW*(ex.length>3?0.26:0.34);
  const colW=ex.length?(CW-metricW)/ex.length:CW;
  const cols=[{lbl:'Metric',w:metricW,a:'left'},
    ...ex.map(x=>({lbl:x.label+(x.hold?` (${x.hold}mo)`:''),w:colW,a:'right'}))];
  doc.setFillColor(26,35,50);doc.rect(M,y,CW,7,'F');
  doc.setFontSize(ex.length>3?6.2:7);doc.setFont('helvetica','bold');doc.setTextColor(255);
  let cx=M;cols.forEach(c=>{doc.text(c.lbl,c.a==='right'?cx+c.w-2:cx+2,y+5,{align:c.a});cx+=c.w});y+=7;

  const fv=v=>{if(v==null||v===''||isNaN(v))return'—';if(typeof v==='number'&&Math.abs(v)<2&&Math.abs(v)!==0&&!Number.isInteger(v))return fmtPct(v);return fmt(v)};
  const col=g=>ex.map(x=>{try{return g(x)}catch{return null}});
  const rows=[
    {lbl:'ARV',vals:col(x=>x.arv)},
    {lbl:'Reno Cost',vals:col(x=>x.res.totalReno)},
    {lbl:'Acq & Carry',vals:col(x=>x.res.totalAcqCarry)},
    {lbl:'Financing',vals:col(x=>x.res.totalFinancingCost)},
    {lbl:'Selling',vals:col(x=>x.res.totalSellingCost)},
    {lbl:'Total Project Cost',vals:col(x=>x.res.totalProjectCost),bold:true},
    {lbl:'Cash Required',vals:col(x=>x.res.cashAtClosing)},
    {lbl:'Net Profit',vals:col(x=>x.res.netProfit),bold:true,hl:true},
    {lbl:'ROI',vals:col(x=>x.res.allCostROI),pct:true},
    {lbl:'Cash-on-Cash',vals:col(x=>x.res.cashOnCash),pct:true},
    {lbl:'Profit / Month',vals:col(x=>x.res.profitPerMonth)},
    {lbl:`MAO (Min Profit: ${fmt(u.minProfitTarget)})`,vals:col(x=>x.res.mao),bold:true},
  ];

  rows.forEach((row,ri)=>{
    checkY(7);
    if(ri%2===0){doc.setFillColor(248,250,252);doc.rect(M,y,CW,7,'F')}
    if(row.bold){doc.setDrawColor(200);doc.line(M,y,M+CW,y)}
    doc.setFontSize(7.5);doc.setFont('helvetica',row.bold?'bold':'normal');
    doc.setTextColor(26,35,50);doc.text(row.lbl,M+2,y+5);
    cx=M+cols[0].w;
    const fvr=row.pct?(v=>{if(v==null||v===''||isNaN(v))return'—';return fmtPct(v)}):fv;
    row.vals.forEach((v,vi)=>{
      if(row.hl&&typeof v==='number'){
        doc.setTextColor(v>=100000?22:v>=0?146:185,v>=100000?101:v>=0?64:28,v>=100000?52:v>=0?14:28);
      }else{doc.setTextColor(50)}
      doc.text(fvr(v),cx+cols[vi+1].w-2,y+5,{align:'right'});
      cx+=cols[vi+1].w;
    });
    y+=7;
  });
  y+=6;

  // ─── COMPS TABLE ───
  checkY(30);
  doc.setFontSize(10);doc.setFont('helvetica','bold');doc.setTextColor(26,35,50);
  doc.text('Comparable Sales Used',M,y);y+=5;
  const allComps=[...comps.asIs.filter(c=>c.address).map(c=>({...c,tp:'AS-IS'})),...comps.renovated.filter(c=>c.address).map(c=>({...c,tp:'RENO'}))];
  if(allComps.length){
    const cc=[{lbl:'Type',w:13},{lbl:'Status',w:14},{lbl:'Address',w:46},{lbl:'Bed/Ba',w:12},{lbl:'SQFT',w:14},{lbl:'Price',w:20},{lbl:'$/SF',w:16},{lbl:'Flip',w:10},{lbl:'Pool',w:10},{lbl:'Sale Date',w:19}];
    const tw=cc.reduce((s,c)=>s+c.w,0);const sc=CW/tw;
    doc.setFillColor(26,35,50);doc.rect(M,y,CW,6,'F');
    doc.setFontSize(6.5);doc.setFont('helvetica','bold');doc.setTextColor(255);
    let hx=M;cc.forEach(c=>{doc.text(c.lbl,hx+1,y+4.2);hx+=c.w*sc});y+=6;
    const yesNo=(v)=>v===true||v==='Yes'||v==='yes'||v==='Y'?'Yes':(v===false||v==='No'||v==='no'||v==='N'?'No':(v?String(v):'—'));
    allComps.forEach((c,ci)=>{

// Parse pipe-delimited table rows into arrays
function parsePipeRows(text,colCount){
  if(!text||!text.trim())return [];
  return text.split('\n').map(ln=>ln.trim()).filter(Boolean).map(ln=>{
    const parts=ln.split('|').map(s=>s.trim());
    while(parts.length<colCount)parts.push('');
    return parts.slice(0,colCount);
  });
}
// Parse bullet list (one per line, leading "- " or "• " optional)
function parseBullets(text){
  if(!text||!text.trim())return [];
  return text.split('\n').map(ln=>ln.trim()).filter(Boolean).map(ln=>ln.replace(/^[•\-\*]\s*/,''));
}
// Parse friction/risk items formatted as "**bold lead** — rest of item"
function parseBoldItems(text){
  if(!text||!text.trim())return [];
  return text.split('\n').map(ln=>ln.trim()).filter(Boolean).map(ln=>{
    const m=ln.match(/^\*\*(.+?)\*\*\s*[—\-–:]*\s*(.*)$/);
    if(m)return{bold:m[1],body:m[2]};
    const m2=ln.match(/^([^—\-–:]+)\s*[—\-–:]\s*(.+)$/);
    if(m2)return{bold:m2[1].trim(),body:m2[2].trim()};
    return{bold:'',body:ln};
  });
}

// Map AI-prompt labels back to listingStrategy field names
const AI_BLOCK_TO_FIELD={
  INTRO_PARAGRAPH:'introParagraph',
  HEADLINE_RECOMMENDATION:'headlineRecommendation',
  THESIS_CALLOUT:'thesisCallout',
  PRICING_THESIS:'pricingThesis',
  PRICING_ROWS:'pricingStrategiesText',
  PRICING_CLOSING_LINE:'pricingClosingLine',
  TIMELINE_ANCHOR:'timelineAnchor',
  TIMELINE_ROWS:'timelineRowsText',
  TIMELINE_CRITICAL_PATH:'timelineCriticalPath',
  BUDGET_INTRO:'budgetIntro',
  BUDGET_ROWS:'budgetRowsText',
  BUDGET_TOTAL:'budgetTotal',
  BUDGET_NOT_SPENDING:'budgetNotSpending',
  HEADLINE_ANGLE:'headlineAngle',
  LEAD_FEATURES:'leadFeatures',
  TARGET_BUYERS:'targetBuyers',
  FRICTION_ITEMS:'frictionItems',
  RISK_ITEMS:'riskItems',
  FINANCIAL_ROWS:'financialRowsText',
  FINANCIAL_DISCLAIMER:'financialDisclaimer',
  NEXT_STEPS:'nextSteps',
  BOTTOM_LINE:'bottomLine',
  FOOTER_DISCLAIMER:'footerDisclaimer',
};

// Parse Claude's [LABEL] ... [NEXT_LABEL] output into a partial listingStrategy patch.
// Handles both "[LABEL]...text..." and "[LABEL]...text...[/LABEL]" styles.
function parseAIResponse(text){
  const out={};
  if(!text||!text.trim())return out;
  // Strip closing tags like [/INTRO_PARAGRAPH]
  const cleaned=text.replace(/\[\/[A-Z_]+\]/g,'');
  const labels=Object.keys(AI_BLOCK_TO_FIELD);
  const labelRe=new RegExp('\\[('+labels.join('|')+')\\]([\\s\\S]*?)(?=\\[(?:'+labels.join('|')+')\\]|$)','g');
  let m;
  while((m=labelRe.exec(cleaned))!==null){
    const label=m[1];
    let body=(m[2]||'').trim();
    // Drop a single pair of wrapping ``` fences if present
    body=body.replace(/^```[a-z]*\n?/i,'').replace(/\n?```$/,'').trim();
    const field=AI_BLOCK_TO_FIELD[label];
    if(field)out[field]=body;
  }
  return out;
}

// Pull a city/neighborhood guess from the property address.
// "1041 Calle De Alcala, La Jolla, CA 92037" -> "La Jolla"
function parseCityFromAddress(addr){
  if(!addr)return'';
  const parts=addr.split(',').map(s=>s.trim()).filter(Boolean);
  if(parts.length>=3)return parts[parts.length-2];      // street, CITY, ST zip
  if(parts.length===2){
    // Might be "CITY, ST zip" or "street, CITY"
    const p1=parts[1];
    if(/^[A-Z]{2}(\s+\d{5})?$/.test(p1))return parts[0];
    return p1;
  }
  return'';
}

// Today as "Month YYYY"
function formatPreparedDate(d=new Date()){
  return d.toLocaleDateString('en-US',{month:'long',year:'numeric'});
}

// Derive fallback values from deal data for fields the user hasn't filled in yet.
// Returned object's values are ONLY used when the corresponding ls field is blank.
function deriveListingFallbacks({fdif,market,aiARV}){
  const sellerName=(fdif?.contactName||fdif?.legalOwner||'').trim();
  const neighborhood=parseCityFromAddress(fdif?.address||'');
  const preparedDate=formatPreparedDate();
  let tenantStatus='';
  const occ=(fdif?.occupancy||'').toLowerCase();
  if(occ.includes('vacant'))tenantStatus='Vacant';
  else if(occ.includes('owner'))tenantStatus='Owner-occupied';
  else if(occ.includes('tenant')||occ.includes('rent')){
    tenantStatus=(fdif?.tenantLease||'').toLowerCase().includes('month')
      ?'Tenant-occupied (month-to-month)':'Tenant-occupied (lease)';
  }
  const recommendedListPrice=aiARV?String(Math.round(aiARV)):'';
  return{sellerName,neighborhood,preparedDate,tenantStatus,recommendedListPrice};
}

// Merge ls with derived fallbacks (ls values win when non-empty).
function effectiveLS(ls,derived){
  const out={...ls};
  Object.entries(derived||{}).forEach(([k,v])=>{
    if(!out[k]&&v)out[k]=v;
  });
  return out;
}

    }catch(e){
      doc.setFontSize(10);doc.setFont('helvetica','bold');doc.setTextColor(...navy);doc.text('TORREY PINES',M,11);
      doc.setFontSize(7);doc.setFont('helvetica','normal');doc.setTextColor(...grayText);doc.text('House Partners',M,15);
    }
    // Right side header text
    doc.setFontSize(9);doc.setFont('helvetica','bold');doc.setTextColor(...navy);
    doc.text('LISTING STRATEGY',W-M,9,{align:'right'});
    doc.setFontSize(8);doc.setFont('helvetica','italic');doc.setTextColor(...grayText);
    doc.text(sellerLabel,W-M,13.5,{align:'right'});
    // Gold horizontal rule
    doc.setDrawColor(...gold);doc.setLineWidth(.5);doc.line(M,21,W-M,21);doc.setLineWidth(.2);
    y=27;
  };
  const drawFooter=()=>{
    const fy=H-10;
    doc.setFontSize(8.5);doc.setFont('helvetica','bold');doc.setTextColor(...navy);
    doc.text('Matt Kidd',M,fy);
    const w1=doc.getTextWidth('Matt Kidd');
    doc.setFont('helvetica','normal');doc.setTextColor(...grayText);
    doc.text('Torrey Pines House Partners',M+w1+2,fy);
    // Center contact
    doc.setFontSize(8);
    doc.text('(858) 585-4841  |  Team@TorreyPinesHP.com',W/2,fy,{align:'center'});
    // Page number right
    doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(...grayText);
    doc.text('Page '+doc.internal.getCurrentPageInfo().pageNumber,W-M,fy,{align:'right'});
  };
  const addPage=()=>{doc.addPage();drawHeader();drawFooter()};
  const needSpace=(h)=>{if(y+h>H-18){addPage();return true}return false};

  drawHeader();
  drawFooter();

  // ─── TITLE BLOCK ───
  doc.setFontSize(20);doc.setFont('helvetica','bold');doc.setTextColor(...navy);
  doc.text('Listing Strategy & Recommendation',M,y+5);
  y+=11;
  doc.setFontSize(9.5);doc.setFont('helvetica','normal');doc.setTextColor(...darkText);
  const subParts=[addr];
  if(ls.neighborhood)subParts.push(ls.neighborhood);
  if(ls.sellerName)subParts.push('Prepared for '+ls.sellerName);
  // Last item emphasized (bold-ish via weight switch not easy in jsPDF; use regular)
  doc.text(subParts.join('  \u00B7  '),M,y);
  y+=7;

  // ─── INTRO PARAGRAPH ───
  if(ls.introParagraph&&ls.introParagraph.trim()){
    doc.setFontSize(9.5);doc.setFont('helvetica','normal');doc.setTextColor(...darkText);
    // Render intro with headline recommendation sentence bold if provided
    const lines=doc.splitTextToSize(ls.introParagraph.trim(),CW);
    lines.forEach(ln=>{needSpace(5);doc.text(ln,M,y);y+=4.5});
    if(ls.headlineRecommendation&&ls.headlineRecommendation.trim()){
      y+=1;
      doc.setFont('helvetica','bold');
      const hLines=doc.splitTextToSize('Headline recommendation: '+ls.headlineRecommendation.trim(),CW);
      hLines.forEach(ln=>{needSpace(5);doc.text(ln,M,y);y+=4.5});
    }
    y+=3;
  }

  // ─── THESIS CALLOUT (dark pull-quote) ───
  if(ls.thesisCallout&&ls.thesisCallout.trim()){
    doc.setFontSize(9.5);doc.setFont('helvetica','bold');
    const pad=4,innerW=CW-pad*2;
    const wrapped=doc.splitTextToSize(ls.thesisCallout.trim(),innerW);
    const boxH=pad*2+wrapped.length*5;
    needSpace(boxH+4);
    doc.setFillColor(...navy);doc.roundedRect(M,y,CW,boxH,1,1,'F');
    doc.setTextColor(255);
    wrapped.forEach((ln,i)=>doc.text(ln,W/2,y+pad+4+i*5,{align:'center'}));
    y+=boxH+5;
  }

  // Helper: section heading (no gold underline — reference uses bold navy, no underline on section titles)
  const drawSectionHeading=(title)=>{
    needSpace(10);
    doc.setFontSize(12);doc.setFont('helvetica','bold');doc.setTextColor(...navy);
    doc.text(title,M,y);
    y+=5.5;
  };
  // Helper: body paragraph (wrapped)
  const drawParagraph=(text,opts={})=>{
    if(!text||!text.trim())return;
    doc.setFontSize(opts.size||9.5);doc.setFont('helvetica',opts.italic?'italic':(opts.bold?'bold':'normal'));
    doc.setTextColor(...(opts.color||darkText));
    const w=opts.width||CW;
    const lines=doc.splitTextToSize(text.trim(),w);
    lines.forEach(ln=>{needSpace(5);doc.text(ln,opts.x||M,y);y+=(opts.lh||4.5)});
    y+=(opts.afterGap!=null?opts.afterGap:2);
  };
  // Helper: generic table with dark header row, alt row fill, optional highlighted recommended row
  const drawTable=({cols,rows,headerFill=navy,headerText=[255,255,255],highlightRow=-1,highlightFill=goldTint,totalRow=-1,totalFill=navy,totalText=[255,255,255]})=>{
    const rowH=7,headH=7;
    needSpace(headH+rowH*Math.min(rows.length,3));
    // Header
    doc.setFillColor(...headerFill);doc.rect(M,y,CW,headH,'F');
    doc.setFontSize(8);doc.setFont('helvetica','bold');doc.setTextColor(...headerText);
    let cx=M;
    cols.forEach(c=>{
      const tx=c.a==='right'?cx+c.w-2:c.a==='center'?cx+c.w/2:cx+2;
      doc.text(c.lbl,tx,y+4.8,{align:c.a||'left'});
      cx+=c.w;
    });
    y+=headH;
    rows.forEach((row,ri)=>{
      needSpace(rowH);
      let fill=null,textColor=darkText,bold=false;
      if(ri===totalRow){fill=totalFill;textColor=totalText;bold=true}
      else if(ri===highlightRow){fill=highlightFill;bold=true}
      else if(ri%2===1){fill=tableRowAlt}
      if(fill){doc.setFillColor(...fill);doc.rect(M,y,CW,rowH,'F')}
      doc.setFontSize(8.5);doc.setFont('helvetica',bold?'bold':'normal');doc.setTextColor(...textColor);
      cx=M;
      cols.forEach((c,ci)=>{
        const v=row[ci]==null?'':String(row[ci]);
        const tx=c.a==='right'?cx+c.w-2:c.a==='center'?cx+c.w/2:cx+2;
        // Wrap cell content
        const cellW=c.w-4;
        const wrapped=doc.splitTextToSize(v,cellW);
        // If cell overflows, expand row height
        wrapped.forEach((ln,li)=>{
          doc.text(ln,tx,y+4.8+li*3.8,{align:c.a||'left'});
        });
        cx+=c.w;
      });
      // Compute actual row height needed
      let maxLines=1;
      cols.forEach((c,ci)=>{
        const v=row[ci]==null?'':String(row[ci]);
        const wrapped=doc.splitTextToSize(v,c.w-4);
        if(wrapped.length>maxLines)maxLines=wrapped.length;
      });
      const actualH=Math.max(rowH,maxLines*3.8+3.5);
      if(actualH>rowH&&fill){
        // Extend the fill
        doc.setFillColor(...fill);doc.rect(M,y+rowH,CW,actualH-rowH,'F');
        // Re-draw cell text with proper positioning (we already wrote at y+4.8+li*3.8 which still works)
      }
      y+=actualH;
    });
  };
  // Helper: two-column bullet box (Lead Features / Target Buyers, Friction / Risk)
  const drawTwoColBullets=({leftTitle,leftItems,rightTitle,rightItems,leftBold=false,rightBold=false,boldItems=false})=>{
    const colW=CW/2,gap=3,eachW=colW-gap;
    const headH=7,lh=4.5,padY=2.5;
    // Compute height
    const renderBullets=(items,w,useBold)=>{
      let h=0;
      items.forEach(it=>{
        let text;
        if(useBold&&typeof it==='object'){
          text='• '+it.bold+(it.body?' — '+it.body:'');
        }else{
          text='• '+(typeof it==='string'?it:it.body||'');
        }
        const wrapped=doc.splitTextToSize(text,w-4);
        h+=wrapped.length*lh;
      });
      return h;
    };
    doc.setFontSize(8.5);doc.setFont('helvetica','normal');
    const lh2=4.5;
    const leftH=renderBullets(leftItems,eachW,boldItems);
    const rightH=renderBullets(rightItems,eachW,boldItems);
    const bodyH=Math.max(leftH,rightH)+padY*2;
    needSpace(headH+bodyH+2);
    // Header row
    doc.setFillColor(...navy);doc.rect(M,y,CW,headH,'F');
    doc.setFontSize(8);doc.setFont('helvetica','bold');doc.setTextColor(255);
    doc.text(leftTitle,M+3,y+4.8);
    doc.text(rightTitle,M+colW+3,y+4.8);
    y+=headH;
    // Body box
    doc.setFillColor(...lightGray);doc.rect(M,y,CW,bodyH,'F');
    // Separator line down the middle
    doc.setDrawColor(220);doc.line(M+colW,y,M+colW,y+bodyH);
    // Left column
    doc.setTextColor(...darkText);
    let ly=y+padY+3.8,ry=y+padY+3.8;
    const drawCol=(items,startX,innerW,cursor,useBold)=>{
      let cy=cursor;
      items.forEach(it=>{
        const useObj=useBold&&typeof it==='object';
        if(useObj){
          // Bold lead + body
          doc.setFont('helvetica','bold');doc.setFontSize(8.5);
          const leadText='• '+it.bold;
          const leadLines=doc.splitTextToSize(leadText,innerW-4);
          leadLines.forEach((ln,i)=>{doc.text(ln,startX+3,cy);cy+=lh});
          // Subtract one line to write body on same line as end of lead — simpler to just do full paragraph
          cy-=lh;
          // Append body
          doc.setFont('helvetica','normal');
          const combined='• '+it.bold+(it.body?' — '+it.body:'');
          const wrapped=doc.splitTextToSize(combined,innerW-4);
          // Re-render whole thing: bold up to '—', regular after
          wrapped.forEach((ln,li)=>{
            if(li===0){
              // Draw bold prefix
              doc.setFont('helvetica','bold');
              const boldPrefix='• '+it.bold;
              // Find where bold ends in this line
              if(ln.startsWith(boldPrefix)){
                doc.text(boldPrefix,startX+3,cy);
                const bpw=doc.getTextWidth(boldPrefix);
                doc.setFont('helvetica','normal');
                doc.text(ln.slice(boldPrefix.length),startX+3+bpw,cy);
              }else{
                // Bold prefix was wrapped onto multi lines
                doc.text(ln,startX+3,cy);
              }
            }else{
              doc.setFont('helvetica','normal');
              doc.text(ln,startX+3,cy);
            }
            cy+=lh;
          });
        }else{
          doc.setFont('helvetica','normal');doc.setFontSize(8.5);
          const text='• '+(typeof it==='string'?it:it.body||'');
          const wrapped=doc.splitTextToSize(text,innerW-4);
          wrapped.forEach((ln,li)=>{doc.text(ln,startX+3,cy);cy+=lh});
        }
      });
      return cy;
    };
    drawCol(leftItems,M,eachW,ly,boldItems);
    drawCol(rightItems,M+colW,eachW,ry,boldItems);
    y+=bodyH+3;
  };

  // ═══ SECTION 1 — Recommended List Price ═══
  const priceHeading=ls.recommendedListPrice
    ? '1. Recommended List Price: '+(typeof ls.recommendedListPrice==='number'?fmt(ls.recommendedListPrice):(pn(ls.recommendedListPrice)?fmt(pn(ls.recommendedListPrice)):ls.recommendedListPrice))
    : '1. Recommended List Price';
  drawSectionHeading(priceHeading);
  drawParagraph(ls.pricingThesis);
  const pricingRows=parsePipeRows(ls.pricingStrategiesText,4);
  if(pricingRows.length){
    const recIdx=pricingRows.findIndex(r=>/recommended/i.test(r[0]));
    drawTable({
      cols:[{lbl:'Strategy',w:CW*.30,a:'left'},{lbl:'List Price',w:CW*.20,a:'left'},{lbl:'Expected Net',w:CW*.25,a:'left'},{lbl:'Risk',w:CW*.25,a:'left'}],
      rows:pricingRows,
      highlightRow:recIdx,
    });
    y+=2;
  }
  drawParagraph(ls.pricingClosingLine,{italic:true,afterGap:3});

  // ═══ SECTION 2 — Timeline ═══
  const s2title=ls.timelineAnchor?'2. Timeline (Anchored to '+ls.timelineAnchor+')':'2. Timeline';
  drawSectionHeading(s2title);
  const timelineRows=parsePipeRows(ls.timelineRowsText,3);
  if(timelineRows.length){
    drawTable({
      cols:[{lbl:'Phase',w:CW*.26,a:'left'},{lbl:'Window',w:CW*.24,a:'left'},{lbl:'Key Actions',w:CW*.50,a:'left'}],
      rows:timelineRows,
    });
    y+=2;
  }
  drawParagraph(ls.timelineCriticalPath,{italic:true,afterGap:3});

  // ═══ SECTION 3 — Pre-Listing Prep & Staging Budget ═══
  drawSectionHeading('3. Pre-Listing Prep & Staging Budget');
  drawParagraph(ls.budgetIntro);
  const budgetRows=parsePipeRows(ls.budgetRowsText,3);
  if(budgetRows.length||ls.budgetTotal){
    const rows=budgetRows.slice();
    let totalIdx=-1;
    if(ls.budgetTotal&&ls.budgetTotal.trim()){
      rows.push(['TOTAL',ls.budgetTotal.trim(),'']);
      totalIdx=rows.length-1;
    }
    drawTable({
      cols:[{lbl:'Item',w:CW*.48,a:'left'},{lbl:'Estimated Cost',w:CW*.22,a:'left'},{lbl:'Notes',w:CW*.30,a:'left'}],
      rows,
      totalRow:totalIdx,
    });
    y+=2;
  }
  drawParagraph(ls.budgetNotSpending,{afterGap:3});

  // ═══ SECTION 4 — Marketing Positioning ═══
  drawSectionHeading('4. Marketing Positioning');
  if(ls.headlineAngle&&ls.headlineAngle.trim()){
    doc.setFontSize(9.5);doc.setFont('helvetica','bold');doc.setTextColor(...darkText);
    const prefix='Headline angle: ';
    doc.text(prefix,M,y);
    const pw=doc.getTextWidth(prefix);
    doc.setFont('helvetica','italic');
    const wrapped=doc.splitTextToSize(ls.headlineAngle.trim(),CW-pw);
    wrapped.forEach((ln,i)=>{if(i>0)needSpace(5);doc.text(ln,i===0?M+pw:M,y);y+=4.5});
    y+=2;
  }
  const leadArr=parseBullets(ls.leadFeatures);
  const targetArr=parseBullets(ls.targetBuyers);
  if(leadArr.length||targetArr.length){
    drawTwoColBullets({leftTitle:'Lead Features',leftItems:leadArr,rightTitle:'Target Buyers',rightItems:targetArr,boldItems:false});
  }

  // ═══ SECTION 5 — Friction Reduction & Risk Management ═══
  drawSectionHeading('5. Friction Reduction & Risk Management');
  const frictionArr=parseBoldItems(ls.frictionItems);
  const riskArr=parseBoldItems(ls.riskItems);
  if(frictionArr.length||riskArr.length){
    drawTwoColBullets({leftTitle:'Friction Reduction',leftItems:frictionArr,rightTitle:'Risk Management',rightItems:riskArr,boldItems:true});
  }

  // ═══ SECTION 6 — Expected Financial Outcome ═══
  drawSectionHeading('6. Expected Financial Outcome');
  const finRows=parsePipeRows(ls.financialRowsText,4);
  if(finRows.length){
    // Highlight last row (net proceeds)
    const hlIdx=finRows.length-1;
    drawTable({
      cols:[{lbl:'Line',w:CW*.40,a:'left'},{lbl:'Conservative',w:CW*.20,a:'right'},{lbl:'Expected',w:CW*.20,a:'right'},{lbl:'Stretch',w:CW*.20,a:'right'}],
      rows:finRows,
      highlightRow:hlIdx,
    });
    y+=2;
  }
  drawParagraph(ls.financialDisclaimer,{italic:true,size:8,color:grayText,afterGap:3});

  // ═══ SECTION 7 — Next Steps ═══
  drawSectionHeading('7. Next Steps');
  const stepsArr=parseBullets(ls.nextSteps);
  if(stepsArr.length){
    doc.setFontSize(9.5);doc.setFont('helvetica','normal');doc.setTextColor(...darkText);
    stepsArr.forEach(s=>{
      const wrapped=doc.splitTextToSize('• '+s,CW-4);
      wrapped.forEach((ln,li)=>{needSpace(5);doc.text(ln,M+2,y);y+=4.5});
    });
    y+=2;
  }

  // ═══ BOTTOM LINE CALLOUT ═══
  if(ls.bottomLine&&ls.bottomLine.trim()){
    doc.setFontSize(9.5);doc.setFont('helvetica','bold');
    const pad=4;
    const wrapped=doc.splitTextToSize('Bottom line: '+ls.bottomLine.trim(),CW-pad*2);
    const boxH=pad*2+wrapped.length*5;
    needSpace(boxH+4);
    doc.setFillColor(...navy);doc.roundedRect(M,y,CW,boxH,1,1,'F');
    doc.setTextColor(255);
    wrapped.forEach((ln,i)=>doc.text(ln,M+pad,y+pad+4+i*5));
    y+=boxH+4;
  }

  // ═══ DISCLAIMER (bottom of page 2) ═══
  if(ls.footerDisclaimer&&ls.footerDisclaimer.trim()){
    const preparedLine=ls.preparedDate?('Prepared '+ls.preparedDate+' by Matt Kidd, Torrey Pines House Partners. '):'';
    const fullDisclaimer=preparedLine+ls.footerDisclaimer.trim();
    doc.setFontSize(7.5);doc.setFont('helvetica','italic');doc.setTextColor(...grayText);
    const wrapped=doc.splitTextToSize(fullDisclaimer,CW);
    wrapped.forEach(ln=>{needSpace(4);doc.text(ln,M,y);y+=3.5});
  }

  const safeAddr=addr.replace(/[^a-zA-Z0-9]/g,'_').substring(0,40);
  doc.save(`TPHP_Listing_Strategy_${safeAddr}.pdf`);
}

  const salut=ls.sellerName?'Hi '+ls.sellerName.split(' ')[0]+',':'Hi there,';
  const price=pn(ls.recommendedListPrice)||pn(ls.suggestedListPrice)||aiARV;
  const priceStr=price?fmt(price):'[suggested list price]';
  const addr=fdif.address||'your property';
  const listDate=ls.targetListDate||'[target list date]';
  return `Subject: Listing Strategy — ${addr}

${salut}

Thanks again for taking the time to talk through ${addr}. Attached is a short strategy document summarizing what I think gives you the strongest outcome if we bring the home to market.

The highlights:
  \u2022 Recommended list price: ${priceStr} (${ls.priceStrategy||'Aggressive'} positioning)
  \u2022 Target list date: ${listDate}
  \u2022 Approach: list as-is with professional staging and strategic pricing to drive multiple offers

The attached PDF walks through pricing rationale, timeline, prep budget, marketing plan, and the expected financial outcome. Take a look when you have a few minutes and we can regroup — happy to adjust anything that doesn't feel right.

Talk soon,
Matt`;
}

Market: Avg DOM ${market.avgDOM||'—'}  |  MOS ${market.monthsOfSupply||'—'}  |  Risk of decline ${market.riskOfDecline||'—'}%

[TARGET_BUYERS]  (one bullet per line, no leading dash)

[Buyer segment 2]
[Buyer segment 3]

[FRICTION_ITEMS]  (one per line, format: **Bold lead** — body)
**Pre-listing inspection** — published upfront so buyers can't 'discover' leverage
**Termite + sewer scope** — ordered before listing, attached to disclosures
**HOA documents** — package preordered and ready day one
**'As-is' addendum** in offer instructions — expectations set from first showing
**Tenant exit walkthrough** — documented; minor wear handled before listing

[RISK_ITEMS]  (one per line, format: **Bold lead** — body)
**Overpricing** — managed by strategic list price + offer-deadline structure
**Vacant home** — staging keeps it lived-in; smart lock + camera; notify insurer
**Buyer renegotiation** — disarmed by full pre-listing disclosures
**Rate-driven softening** — [market-specific guidance]
**Investor lowballs** — expected and ignored; used as floor pricing only

[FINANCIAL_ROWS]  (pipe-delimited, 4 columns: Line | Conservative | Expected | Stretch — last row should be "Estimated net proceeds (before mortgage payoff)")
Sale price | $X,XXX,XXX | $X,XXX,XXX | $X,XXX,XXX
Less: Selling costs (commissions + closing, ~6.5%) | ($XX,XXX) | ($XX,XXX) | ($XX,XXX)
Less: Staging + prep + repairs | ($XX,XXX) | ($XX,XXX) | ($XX,XXX)
Less: Holding costs (~2 mo: tax, insurance, util, HOA) | ($X,XXX) | ($X,XXX) | ($X,XXX)
Estimated net proceeds (before mortgage payoff) | $X,XXX,XXX | $X,XXX,XXX | $X,XXX,XXX

[FINANCIAL_DISCLAIMER]
One italic line noting estimates exclude mortgage payoff + assume standard CA closing costs.

[NEXT_STEPS]  (one bullet per line, no leading dash)
Confirm [critical first step]
Authorize scheduling of [vendors]
Sign listing agreement so we can lock the marketing calendar
Notify your insurance carrier of upcoming vacancy (if applicable)
Confirm list price strategy — recommended $X,XXX,XXX

[BOTTOM_LINE]
One 2-sentence summary for the dark callout at the end. Format: "List as-is at $X with professional staging in [month]. Expected net proceeds of $X.XXM–$X.XXM within roughly [N] days — no remodel risk, minimal carry, clean exit."

[FOOTER_DISCLAIMER]
"All figures are estimates based on current market data and are not a guarantee of sale price or net proceeds."

END OF OUTPUT.`;
}

function TabListingStrategy({D,showToast}){
  const{fdif,comps,listingStrategy:lsRaw}=D.deal;
  const ls=lsRaw||{};
  const market=D.deal.market||{};
  const sqft=pn(fdif.sqft);
  const aiC=comps.asIs.filter(c=>c.price&&c.sqft).map(c=>({price:pn(c.price),sqft:pn(c.sqft)}));
  const aiARV=resolveARVs(D.deal,sqft).aiARV;
  const derived=deriveListingFallbacks({fdif,market,aiARV});
  const lsEff=effectiveLS(ls,derived);
  const[aiPaste,setAiPaste]=useState('');

  const handleExportPDF=()=>{
    generateListingStrategyPDF({fdif,ls:lsEff,aiARV,comps,market,sqft});
    showToast&&showToast('Listing strategy PDF generated');
  };
  const handleGenerateEmail=()=>{
    const draft=buildListingEmailDraft({fdif,ls:lsEff,aiARV,sqft});
    D.updateLS('emailDraft',draft);
    showToast&&showToast('Email draft generated');
  };
  const handleCopyEmail=async()=>{
    const text=ls.emailDraft||buildListingEmailDraft({fdif,ls:lsEff,aiARV,sqft});
    try{await navigator.clipboard.writeText(text);showToast&&showToast('Email copied to clipboard')}
    catch(e){alert('Could not copy. Select the text and copy manually.')}
  };
  const handleCopyPrompt=async()=>{
    const prompt=buildAIPrompt({fdif,ls:lsEff,aiARV,comps,market,sqft});
    try{await navigator.clipboard.writeText(prompt);showToast&&showToast('AI prompt copied — paste into Claude, run it, then paste its response into the Paste AI Response box')}
    catch(e){alert('Could not copy.')}
  };
  const fillSample=()=>{
    // Populate with the 1041 Calle De Alcala sample so users can see a complete PDF immediately
    const sample=sampleListingStrategy();
    Object.entries(sample).forEach(([k,v])=>D.updateLS(k,v));
    showToast&&showToast('Sample strategy loaded — edit and export');
  };
  const applyAIPaste=()=>{
    const patch=parseAIResponse(aiPaste);
    const keys=Object.keys(patch);
    if(!keys.length){alert('No labeled blocks found. Paste Claude\'s response containing blocks like [INTRO_PARAGRAPH] ... [PRICING_ROWS] ...');return;}
    keys.forEach(k=>D.updateLS(k,patch[k]));
    setAiPaste('');
    showToast&&showToast(`Applied ${keys.length} section${keys.length===1?'':'s'} from AI response`);
  };
  const applyDerived=()=>{
    let n=0;
    Object.entries(derived).forEach(([k,v])=>{
      if(v&&!ls[k]){D.updateLS(k,v);n++;}
    });
    showToast&&showToast(n?`Auto-filled ${n} field${n===1?'':'s'} from deal data`:'All header fields already set');
  };

  const inputStyle={width:'100%',padding:'6px 8px',border:'1px solid var(--border)',borderRadius:4,fontSize:'.85rem',fontFamily:'inherit',background:'var(--bg)',color:'var(--text)'};
  const fld=(label,value,onChange,opts={})=>
    <div style={{marginBottom:10}}>
      <label style={{fontSize:'.72rem',fontWeight:600,color:'var(--text-muted)',display:'block',marginBottom:3,textTransform:'uppercase',letterSpacing:'.04em'}}>{label}</label>
      {opts.type==='select'
        ? <select value={value||''} onChange={e=>onChange(e.target.value)} style={inputStyle}>
            <option value="">—</option>
            {opts.options.map(o=><option key={o} value={o}>{o}</option>)}
          </select>
        : opts.type==='textarea'
        ? <textarea value={value||''} onChange={e=>onChange(e.target.value)} rows={opts.rows||3} style={{...inputStyle,resize:'vertical',fontFamily:opts.mono?'var(--mono)':'inherit',fontSize:opts.mono?'.78rem':'.85rem'}} placeholder={opts.placeholder||''}/>
        : <input type={opts.type||'text'} value={value||''} onChange={e=>onChange(e.target.value)} style={inputStyle} placeholder={opts.placeholder||''}/>
      }
      {opts.hint&&<div className="tmut" style={{fontSize:'.7rem',marginTop:2}}>{opts.hint}</div>}
    </div>;

  return <div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16,flexWrap:'wrap',gap:8}}>
      <div>
        <h2 style={{fontSize:'1.15rem',fontWeight:700,margin:0}}>Listing Strategy</h2>
        <div className="tmut" style={{fontSize:'.78rem',marginTop:2}}>Seller-facing strategy package for traditional listing deals.</div>
      </div>
      <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
        <button className="btn btn-sm" onClick={applyDerived} title="Copy auto-derived header values (seller, neighborhood, prepared date, etc.) from the deal into the fields">Auto-fill Fields</button>
        <button className="btn btn-sm" onClick={fillSample} title="Populate all fields with the 1041 Calle De Alcala reference so you can see a complete PDF immediately">Load Sample</button>
        <button className="btn btn-sm" onClick={handleCopyPrompt} title="Copy a Claude prompt that produces ready-to-paste labeled blocks for each section">Copy AI Prompt</button>
        <button className="btn btn-sm" onClick={handleGenerateEmail}>Draft Email</button>
        <button className="btn btn-sm" onClick={handleCopyEmail}>Copy Email</button>
        <button className="btn btn-p" onClick={handleExportPDF} style={{fontSize:'.82rem',padding:'6px 16px'}}>Export PDF</button>
      </div>
    </div>

    {/* Auto-populated summary */}
    <div className="card mb4"><div className="card-h">Auto-Populated from Deal</div><div className="card-b">
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:12,fontSize:'.82rem'}}>
        <div><div className="tmut" style={{fontSize:'.7rem'}}>Address</div><div style={{fontWeight:600}}>{fdif.address||'—'}</div></div>
        <div><div className="tmut" style={{fontSize:'.7rem'}}>Beds / Baths</div><div style={{fontWeight:600}}>{fdif.bedsBaths||'—'}</div></div>
        <div><div className="tmut" style={{fontSize:'.7rem'}}>SQFT</div><div style={{fontWeight:600}} className="mono">{sqft?sqft.toLocaleString():'—'}</div></div>
        <div><div className="tmut" style={{fontSize:'.7rem'}}>Year Built</div><div style={{fontWeight:600}}>{fdif.yearBuilt||'—'}</div></div>
        <div><div className="tmut" style={{fontSize:'.7rem'}}>As-Is FMV</div><div style={{fontWeight:600}} className="mono">{aiARV?fmt(aiARV):'—'}</div></div>
        <div><div className="tmut" style={{fontSize:'.7rem'}}>Avg DOM</div><div style={{fontWeight:600}}>{market.avgDOM||'—'}</div></div>
      </div>
    </div></div>

    {/* Paste AI Response — fills all narrative sections at once */}
    <div className="card mb4"><div className="card-h" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
      <span>Paste AI Response</span>
      <div style={{display:'flex',gap:6}}>
        <button className="btn btn-sm" onClick={handleCopyPrompt} title="Copy the Claude prompt">Copy Prompt</button>
        <button className="btn btn-p btn-sm" onClick={applyAIPaste} disabled={!aiPaste.trim()} title="Parse labeled blocks and fill every matching section">Apply to Sections</button>
      </div>
    </div><div className="card-b">
      <div className="tmut" style={{fontSize:'.72rem',marginBottom:6}}>
        Workflow: (1) click <b>Copy Prompt</b>, (2) paste it into a Claude chat, (3) copy Claude's full response, (4) paste it here, (5) click <b>Apply to Sections</b>. Every section below fills in automatically.
      </div>
      <textarea
        value={aiPaste}
        onChange={e=>setAiPaste(e.target.value)}
        rows={6}
        style={{...inputStyle,resize:'vertical',fontFamily:'var(--mono)',fontSize:'.78rem'}}
        placeholder="Paste Claude's full response here. Should contain blocks like [INTRO_PARAGRAPH] ... [HEADLINE_RECOMMENDATION] ... [PRICING_ROWS] ... [FRICTION_ITEMS] ... etc."
      />
    </div></div>

    {/* Header + strategy inputs */}
    <div className="card mb4"><div className="card-h" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
      <span>Header &amp; Strategy Inputs</span>
      <button className="btn btn-sm" onClick={applyDerived} title="Copy auto-derived values from the deal data into any blank fields below">Auto-fill Blanks</button>
    </div><div className="card-b">
      <div className="tmut" style={{fontSize:'.72rem',marginBottom:8}}>Placeholder text shows the value that will be auto-used in the PDF if the field is left blank. Click <b>Auto-fill Blanks</b> to commit those suggestions to the fields so you can edit them.</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:12}}>
        {fld('Seller Name',ls.sellerName,v=>D.updateLS('sellerName',v),{placeholder:derived.sellerName||'e.g. Joon Cho'})}
        {fld('Neighborhood / Subdivision',ls.neighborhood,v=>D.updateLS('neighborhood',v),{placeholder:derived.neighborhood||'e.g. La Jolla'})}
        {fld('Prepared Date',ls.preparedDate,v=>D.updateLS('preparedDate',v),{placeholder:derived.preparedDate||'e.g. April 2026'})}
        {fld('Tenant Status',ls.tenantStatus,v=>D.updateLS('tenantStatus',v),{type:'select',options:['Owner-occupied','Vacant','Tenant-occupied (month-to-month)','Tenant-occupied (lease)']})}
        {fld('Staging Needed',ls.stagingNeeded,v=>D.updateLS('stagingNeeded',v),{type:'select',options:['No','Yes — full','Yes — partial','Virtual only']})}
        {fld('Target List Date',ls.targetListDate,v=>D.updateLS('targetListDate',v),{type:'date'})}
        {fld('Price Strategy',ls.priceStrategy,v=>D.updateLS('priceStrategy',v),{type:'select',options:['Aggressive','Market','Greedy']})}
        {fld('Prep Budget ($)',ls.prepBudget,v=>D.updateLS('prepBudget',v),{type:'number',placeholder:'e.g. 14000'})}
      </div>
    </div></div>

    {/* Intro + thesis */}
    <div className="card mb4"><div className="card-h">Intro &amp; Thesis</div><div className="card-b">
      {fld('Intro Paragraph',ls.introParagraph,v=>D.updateLS('introParagraph',v),{type:'textarea',rows:4,placeholder:'Warm, personal intro addressing the seller by name...'})}
      {fld('Headline Recommendation (bold sentence)',ls.headlineRecommendation,v=>D.updateLS('headlineRecommendation',v),{type:'textarea',rows:2,placeholder:'e.g. list as-is, professionally staged, at a strategic price designed to drive multiple offers'})}
      {fld('Thesis Callout (black pull-quote box)',ls.thesisCallout,v=>D.updateLS('thesisCallout',v),{type:'textarea',rows:3,placeholder:'Single 1-2 sentence pull quote — appears centered in a black callout box'})}
    </div></div>

    {/* Section 1 — Pricing */}
    <div className="card mb4"><div className="card-h">Section 1 — Recommended List Price</div><div className="card-b">
      {fld('Recommended List Price ($)',ls.recommendedListPrice,v=>D.updateLS('recommendedListPrice',v),{type:'number',placeholder:derived.recommendedListPrice?`auto: ${derived.recommendedListPrice} (from As-Is FMV)`:'e.g. 1275000'})}
      {fld('Pricing Thesis',ls.pricingThesis,v=>D.updateLS('pricingThesis',v),{type:'textarea',rows:3,placeholder:'Paragraph under section heading explaining the pricing recommendation...'})}
      {fld('Strategy Table Rows',ls.pricingStrategiesText,v=>D.updateLS('pricingStrategiesText',v),{type:'textarea',rows:4,mono:true,placeholder:'One row per line, pipe-delimited:\nAggressive (recommended) | $1,275,000 | $1.32M - $1.38M | Low — multiple offers expected',hint:'Format: Strategy | List Price | Expected Net | Risk  —  row with "(recommended)" is highlighted.'})}
      {fld('Closing Italic Line',ls.pricingClosingLine,v=>D.updateLS('pricingClosingLine',v),{type:'textarea',rows:2,placeholder:'e.g. Counterintuitive truth: the lower list price almost always yields a higher final sale...'})}
    </div></div>

    {/* Section 2 — Timeline */}
    <div className="card mb4"><div className="card-h">Section 2 — Timeline</div><div className="card-b">
      {fld('Timeline Anchor',ls.timelineAnchor,v=>D.updateLS('timelineAnchor',v),{placeholder:'e.g. Tenant Move-Out'})}
      {fld('Timeline Rows',ls.timelineRowsText,v=>D.updateLS('timelineRowsText',v),{type:'textarea',rows:8,mono:true,placeholder:'One row per line, pipe-delimited:\nPre-vacancy planning | Now – early June | Book stager, photographer, painter...',hint:'Format: Phase | Window | Key Actions'})}
      {fld('Critical Path Note',ls.timelineCriticalPath,v=>D.updateLS('timelineCriticalPath',v),{type:'textarea',rows:2,placeholder:'e.g. Critical path: book the stager and photographer now. Quality vendors book 4-6 weeks out.'})}
    </div></div>

    {/* Section 3 — Budget */}
    <div className="card mb4"><div className="card-h">Section 3 — Pre-Listing Prep &amp; Staging Budget</div><div className="card-b">
      {fld('Budget Intro Paragraph',ls.budgetIntro,v=>D.updateLS('budgetIntro',v),{type:'textarea',rows:3,placeholder:'Explain the prep philosophy — high-ROI cosmetic only...'})}
      {fld('Budget Rows',ls.budgetRowsText,v=>D.updateLS('budgetRowsText',v),{type:'textarea',rows:8,mono:true,placeholder:'One row per line, pipe-delimited:\nProfessional staging (install + 2 months) | $5,500 – $8,500 | Industry standard for ~3,000 SF in N. County.',hint:'Format: Item | Estimated Cost | Notes'})}
      {fld('Total Line',ls.budgetTotal,v=>D.updateLS('budgetTotal',v),{placeholder:'e.g. $10,650 – $18,250'})}
      {fld('"What We Are Not Spending Money On" Paragraph',ls.budgetNotSpending,v=>D.updateLS('budgetNotSpending',v),{type:'textarea',rows:3,placeholder:'What we are not spending money on: new flooring, kitchen/bath updates...'})}
    </div></div>

    {/* Section 4 — Marketing */}
    <div className="card mb4"><div className="card-h">Section 4 — Marketing Positioning</div><div className="card-b">
      {fld('Headline Angle (italic marketing tagline)',ls.headlineAngle,v=>D.updateLS('headlineAngle',v),{type:'textarea',rows:2,placeholder:'"Rare Opportunity in [Neighborhood] — The Best Value Way Into [Area]."'})}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        {fld('Lead Features (one per line)',ls.leadFeatures,v=>D.updateLS('leadFeatures',v),{type:'textarea',rows:6,mono:true,placeholder:'Walking distance to Vineyard Golf & Orfila Winery\nTop-rated San Pasqual High (7/10)\n5BR/3BA, 3,030 SF, 3-car garage...'})}
        {fld('Target Buyers (one per line)',ls.targetBuyers,v=>D.updateLS('targetBuyers',v),{type:'textarea',rows:6,mono:true,placeholder:'Move-up coastal SD families priced out of Carlsbad/Encinitas\nBuyers with reno appetite + 203k loans...'})}
      </div>
    </div></div>

    {/* Section 5 — Friction / Risk */}
    <div className="card mb4"><div className="card-h">Section 5 — Friction Reduction &amp; Risk Management</div><div className="card-b">
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        {fld('Friction Reduction Items',ls.frictionItems,v=>D.updateLS('frictionItems',v),{type:'textarea',rows:7,mono:true,placeholder:'One item per line, format **Bold lead** — body:\n**Pre-listing inspection** — published upfront so buyers cannot find leverage',hint:'Format: **Bold lead** — body'})}
        {fld('Risk Management Items',ls.riskItems,v=>D.updateLS('riskItems',v),{type:'textarea',rows:7,mono:true,placeholder:'One item per line, format **Bold lead** — body:\n**Overpricing** — managed by strategic list price + offer-deadline structure',hint:'Format: **Bold lead** — body'})}
      </div>
    </div></div>

    {/* Section 6 — Financial */}
    <div className="card mb4"><div className="card-h">Section 6 — Expected Financial Outcome</div><div className="card-b">
      {fld('Financial Rows',ls.financialRowsText,v=>D.updateLS('financialRowsText',v),{type:'textarea',rows:7,mono:true,placeholder:'One row per line, pipe-delimited. Last row should be "Estimated net proceeds..." — it will be highlighted.\nSale price | $1,320,000 | $1,360,000 | $1,400,000',hint:'Format: Line | Conservative | Expected | Stretch'})}
      {fld('Disclaimer Below Table',ls.financialDisclaimer,v=>D.updateLS('financialDisclaimer',v),{type:'textarea',rows:2,placeholder:'e.g. Estimates exclude any outstanding mortgage payoff and assume standard CA closing costs.'})}
    </div></div>

    {/* Section 7 — Next Steps + Bottom Line */}
    <div className="card mb4"><div className="card-h">Section 7 — Next Steps &amp; Bottom Line</div><div className="card-b">
      {fld('Next Steps (one bullet per line)',ls.nextSteps,v=>D.updateLS('nextSteps',v),{type:'textarea',rows:6,mono:true,placeholder:'Confirm tenant move-out date and access plan for vendor walkthroughs\nAuthorize scheduling of stager, photographer, inspector...'})}
      {fld('Bottom Line Callout (black box)',ls.bottomLine,v=>D.updateLS('bottomLine',v),{type:'textarea',rows:3,placeholder:'List as-is at $X with professional staging in [month]. Expected net proceeds of $X.XXM–$X.XXM within roughly [N] days...'})}
      {fld('Footer Disclaimer (small italic at bottom)',ls.footerDisclaimer,v=>D.updateLS('footerDisclaimer',v),{type:'textarea',rows:2,placeholder:'All figures are estimates based on current market data and are not a guarantee of sale price or net proceeds.'})}
    </div></div>

    {/* Other inputs used by email draft */}
    <div className="card mb4"><div className="card-h">Internal Notes (not in PDF)</div><div className="card-b">
      {fld('Seller Constraints',ls.sellerConstraints,v=>D.updateLS('sellerConstraints',v),{type:'textarea',rows:2,placeholder:'e.g. must close by June 30, tenant needs 60 days notice'})}
      {fld('Agent Notes',ls.agentNotes,v=>D.updateLS('agentNotes',v),{type:'textarea',rows:2,placeholder:'Private notes / overrides — used as context for the AI prompt only'})}
    </div></div>

    {/* Email draft */}
    <div className="card mb4"><div className="card-h" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
      <span>Seller Email Draft</span>
      <div style={{display:'flex',gap:6}}>
        <button className="btn btn-sm" onClick={handleGenerateEmail}>Regenerate</button>
        <button className="btn btn-sm" onClick={handleCopyEmail}>Copy</button>
      </div>
    </div><div className="card-b">
      <textarea value={ls.emailDraft||''} onChange={e=>D.updateLS('emailDraft',e.target.value)} rows={14} style={{...inputStyle,resize:'vertical',fontFamily:'var(--mono)',fontSize:'.78rem'}} placeholder="Click &quot;Draft Email&quot; to auto-generate, then edit as needed. Attach the PDF in your email client before sending."/>
    </div></div>
  </div>;
}
