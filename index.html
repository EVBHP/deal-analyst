function SRow({label,fr,qf,ai,bold,hl,pct,aiGreen}){
  const fv=v=>{if(v==null||v===''||isNaN(v))return'—';if(pct||(typeof v==='number'&&Math.abs(v)<2&&Math.abs(v)!==0&&!Number.isInteger(v)))return fmtPct(v);return fmt(v)};
  const cf=v=>{if(!hl)return undefined;return v>=100000?'var(--green)':v>=0?'var(--amber)':'var(--red)'};
  const aiColor=aiGreen&&ai!=null&&!isNaN(ai)?'var(--green)':cf(ai);
  return <tr style={bold?{fontWeight:700,borderTop:'2px solid var(--border)'}:undefined}>
    <td>{label}</td><td className="r mono" style={{color:cf(fr)}}>{fv(fr)}</td><td className="r mono" style={{color:cf(qf)}}>{fv(qf)}</td><td className="r mono" style={{color:aiColor}}>{fv(ai)}</td>
  </tr>
}

function TabSummary({D}){
  const{fdif,comps,renoScope,renoCustom,underwriting:uw,uwDefaults}=D.deal;
  const[riskTipOpen,setRiskTipOpen]=useState(false);
  const market=D.deal.market||{activeListings:'',pendingLast30:'',closedLast30:'',avgDOM:''};
  const sqft=pn(fdif.sqft),u={...DEF_UW,...uwDefaults},pp=pn(uw.purchasePrice);
  const aiC=comps.asIs.filter(c=>c.price&&c.sqft).map(c=>({price:pn(c.price),sqft:pn(c.sqft)}));
  const rnC=comps.renovated.filter(c=>c.price&&c.sqft).map(c=>({price:pn(c.price),sqft:pn(c.sqft)}));
  const arvRes=resolveARVs(D.deal,sqft);
  const frARV=arvRes.frARV, aiARV=arvRes.aiARV;
  const qfArvOverride2=pn(D.deal.qfArv||'');
  const qfARV=qfArvOverride2||aiARV;
  const rc2=renoCustom||{};
  const cpct2=D.deal.renoContingencyPct;
  const renoPSFVal2=pn(D.deal.renoPSF||'');
  const baseFr2=useMemo(()=>calcRenoBudget(renoScope,rc2,cpct2),[renoScope,rc2,cpct2]);
  const fr=useMemo(()=>{
    if(renoPSFVal2>0&&sqft){
      const sub=Math.round(renoPSFVal2*sqft);
      const pct=cpct2!=null?cpct2/100:0.2;
      return{lineItems:baseFr2.lineItems,subtotal:sub,contingency:Math.round(sub*pct),total:Math.round(sub*(1+pct)),contingencyPct:pct};
    }
    return baseFr2;
  },[baseFr2,renoPSFVal2,sqft,cpct2]);
  const baseQf2=useMemo(()=>calcQFBudget(fr.lineItems,fr.contingencyPct),[fr]);
  const qfPSFVal2=pn(D.deal.qfRenoPSF||'');
  const qf=useMemo(()=>{
    if(qfPSFVal2>0&&sqft){const sub=Math.round(qfPSFVal2*sqft);const pct=cpct2!=null?cpct2/100:0.2;return{lineItems:baseQf2.lineItems,subtotal:sub,contingency:Math.round(sub*pct),total:Math.round(sub*(1+pct)),contingencyPct:pct};}
    return baseQf2;
  },[baseQf2,qfPSFVal2,sqft,cpct2]);
  const aib=useMemo(()=>calcAIBudget(fr.lineItems,fr.contingencyPct),[fr]);
  const holds=[uw.holdFullReno||6,uw.holdQuickFlip||3,uw.holdAsIs??0];
  const arvs=[frARV,qfARV,aiARV],rsubs=[fr.subtotal,qf.subtotal,aib.subtotal];
  const dpAmt=pn(uw.downPayment)||0;
  const fdifHOA=pn(fdif.hoaDues)||0;
  const iaData2=D.deal.ia||{};
  const iau2={...DEF_IA,...(D.deal.iaDefaults||{}),minProfitTarget:u.minProfitTarget,targetProfit:u.targetProfit};
  const tkBal=pn(iaData2.takeoverBalance)||pn(fdif.mortgageBalance);
  const tkPmt=pn(iaData2.takeoverPayment)||pn(fdif.mortgagePayment);
  const selExits=Array.isArray(D.deal.selectedExits)?D.deal.selectedExits:DEFAULT_EXITS;
  const allExits=useMemo(()=>buildExits({
    pp,sqft,arvReno:frARV,arvQf:qfARV,arvAsIs:aiARV,
    renoFull:fr.subtotal,renoQf:qf.subtotal,renoNone:aib.subtotal,
    holds:{holdFullReno:holds[0],holdQuickFlip:holds[1],holdAsIs:holds[2]},
    iaHold:pn(iaData2.holdMonths)||6,u,dpAmt,hoaMonthly:fdifHOA,
    basis:{installment:{arv:(iaData2.renoChoice||'qf')==='full'?'reno':'qf',reno:(iaData2.renoChoice||'qf')==='full'?'full':'qf'},...(D.deal.exitBasis||{})},
    iaCalc:({arv,renoSubtotal,holdMonths})=>calcIA({purchasePrice:pn(iaData2.purchasePrice)||pp,arv,sqft,holdMonths,
      renoSubtotal,contingencyPct:iau2.contingencyPct,ia:iau2,hoaMonthly:fdifHOA,
      takeover:{on:!!iaData2.takeover,balance:tkBal,payment:tkPmt}}),
  }),[pp,sqft,frARV,aiARV,fr.subtotal,qf.subtotal,aib.subtotal,JSON.stringify(holds),dpAmt,fdifHOA,
      JSON.stringify(D.deal.exitBasis),JSON.stringify(u),JSON.stringify(iaData2),JSON.stringify(iau2),tkBal,tkPmt]);
  // Only the exits chosen on the Underwriting tab reach the summary and the PDF.
  const shown=allExits.filter(x=>selExits.includes(x.id)&&x.res);
  const res=[allExits.find(x=>x.id==='fullReno')?.res||null,allExits.find(x=>x.id==='quickFlip')?.res||null];
  const ailRes=useMemo(()=>calcAsIsListing(aiARV),[aiARV]);
  const mos=calcMOS(pn(market.activeListings),pn(market.closedLast30));
  const mc=getMktCond(mos),mcc=getMktClass(mos);
  const best=shown.reduce((a,x)=>(!a||x.res.netProfit>a.res.netProfit)?x:a,null);
  const bLbl=best?best.label:'—';
  const bP=best?best.res.netProfit:undefined;
  const vc=bP>=u.targetProfit?'go':bP>=u.minProfitTarget?'maybe':'nogo';
  const vt=bP>=u.targetProfit?`GO — Best: ${bLbl} at ${fmt(bP)} profit`:bP>=u.minProfitTarget?`MAYBE — Best: ${bLbl} at ${fmt(bP)} (below target)`:bP>0?`CAUTION — Best: ${bLbl} at ${fmt(bP)} (below minimum)`:'NO-GO — All scenarios unprofitable';
  const hasData=pp>0&&(frARV||aiARV);

  // One sensitivity grid per SELECTED exit, so the PDF panels match its columns.
  const sgs=useMemo(()=>shown.map(x=>x.res?calcSens(x.res.netProfit,x.arv,x.res.totalReno):null),[shown]);
  const photos=D.deal.photos||[];
  const handleExportPDF=()=>{
    generateDealPDF({fdif,pp,sqft,aiARV,frARV,qfARV,fr,holds,res,comps,u,mc,vc,vt,market,sgs,photos,renoCustom,renoScope,exits:shown,sellerSummary:D.deal.sellerSummary});
  };

  const ss=D.deal.sellerSummary||{draft:'',notes:'',approved:false};
  const ssMissing=useMemo(()=>generateSellerSummary(D.deal).missing,[D.deal]);
  const ssLeaks=useMemo(()=>sellerSummaryLeaks(D.deal,String(ss.draft||'')+' '+String(ss.notes||'')),[D.deal,ss.draft,ss.notes]);

  return <div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
      <h2 style={{fontSize:'1.15rem',fontWeight:700,margin:0}}>Deal Summary</h2>
      <button className="btn btn-p" onClick={handleExportPDF} style={{fontSize:'.82rem',padding:'6px 16px'}}>Export PDF</button>
    </div>
    <div className="card mb4" style={{borderLeft:'4px solid '+(ss.approved?'var(--green)':'var(--amber)')}}>
      <div className="card-h" style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:10,flexWrap:'wrap'}}>
        <span>Seller Motivation &amp; Situation</span>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-sm btn-s" onClick={()=>{
            const g=generateSellerSummary(D.deal);
            const extra=String(ss.notes||'').trim();
            const text=[g.draft,extra].filter(Boolean).join(' ');
            if(!text){alert('Nothing to draft from yet. Fill in the seller questions on the FDIF, or paste call notes below.');return}
            if(String(ss.draft||'').trim()&&!confirm('Replace the current draft?'))return;
            D.updateSellerSummary('draft',text);
            D.updateSellerSummary('approved',false);
          }}>Generate draft</button>
        </div>
      </div>
      <div className="card-b">
        <div style={{fontSize:'.78rem',color:'var(--text-sec)',marginBottom:10,lineHeight:1.5}}>
          Investors see this. It carries the seller's reason for selling, timeline, occupancy and anything affecting the close. It never carries their number, our leverage, competing offers or their finances.
        </div>

        <div className="fg">
          <label>Notes from offer scripts or calls (optional, not published as-is)</label>
          <AutoTextarea className="inp" minHeight={70} value={ss.notes||''}
            onChange={e=>D.updateSellerSummary('notes',e.target.value)}
            placeholder="Paste anything from the offer script or a call that belongs in the background. Keep the seller's number and our leverage out."/>
        </div>

        <div className="fg">
          <label>Summary as the investor will read it</label>
          <AutoTextarea className="inp" minHeight={88} value={ss.draft||''}
            onChange={e=>{D.updateSellerSummary('draft',e.target.value);if(ss.approved)D.updateSellerSummary('approved',false)}}
            placeholder="Click Generate draft, then edit. Nothing is exported until you approve it."
            style={{background:String(ss.draft||'').trim()?'var(--bg-white)':'#FFFF00'}}/>
        </div>

        {ssMissing.length>0&&<div className="warn-box" style={{fontSize:'.78rem',marginBottom:8}}>
          Not in the FDIF yet: {ssMissing.join(', ')}. The draft will be thin without it.
        </div>}
        {ssLeaks.length>0&&<div className="warn-box" style={{fontSize:'.78rem',marginBottom:8,borderColor:'var(--red)',color:'var(--red)'}}>
          ⛔ This text repeats something from the excluded list ({ssLeaks.join(', ')}). Remove it before approving.
        </div>}

        <label style={{display:'flex',alignItems:'center',gap:8,fontSize:'.88rem',fontWeight:600,
          cursor:ssLeaks.length?'not-allowed':'pointer',opacity:ssLeaks.length?.5:1}}>
          <input type="checkbox" checked={!!ss.approved} disabled={ssLeaks.length>0||!String(ss.draft||'').trim()}
            onChange={e=>D.updateSellerSummary('approved',e.target.checked)}
            style={{width:17,height:17,accentColor:'var(--green)'}}/>
          Reviewed and approved for export
        </label>
        {!ss.approved&&String(ss.draft||'').trim()&&<div style={{marginTop:6,fontSize:'.75rem',color:'var(--amber)'}}>
          Unapproved. This section is left out of the PDF.
        </div>}
      </div>
    </div>

    <div className="card mb4"><div className="card-b">
      <h3 style={{fontSize:'1.1rem',fontWeight:700,marginBottom:8}}>{fdif.address||'No address entered'}</h3>
      <div style={{display:'flex',gap:24,flexWrap:'wrap',fontSize:'.85rem'}}>
        <span><strong>{fdif.bedsBaths||'—'}</strong> Bed/Bath</span>
        <span><strong className="mono">{sqft?sqft.toLocaleString():'—'}</strong> SQFT</span>
        <span>Built <strong>{fdif.yearBuilt||'—'}</strong></span>
        <span className={mcc} style={{fontWeight:600}}>{mc}</span>
      </div>
    </div></div>

    {hasData&&<div className={'verdict '+vc}>{vt}</div>}

    <div className="mr">
      <div className="mc hl"><div className="lbl">Purchase Price</div><div className="val">{fmt(pp)}</div><div className="sub">{sqft&&pp?fmtSF(pp/sqft):''}</div></div>
      <div className="mc"><div className="lbl">As-Is FMV</div><div className="val">{fmt(aiARV)}</div><div className="sub">{sqft&&aiARV?fmtSF(aiARV/sqft):''}</div></div>
      <div className="mc"><div className="lbl">Full Reno ARV</div><div className="val">{fmt(frARV)}</div><div className="sub">{sqft&&frARV?fmtSF(frARV/sqft):''}</div></div>
      <div className="mc"><div className="lbl">Full Reno Budget</div><div className="val">{fmt(fr.total)}</div><div className="sub">{sqft?fmtSF(fr.total/sqft):''}</div></div>
    </div>

    {!hasData&&<div className="warn-box tc" style={{padding:24}}>Complete FDIF, Full Deal Eval, and Underwriting tabs to see the full summary.</div>}

    {hasData&&<>
      <div className="card mb4"><div className="card-h">Exit Comparison</div><div className="card-b" style={{padding:0,overflowX:'auto'}}>
        {!shown.length
          ?<div className="warn-box" style={{margin:16}}>No exits selected. Choose which exits to present on the Underwriting tab.</div>
          :<table className="tbl"><thead><tr>
            <th style={{width:'28%'}}>Metric</th>
            {shown.map(x=><th key={x.id} className="r" style={{color:x.color}}>{x.label}{x.hold?' ('+x.hold+'mo)':''}</th>)}
          </tr></thead><tbody>
            {[
              ['ARV / FMV',       x=>x.arv],
              ['Reno Cost',       x=>x.res.totalReno],
              ['Acq & Carry',     x=>x.res.totalAcqCarry],
              ['Financing',       x=>x.res.totalFinancingCost],
              ['Selling',         x=>x.res.totalSellingCost],
              ['Total Project Cost',x=>x.res.totalProjectCost,'bold'],
              ['Cash Required',   x=>x.res.cashAtClosing],
              ['Net Profit',      x=>x.res.netProfit,'hl'],
              ['ROI',             x=>x.res.allCostROI,'pct'],
              ['Cash-on-Cash',    x=>x.res.cashOnCash,'pct'],
              ['Profit / Month',  x=>x.res.profitPerMonth],
              ['MAO (Min Profit: '+fmt(u.minProfitTarget)+')',x=>x.res.mao,'bold'],
            ].map(([lbl,get,mode])=><tr key={lbl} style={mode==='hl'?{background:'var(--accent-bg)'}:undefined}>
              <td style={{fontWeight:mode==='bold'||mode==='hl'?700:400}}>{lbl}</td>
              {shown.map(x=>{
                let v;try{v=get(x)}catch{v=null}
                const txt=v==null||isNaN(v)?'\u2014':(mode==='pct'?fmtPct(v):fmt(v));
                return <td key={x.id} className="r mono" style={{fontWeight:mode==='bold'||mode==='hl'?700:400,
                  color:mode==='hl'?(v>=u.targetProfit?'var(--green)':v>=u.minProfitTarget?'var(--amber)':'var(--red)'):undefined}}>{txt}</td>;
              })}
            </tr>)}
            <tr><td style={{fontSize:'.75rem',color:'var(--text-sec)'}}>Basis</td>
              {shown.map(x=><td key={x.id} className="r" style={{fontSize:'.72rem',color:'var(--text-sec)'}}>
                {ARV_LABELS[x.arvKey]}<br/>{RENO_LABELS[x.renoKey]}
              </td>)}
            </tr>
          </tbody></table>}
      </div></div>

      <div className="card mb4"><div className="card-h">Comparable Sales Used</div><div className="card-b" style={{padding:0}}>
        <table className="tbl"><thead><tr><th>Type</th><th>Status</th><th>Address</th><th>Bed/Bath</th><th className="r">SQFT</th><th className="r">Price</th><th className="r">$/SF</th><th>Flip</th><th>Pool</th><th>Sale Date</th></tr></thead><tbody>
          {[...comps.asIs.filter(c=>c.address).map(c=>({...c,tp:'as-is'})),...comps.renovated.filter(c=>c.address).map(c=>({...c,tp:'reno'}))].map(c=><tr key={c.id}>
            <td><span className={'tag '+(c.tp==='as-is'?'tag-ai':'tag-rn')}>{c.tp==='as-is'?'AS-IS':'RENO'}</span></td>
            <td>{c.status?<span className={'badge '+(c.status==='Closed'?'bg-g':c.status==='Pending'?'bg-a':'')} style={{fontSize:'.65rem',...(c.status==='Active'?{background:'var(--accent-bg,#e8f0fe)',color:'var(--accent)',border:'1px solid var(--accent)'}:{})}}>{c.status}</span>:'—'}</td>
            <td>{c.address}</td><td>{c.bedBath}</td>
            <td className="r mono">{pn(c.sqft)?fmtNum(pn(c.sqft)):'—'}</td>
            <td className="r mono">{pn(c.price)?fmt(pn(c.price)):'—'}</td>
            <td className="r mono">{pn(c.price)&&pn(c.sqft)?fmtSF(pn(c.price)/pn(c.sqft)):'—'}</td>
            <td>{c.flip===true||c.flip==='Yes'||c.flip==='yes'||c.flip==='Y'?'Yes':(c.flip===false||c.flip==='No'||c.flip==='no'||c.flip==='N'?'No':(c.flip||'—'))}</td>
            <td>{c.pool===true||c.pool==='Yes'||c.pool==='yes'||c.pool==='Y'?'Yes':(c.pool===false||c.pool==='No'||c.pool==='no'||c.pool==='N'?'No':(c.pool||'—'))}</td>
            <td className="mono">{c.saleDate||'—'}</td>
          </tr>)}
          {comps.asIs.filter(c=>c.address).length+comps.renovated.filter(c=>c.address).length===0&&<tr><td colSpan={10} className="tmut tc">No comps entered yet</td></tr>}
        </tbody></table>
      </div></div>

      {/* Market Risk Section */}
      {(market.riskOfDecline||market.activeListings||market.avgDOM)&&<div className="card mb4"><div className="card-h">Market Risk <span className="tmut" style={{fontWeight:400,fontSize:'.75rem'}}>(from HouseCanary)</span></div><div className="card-b">
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:16}}>
          {/* Risk of Decline */}
          <div style={{textAlign:'center',padding:'12px 8px',borderRadius:8,background:parseFloat(market.riskOfDecline||0)>60?'var(--red-bg)':parseFloat(market.riskOfDecline||0)>30?'var(--amber-bg)':'var(--green-bg)',position:'relative'}}>
            <div style={{fontSize:'.72rem',color:'var(--text-muted)',marginBottom:4,display:'inline-flex',alignItems:'center',gap:4,justifyContent:'center'}}>
              Risk of Decline
              <span
                onClick={e=>{e.stopPropagation();setRiskTipOpen(o=>!o)}}
                onMouseEnter={()=>setRiskTipOpen(true)}
                onMouseLeave={()=>setRiskTipOpen(false)}
                style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:14,height:14,borderRadius:'50%',border:'1px solid var(--text-muted)',color:'var(--text-muted)',fontSize:'.62rem',fontWeight:700,cursor:'help',lineHeight:1,userSelect:'none'}}
              >i</span>
            </div>
            {riskTipOpen&&<div style={{position:'absolute',left:'50%',transform:'translateX(-50%)',top:'calc(100% + 6px)',zIndex:20,background:'var(--surface)',color:'var(--text)',padding:'12px 14px',borderRadius:8,fontSize:'.72rem',lineHeight:1.5,width:260,textAlign:'left',boxShadow:'0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15)',fontWeight:400,border:'1px solid var(--border)'}}>
              <div style={{fontWeight:600,marginBottom:4,color:'var(--text)'}}>Risk of Decline</div>
              HouseCanary's estimated probability (0–100%) that median home values in this ZIP will decline over the next 12 months. Under 30% = low risk, 30–60% = moderate, over 60% = elevated risk.
            </div>}
            <div style={{fontSize:'1.4rem',fontWeight:700,color:parseFloat(market.riskOfDecline||0)>60?'var(--red)':parseFloat(market.riskOfDecline||0)>30?'var(--amber)':'var(--green)'}}>{market.riskOfDecline?market.riskOfDecline+'%':'—'}</div>
            {market.riskLevel&&<div style={{fontSize:'.75rem',fontWeight:600,marginTop:2}}>{market.riskLevel}</div>}
            {market.riskLastYear&&<div className="tmut" style={{fontSize:'.68rem',marginTop:2}}>Last year: {market.riskLastYear}%</div>}
          </div>
          {/* Months of Supply */}
          <div style={{textAlign:'center',padding:'12px 8px',borderRadius:8,background:'var(--bg)'}}>
            <div style={{fontSize:'.72rem',color:'var(--text-muted)',marginBottom:4}}>Months of Supply (ZIP)</div>
            <div style={{fontSize:'1.4rem',fontWeight:700,fontFamily:'var(--mono)'}}>{(()=>{const calc=calcMOS(pn(market.activeListings),pn(market.closedLast30));return calc?calc.toFixed(1):(market.monthsOfSupply||'—')})()}</div>
            {market.mosLastYear&&<div className="tmut" style={{fontSize:'.68rem',marginTop:2}}>Last year: {market.mosLastYear}</div>}
          </div>
          {/* Days on Market */}
          <div style={{textAlign:'center',padding:'12px 8px',borderRadius:8,background:'var(--bg)'}}>
            <div style={{fontSize:'.72rem',color:'var(--text-muted)',marginBottom:4}}>Avg Days on Market (ZIP)</div>
            <div style={{fontSize:'1.4rem',fontWeight:700,fontFamily:'var(--mono)'}}>{market.avgDOM||'—'}</div>
            {market.domLastYear&&<div className="tmut" style={{fontSize:'.68rem',marginTop:2}}>Last year: {market.domLastYear} days</div>}
          </div>
        </div>
      </div></div>}

    </>}

    {/* Property Photos appendix — uploaded images get resized and appended 6/page to the PDF */}
    <PhotosCard D={D}/>
  </div>
}

function PhotosCard({D}){
  const photos=D.deal.photos||[];
  const[busy,setBusy]=useState(false);
  const fileInputRef=useRef(null);
  const onPick=async(e)=>{
    const files=Array.from(e.target.files||[]);
    e.target.value='';  // allow re-picking the same file
    if(!files.length)return;
    setBusy(true);
    const newOnes=[];
    for(const f of files){
      if(!f.type||!f.type.startsWith('image/'))continue;
      try{
        const{dataUrl,width,height}=await resizeImageFile(f,{maxDim:1200,quality:0.78});
        newOnes.push({id:uid(),name:f.name||'photo.jpg',dataUrl,width,height});
      }catch(err){console.error('resize failed',err);}
    }
    if(newOnes.length)D.addPhotos(newOnes);
    setBusy(false);
  };
  const estKB=Math.round(photos.reduce((s,p)=>s+((p.dataUrl||'').length*0.75)/1024,0));
  return <div className="card mb4"><div className="card-h" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
    <span>Property Photos <span className="tmut" style={{fontWeight:400,fontSize:'.75rem'}}>({photos.length} photo{photos.length===1?'':'s'}{photos.length?` · ~${estKB>1024?(estKB/1024).toFixed(1)+' MB':estKB+' KB'}`:''} · 6 per page in PDF)</span></span>
    <div style={{display:'flex',gap:6}}>
      <input ref={fileInputRef} type="file" accept="image/*" multiple style={{display:'none'}} onChange={onPick}/>
      <button className="btn btn-sm btn-p" onClick={()=>fileInputRef.current?.click()} disabled={busy}>{busy?'Processing…':'+ Add Photos'}</button>
      {photos.length>0&&<button className="btn btn-sm" onClick={()=>{if(confirm(`Remove all ${photos.length} photos from this deal?`))D.clearPhotos()}}>Clear All</button>}
    </div>
  </div><div className="card-b">
    {photos.length===0
      ? <div className="tmut tc" style={{padding:'18px 8px',fontSize:'.85rem'}}>
          No photos yet. Click <b>+ Add Photos</b> to upload one or more images. They'll be resized for print and added to the Deal Summary PDF at 6 per page.
        </div>
      : <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(140px,1fr))',gap:10}}>
          {photos.map((p,i)=>
            <div key={p.id} style={{border:'1px solid var(--border)',borderRadius:6,overflow:'hidden',background:'var(--bg)',position:'relative'}}>
              <div style={{aspectRatio:'4/3',background:'#000',display:'flex',alignItems:'center',justifyContent:'center'}}>
                <img src={p.dataUrl} alt={p.name} style={{maxWidth:'100%',maxHeight:'100%',objectFit:'contain'}}/>
              </div>
              <div style={{padding:'4px 6px',fontSize:'.68rem',display:'flex',justifyContent:'space-between',alignItems:'center',gap:4}}>
                <span className="tmut" style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1}} title={p.name}>{i+1}. {p.name}</span>
                <div style={{display:'flex',gap:2}}>
                  <button className="btn btn-sm" style={{padding:'1px 5px',fontSize:'.65rem'}} disabled={i===0} onClick={()=>D.movePhoto(p.id,-1)} title="Move left">◀</button>

                </div>
              </div>
            </div>
          )}
        </div>
    }
  </div></div>;
}

/* ── DEAL SYNC ─────────────────────────────────────────────────────
   Local-first. localStorage stays the source of truth on each machine;
   the server is a sync layer. If the network is unreachable (which has
   happened repeatedly from the DIS's location) the app keeps working
   and retries later rather than blocking the intake call. */
const PROXY='/.netlify/functions/api-proxy';

async function syncCall(action,data){
  const resp=await fetch(PROXY,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({target:'airtable',action,data}),
  });
  const raw=await resp.text();
  let json;
  try{json=JSON.parse(raw)}
  catch{throw Object.assign(new Error('Sync endpoint returned a non-JSON response (HTTP '+resp.status+')'),{status:resp.status})}
  if(!resp.ok||!json.ok)throw Object.assign(new Error(json.error||'Sync failed'),{status:resp.status,body:json});
  return json;
}

// Photos are base64 and would blow Airtable's 100k character field limit,
// so they stay on the machine that captured them and are never synced.
function stripForSync(deal){
  const{photos,...rest}=deal;
  return{...rest,photoCount:(photos||[]).length};
}

function useSync(D){
  const[status,setStatus]=useState('idle');   // idle|saving|saved|error|conflict
  const[detail,setDetail]=useState('');
  const[remote,setRemote]=useState([]);
  const[lastSaved,setLastSaved]=useState(null);
  const versions=useRef({});                   // dealId -> last known server timestamp
  const timer=useRef(null);
  const inFlight=useRef(false);

  const refreshList=useCallback(async()=>{
    try{
      const r=await syncCall('sync_list',{});
      setRemote(r.records||[]);
      for(const rec of r.records||[])if(rec.dealId)versions.current[rec.dealId]=rec.updated;
      return r.records||[];
    }catch(e){setStatus('error');setDetail(e.message);return null}
  },[]);

  const saveNow=useCallback(async(deal,{force,manual}={})=>{
    if(!deal||!deal.id)return;
    // An untouched "New Deal" placeholder has nothing worth sharing, and
    // uploading it clutters the other person's Team list.
    if(isEmptyDeal(deal)){
      if(manual)alert('Nothing to save yet.\n\nThis deal is still empty, so it will not be shared. Enter an address or any intake detail first.');
      setStatus('idle');
      return;
    }
    if(inFlight.current)return;
    inFlight.current=true;setStatus('saving');setDetail('');
    try{
      const payload={deal:stripForSync(deal)};
      if(!force)payload.expectedUpdated=versions.current[deal.id]??'';
      const r=await syncCall('sync_save',payload);
      versions.current[deal.id]=r.updated;
      setStatus('saved');setLastSaved(new Date());
    }catch(e){
      if(e.status===409){setStatus('conflict');setDetail(e.body?.serverUpdated||'')}
      else{setStatus('error');setDetail(e.message)}
    }finally{inFlight.current=false}
  },[]);

  const pull=useCallback(async(dealId)=>{
    const r=await syncCall('sync_get',{dealId});
    versions.current[dealId]=r.updated;
    return r.deal;
  },[]);

  const removeRemote=useCallback(async(dealId)=>{
    try{await syncCall('sync_delete',{dealId});setRemote(rs=>rs.filter(r=>r.dealId!==dealId))}
    catch(e){/* local delete already happened; server row can be cleared later */}
  },[]);

  // "Seen" = dealId + the server timestamp at the moment it was acknowledged.
  // A later edit by the other person makes it unseen again, which is what you want.
  const[seen,setSeen]=useState(()=>{
    try{return JSON.parse(localStorage.getItem('tphp-sync-seen')||'{}')}catch{return{}}
  });
  const persistSeen=useCallback(next=>{
    setSeen(next);
    try{localStorage.setItem('tphp-sync-seen',JSON.stringify(next))}catch{}
  },[]);
  const markSeen=useCallback(ids=>{
    const next={...seen};
    for(const r of remote)if(!ids||ids.includes(r.dealId))next[r.dealId]=r.updated;
    persistSeen(next);
  },[seen,remote,persistSeen]);

  // Debounced autosave. Fires 4s after the last keystroke so a live intake
  // call doesn't generate a request per character.
  const deal=D.deal;
  useEffect(()=>{
    if(!deal||!deal.id)return;
    if(timer.current)clearTimeout(timer.current);
    setStatus(s=>s==='conflict'?s:'idle');
    timer.current=setTimeout(()=>saveNow(deal),4000);
    return()=>{if(timer.current)clearTimeout(timer.current)};
  },[deal,saveNow]);

  useEffect(()=>{refreshList()},[refreshList]);

  return{status,detail,remote,lastSaved,saveNow,pull,refreshList,seen,markSeen,removeRemote,
    resolveKeepMine:()=>saveNow(D.deal,{force:true})};
}

/* Polls the Comp Packages table so a package the underwriter produced turns up
   on its own. Nothing is applied automatically: a package replaces comps and
   three valuations, so it always goes through the preview. */
function useCompPackages(){
  const[pending,setPending]=useState([]);
  const[err,setErr]=useState('');
  const refresh=useCallback(async()=>{
    try{const r=await syncCall('pkg_list',{});setPending(r.records||[]);setErr('');return r.records||[]}
    catch(e){setErr(e.message);return null}
  },[]);
  const fetchOne=useCallback(async packageId=>{
    const r=await syncCall('pkg_get',{packageId});
    return{pkg:r.package,dealId:r.dealId};
  },[]);
  const mark=useCallback(async(packageId,status)=>{
    try{await syncCall('pkg_mark',{packageId,status})}catch(e){/* non-fatal */}
    setPending(p=>p.filter(x=>x.packageId!==packageId));
  },[]);
  useEffect(()=>{refresh()},[refresh]);
  return{pending,err,refresh,fetchOne,mark};
}

function SyncBar({D,sync,packages}){
  const[open,setOpen]=useState(false);
  const s=sync.status;
  const label=s==='saving'?'Saving…':s==='saved'?'Saved':s==='conflict'?'Conflict':s==='error'?'Not synced':'Unsaved changes';
  const color=s==='saved'?'var(--green)':s==='conflict'||s==='error'?'var(--red)':'var(--text-sec)';
  const localIds=new Set(D.deals.map(d=>d.id));
  // Unseen = never acknowledged, or changed by the other person since you last looked.
  const unseen=sync.remote.filter(r=>r.dealId&&sync.seen[r.dealId]!==r.updated);
  const[busy,setBusy]=useState('');
  const[pkgOpen,setPkgOpen]=useState(false);

  // Pull a set of remote deals in one pass. Keeps the current deal active so a
  // bulk run does not move the user, and reports what failed rather than
  // stopping at the first error.
  const pullMany=async(rows,label)=>{
    let done=0;const failed=[];
    for(let i=0;i<rows.length;i++){
      const r=rows[i];
      setBusy(label+' '+(i+1)+' of '+rows.length+'…');
      try{
        const d=await sync.pull(r.dealId);
        D.upsertDeal(d,localIds.has(r.dealId),true);
        done++;
      }catch(e){failed.push(r.address||r.dealId)}
    }
    sync.markSeen();setBusy('');
    if(failed.length)alert(label+' finished: '+done+' of '+rows.length+'.\n\nFailed:\n'+failed.join('\n'));
    return done;
  };

  const openAll=async()=>{
    const todo=unseen.filter(r=>!localIds.has(r.dealId));
    if(!todo.length){sync.markSeen();return}
    if(!confirm('Pull '+todo.length+' new deal(s) into your app?'))return;
    await pullMany(todo,'Opening');
  };

  const refreshAll=async()=>{
    await sync.refreshList();
    const rows=sync.remote.filter(r=>r.dealId);
    if(!rows.length)return;
    const updating=rows.filter(r=>localIds.has(r.dealId)).length;
    const adding=rows.length-updating;
    if(!confirm('Pull the latest version of all '+rows.length+' shared deal(s)?\n\n'
      +updating+' already here will be overwritten with the server copy.\n'
      +adding+' new will be added.\n\nAny unsaved local edits to those deals are lost. Photos stay on this machine.'))return;
    await pullMany(rows,'Refreshing');
  };

  return <div style={{display:'flex',alignItems:'center',gap:8}}>
    <span onClick={()=>{
      if(s==='error')alert('Sync error\n\n'+(sync.detail||'(no detail)')+'\n\nCommon causes:\n1. AIRTABLE_SYNC_TABLE env var missing, or added but the site was not redeployed afterward.\n2. AIRTABLE_BASE_ID not set to the base holding the Deal Sync table.\n3. The Airtable token lacks write access to that base.\n4. Table name mismatch (must be exactly "Deal Sync").');
      else if(s==='conflict')alert('This deal was changed elsewhere after you opened it.\n\nServer version: '+(sync.detail||'unknown'));
    }} style={{fontSize:'.72rem',fontWeight:600,color,cursor:s==='error'||s==='conflict'?'pointer':'default',textDecoration:s==='error'?'underline':'none'}} title={sync.detail||''}>
      {s==='saved'&&'✓ '}{s==='error'&&'⚠ '}{s==='conflict'&&'⚠ '}{label}
      {s==='saved'&&sync.lastSaved&&<span style={{opacity:.6,fontWeight:400}}> {sync.lastSaved.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</span>}
    </span>
    <button className="btn btn-sm btn-s" onClick={()=>sync.saveNow(D.deal,{manual:true})} disabled={s==='saving'}>Save</button>
    <button className="btn btn-sm btn-s" onClick={async()=>{await sync.refreshList();setOpen(o=>!o)}}>
      Team{unseen.length?' ('+unseen.length+')':''}
    </button>
    {packages&&packages.pending.length>0&&<button className="btn btn-sm btn-p"
      title="Comp packages waiting from the underwriter"
      onClick={async()=>{await packages.refresh();setPkgOpen(o=>!o)}}>
      📦 {packages.pending.length}
    </button>}

    {pkgOpen&&packages&&<div style={{position:'absolute',top:52,right:16,zIndex:60,background:'var(--bg-white)',
      border:'1px solid var(--border)',borderRadius:'var(--r)',boxShadow:'0 8px 24px rgba(0,0,0,.15)',
      padding:12,minWidth:360,maxHeight:420,overflowY:'auto'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
        <strong style={{fontSize:'.85rem'}}>Comp packages waiting</strong>
        <button className="btn btn-sm btn-s" onClick={()=>setPkgOpen(false)}>Close</button>
      </div>
      {packages.pending.map(p=>{
        const m=matchPackageToDeal(p,D.deals);
        const known=!!m.deal;
        const mine=!!(m.deal&&m.deal.id===D.deal.id);
        return <div key={p.packageId} style={{padding:'8px 0',borderBottom:'1px solid var(--border)'}}>
          <div style={{fontSize:'.8rem',fontWeight:600}}>{p.address||'(no address)'}</div>
          <div style={{fontSize:'.68rem',color:'var(--text-sec)',marginBottom:6}}>
            {p.created?new Date(p.created).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):''}
            {p.source?' · '+p.source:''}
            {mine?' · this deal':known?' · '+(m.deal.fdif.address||'another deal'):' · no matching deal'}
            {known&&m.how!=='deal id'?' · matched by '+m.how:''}
          </div>
          <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
            <button className="btn btn-sm btn-p" disabled={!known} onClick={async()=>{
              try{
                const{pkg}=await packages.fetchOne(p.packageId);
                const parsed=parseCompPackage(pkg);
                if(!parsed.ok){alert('That package could not be read.\n\n'+parsed.error);return}
                // Switch to the deal we matched, not the id on the row: the
                // dispatcher may have written an Airtable record id instead.
                if(m.deal&&m.deal.id!==D.deal.id){
                  if(m.how!=='deal id'&&!confirm('This package was matched to "'+(m.deal.fdif.address||m.deal.id)+'" by '+m.how+'.\n\nOpen that deal and preview?'))return;
                  D.switchDeal(m.deal.id);
                }
                D.stagePackage({...parsed,packageId:p.packageId});
                setPkgOpen(false);
              }catch(e){alert('Could not open that package: '+e.message)}
            }}>{mine?'Preview':'Open deal and preview'}</button>
            <button className="btn btn-sm btn-s" onClick={()=>{
              if(confirm('Dismiss this package? It stops showing here.'))packages.mark(p.packageId,'Dismissed');
            }}>Dismiss</button>
          </div>
          {!known&&<div style={{fontSize:'.68rem',color:'var(--amber)',marginTop:4}}>
            {m.how==='ambiguous address'
              ?'More than one deal has this address. Resolve the duplicate, then try again.'
              :'No deal matches id '+(p.dealId||'(none)')+' or this address. Pull the deal in from Team first.'}
          </div>}
        </div>;
      })}
      {packages.err&&<div className="warn-box" style={{fontSize:'.75rem',marginTop:8}}>{packages.err}</div>}
    </div>}

    {s==='conflict'&&<button className="btn btn-sm btn-d" onClick={()=>{
      if(confirm('This deal was changed elsewhere after you opened it.\n\nOK = overwrite the other copy with yours\nCancel = leave it alone (copy your changes out first)'))sync.resolveKeepMine();
    }}>Resolve</button>}

    {open&&<div style={{position:'absolute',top:52,right:16,zIndex:60,background:'var(--bg-white)',border:'1px solid var(--border)',
      borderRadius:'var(--r)',boxShadow:'var(--shadow-lg,0 8px 24px rgba(0,0,0,.15))',padding:12,minWidth:340,maxHeight:420,overflowY:'auto'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8,gap:8}}>
        <strong style={{fontSize:'.85rem'}}>Shared deals {unseen.length?'('+unseen.length+' new)':''}</strong>
        <div style={{display:'flex',gap:6}}>
          {unseen.some(r=>!localIds.has(r.dealId))&&<button className="btn btn-sm btn-p" onClick={openAll} disabled={!!busy}>Open all</button>}
          {sync.remote.length>0&&<button className="btn btn-sm btn-s" onClick={refreshAll} disabled={!!busy}>Refresh all</button>}
          {unseen.length>0&&<button className="btn btn-sm btn-s" onClick={()=>sync.markSeen()} disabled={!!busy}>Mark all seen</button>}
          <button className="btn btn-sm btn-s" onClick={()=>setOpen(false)}>Close</button>
        </div>
      </div>
      {busy&&<div style={{fontSize:'.78rem',color:'var(--accent)',marginBottom:6}}>{busy}</div>}
      {!sync.remote.length&&<div style={{fontSize:'.78rem',color:'var(--text-sec)'}}>Nothing synced yet.</div>}
      {(()=>{
        const norm=a=>(a||'').trim().toLowerCase().replace(/\s+/g,' ');
        const counts={};sync.remote.forEach(r=>{const k=norm(r.address);if(k)counts[k]=(counts[k]||0)+1});
        const dupes=Object.entries(counts).filter(([,n])=>n>1);
        if(!dupes.length)return null;
        return <div className="warn-box" style={{marginBottom:8,fontSize:'.76rem'}}>
          {dupes.length} address{dupes.length>1?'es appear':' appears'} more than once on the server. Open each, keep the fuller copy, delete the other.
        </div>;
      })()}
      {sync.remote.map(r=>{
        const here=localIds.has(r.dealId);
        const isNew=sync.seen[r.dealId]!==r.updated;
        const blank=!r.address||r.address==='New Deal';
        return <div key={r.dealId} style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:10,
          padding:'6px 0',borderBottom:'1px solid var(--border)',background:isNew?'#EEF4FF':'transparent'}}>
          <div style={{minWidth:0}}>
            <div style={{fontSize:'.8rem',fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
              {isNew&&<span style={{color:'var(--accent)'}}>• </span>}{r.address||'(no address)'}
            </div>
            <div style={{fontSize:'.68rem',color:'var(--text-sec)'}}>
              {[r.market,r.investor].filter(Boolean).join(' · ')||'Unassigned'}
              {r.updated&&' · '+new Date(r.updated).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
            </div>
          </div>
          <div style={{display:'flex',gap:6,flex:'0 0 auto'}}>
            {blank&&<button className="btn btn-sm btn-d" title="Remove this empty placeholder from the shared list" onClick={async()=>{
              if(confirm('Remove this empty entry from the shared list?\n\nIt has no address and nothing to underwrite.'))await sync.removeRemote(r.dealId);
            }}>Remove</button>}
            <button className="btn btn-sm btn-p" disabled={!!busy} onClick={async()=>{
              try{
                const d=await sync.pull(r.dealId);
                // Refreshing a deal you are not on should not drag you onto it.
                D.upsertDeal(d,here,here&&r.dealId!==D.deal.id);
                sync.markSeen([r.dealId]);
                if(!here||r.dealId===D.deal.id)setOpen(false);
              }catch(e){alert('Could not open that deal: '+e.message)}
            }}>{here?'Refresh':'Open'}</button>
          </div>
        </div>;
      })}
    </div>}
  </div>;
}

function App(){
  const[activeTab,setActiveTab]=useState('fdif');
  const D=useDealData();
  const sync=useSync(D);
  const packages=useCompPackages();
  const[toast,setToast]=useState(null);
  const tt=useRef(null);
  const showToast=useCallback(m=>{setToast(m);if(tt.current)clearTimeout(tt.current);tt.current=setTimeout(()=>setToast(null),3000)},[]);

  // Deal selector: grouped by investor, filtered by market.
  const[mktFilter,setMktFilter]=useState('');
  const allMarkets=useMemo(()=>Array.from(new Set(
    D.deals.map(d=>(d.fdif.marketArea||'').trim()).filter(Boolean)
  )).sort(),[D.deals]);
  const dealGroups=useMemo(()=>{
    const visible=mktFilter?D.deals.filter(d=>(d.fdif.marketArea||'').trim()===mktFilter):D.deals;
    const byInv=new Map();
    for(const d of visible){
      const key=d.investorName||'TPHP / Unassigned';
      if(!byInv.has(key))byInv.set(key,[]);
      byInv.get(key).push(d);
    }
    // Named investors first, alphabetically; unassigned last.
    return Array.from(byInv.entries())
      .sort((a,b)=>{
        const ua=a[0]==='TPHP / Unassigned',ub=b[0]==='TPHP / Unassigned';
        return ua!==ub?(ua?1:-1):a[0].localeCompare(b[0]);
      })
      .map(([label,deals])=>({label,deals}));
  },[D.deals,mktFilter]);

  const renderTab=()=>{
    switch(activeTab){
      case'fdif':return <TabFDIF D={D}/>;
      case'quick':return <TabQuickOffer D={D}/>;
      case'full':return <TabFullDeal D={{...D,markPackage:packages.mark}}/>;
      case'uw':return <TabUW D={D}/>;
      case'summary':return <TabSummary D={D}/>;
      case'listing':return <TabListingStrategy D={D} showToast={showToast}/>;
      case'dispo':return <TabDispo D={D}/>;
    }
  };

  return <>
    <header className="hdr">
      <div className="f ac" style={{gap:14}}>
        <img src={LOGO_BLK} alt="TPHP" style={{height:36,objectFit:'contain'}}/>
        <div style={{height:24,width:1,background:'var(--border)'}}></div>
        <h1>Deal Evaluation</h1>
      </div>
      <div className="hdr-r">
        <select className="inp inp-m" value={mktFilter} onChange={e=>setMktFilter(e.target.value)} title="Filter deals by market" style={{maxWidth:150,fontSize:'.8rem'}}>
          <option value="">All markets</option>
          {allMarkets.map(m=><option key={m} value={m}>{m}</option>)}
        </select>
        <select className="deal-sel" value={D.deal.id} onChange={e=>D.switchDeal(e.target.value)}>
          {dealGroups.map(g=><optgroup key={g.label} label={g.label}>
            {g.deals.map(d=><option key={d.id} value={d.id}>{d.fdif.address||d.name||'New Deal'}{d.fdif.marketArea?'  ·  '+d.fdif.marketArea:''}</option>)}
          </optgroup>)}
          {!dealGroups.some(g=>g.deals.some(d=>d.id===D.deal.id))&&
            <option value={D.deal.id}>{D.deal.fdif.address||D.deal.name||'New Deal'} (hidden by filter)</option>}
        </select>
        <button className="btn btn-sm btn-p" onClick={()=>{D.newDeal();showToast('New deal created')}}>+ New</button>
        <button className="btn btn-sm btn-s" onClick={()=>{D.exportData();showToast('Data exported')}}>Export</button>
        <label className="btn btn-sm btn-s" style={{cursor:'pointer',margin:0}}>Import<input type="file" accept=".json" style={{display:'none'}} onChange={e=>{
          const f=e.target.files[0];if(!f)return;
          const merge=confirm('ADD these deals to what you already have?\n\nOK = Add (your current deals are kept)\nCancel = Replace everything (your current deals are DELETED)');
          D.importData(f,merge?'merge':'replace');
          showToast(merge?'Deals added':'Data replaced');
          e.target.value='';
        }}/></label>
        <button className="btn btn-sm btn-d" onClick={async()=>{const label=D.deal.fdif.address||D.deal.name||'New Deal';const id=D.deal.id;if(confirm('Delete "'+label+'" permanently?\n\nThis removes it from your list AND from the shared list. It cannot be undone.')){await sync.removeRemote(id);D.deleteDeal(id);showToast('Deal deleted')}}}>Delete</button>
        <SyncBar D={D} sync={sync} packages={packages}/>
        <button className="btn btn-sm btn-d" onClick={()=>{if(confirm('Clear the entries on this deal only?\n\nYour other saved deals are not affected. Empty "New Deal" placeholders will also be removed from the list.')){D.clearDeal();showToast('Deal cleared')}}}>Clear</button>
      </div>
    </header>
    <nav className="tabs">{TABS.map(t=><button key={t.id} className={'tab'+(activeTab===t.id?' on':'')} onClick={()=>setActiveTab(t.id)}>{t.label}</button>)}</nav>
    <main className="main">{renderTab()}</main>
    {toast&&<div className="toast">{toast}</div>}
  </>
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
