function useDealData(){
  const[state,setState]=useState(()=>{
    try{
      const r=localStorage.getItem(SKEY);
      if(r){
        const p=JSON.parse(r);
        if(p?.deals?.length){
          // Migrate old deals: ensure all fields exist
          p.deals=p.deals.map(d=>{
            const migrated={
              ...d,
              market:d.market||{activeListings:'',pendingLast30:'',closedLast30:'',avgDOM:''},
              renoNotes:d.renoNotes||{},
              renoContingencyPct:d.renoContingencyPct??20,
              renoCustom:d.renoCustom||null,
              underwriting:{downPayment:0,...(d.underwriting||{purchasePrice:'',holdFullReno:6,holdQuickFlip:3,holdAsIs:0})},
              uwDefaults:d.uwDefaults||{},
              dispo:{...blankDispo(),...(d.dispo||{})},
              leadRecordId:d.leadRecordId||'',
              uwPackage:d.uwPackage||null,
              stagedPackage:d.stagedPackage||null,
              sellerSummary:{draft:'',notes:'',approved:false,...(d.sellerSummary||{})},
              selectedExits:Array.isArray(d.selectedExits)&&d.selectedExits.length?d.selectedExits:[...DEFAULT_EXITS],
              exitBasis:d.exitBasis||{},
              investorId:d.investorId||'',
              investorName:d.investorName||'',
              listingStrategy:{...defaultListingStrategy(),...(d.listingStrategy||{})},
              photos:Array.isArray(d.photos)?d.photos:[],
            };
            // Migrate adjustment multipliers from decimal (1.0) to percentage (100)
            if(migrated.comps){
              if(migrated.comps.adjustAsIs!=null&&migrated.comps.adjustAsIs<=5)migrated.comps={...migrated.comps,adjustAsIs:Math.round(migrated.comps.adjustAsIs*100)};
              if(migrated.comps.adjustReno!=null&&migrated.comps.adjustReno<=5)migrated.comps={...migrated.comps,adjustReno:Math.round(migrated.comps.adjustReno*100)};
            }
            // Migrate old commissionRate+closingCostSell to new split fields
            if(migrated.uwDefaults&&migrated.uwDefaults.commissionRate!=null){
              const cr=migrated.uwDefaults.commissionRate;
              if(!migrated.uwDefaults.listingCommPct)migrated.uwDefaults.listingCommPct=cr/2;
              if(!migrated.uwDefaults.buyerCommPct)migrated.uwDefaults.buyerCommPct=cr/2;
              delete migrated.uwDefaults.commissionRate;
            }
            if(migrated.uwDefaults&&migrated.uwDefaults.closingCostSell!=null&&!migrated.uwDefaults.titleEscrowPct){
              migrated.uwDefaults.titleEscrowPct=migrated.uwDefaults.closingCostSell;
              delete migrated.uwDefaults.closingCostSell;
            }
            // One-time migration of decimal percentages to whole numbers
            // (0.2 -> 20). It ran on load every time and could not tell a legacy
            // 0.2 from a real 0.5% property tax rate, so investor profiles with
            // sub-1% figures were multiplied by 100 on every page load. Now it
            // runs once per deal and records that it has.
            if(migrated.uwDefaults&&!migrated.pctMigrated){
              const ud=migrated.uwDefaults;
              // A single threshold cannot work here: a legacy 0.2 meaning 20%
              // contingency looks identical to a genuine 0.2% fee rate. Each field
              // gets the lowest value that is still plausible as a real percentage.
              // Below that floor the number can only be a legacy decimal.
              const FLOOR={closingCostBuy:0.1,propTaxRate:0.1,loanPoints:0.1,
                listingCommPct:0.1,buyerCommPct:0.1,titleEscrowPct:0.1,
                contingencyPct:1,ltc:1,ltv:1,interestRate:1,minROI:1,targetROI:1};
              for(const k of Object.keys(FLOOR)){
                if(ud[k]!=null&&ud[k]>0&&ud[k]<FLOOR[k])ud[k]=Math.round(ud[k]*10000)/100;
              }
              migrated.pctMigrated=true;
            }
            return migrated;
          });
          p.investors=Array.isArray(p.investors)?p.investors:[];
          p.marketRates=(p.marketRates&&typeof p.marketRates==='object')?{...SEED_MARKET_RATES,...p.marketRates}:{...SEED_MARKET_RATES};
          return p;
        }
      }
    }catch(e){}
    const b=blankDeal();return{deals:[b],activeDealId:b.id,investors:[],marketRates:{...SEED_MARKET_RATES}}
  });
  useEffect(()=>{
    try{localStorage.setItem(SKEY,JSON.stringify(state))}
    catch(e){
      // Quota exceeded — most likely photos are too large. Warn once.
      if(!window.__tphpQuotaWarned){
        window.__tphpQuotaWarned=true;
        alert('Warning: browser storage is full. Recent changes (especially photo uploads) may not be saved when you reload. Export your data to back it up, then remove some photos.');
      }
    }
  },[state]);
  const deal=state.deals.find(d=>d.id===state.activeDealId)||state.deals[0];
  // Stamp every change so import and sync can tell which copy is newer.
  const up=(fn)=>setState(p=>({...p,deals:p.deals.map(d=>d.id===p.activeDealId?{...fn(d),updatedAt:new Date().toISOString()}:d)}));
  return{
    deals:state.deals,deal,
    investors:state.investors||[],
    /* ── Investor Capital Profiles ──────────────────────────────────
       Stored as a sibling array to `deals`, not inside any one deal, so a
       profile is entered once at onboarding and reused across properties.
       Applying a profile SNAPSHOTS its numbers into the deal's uwDefaults.
       Editing the profile later never silently reprices an existing deal. */
    marketRates:state.marketRates||SEED_MARKET_RATES,
    saveMarketRates:useCallback((market,rates)=>setState(p=>{
      const key=String(market||'').trim();
      if(!key)return p;
      return{...p,marketRates:{...(p.marketRates||SEED_MARKET_RATES),[key]:{...rates}}};
    }),[]),
    saveDefaultRates:useCallback(rates=>setState(p=>({
      ...p,marketRates:{...(p.marketRates||SEED_MARKET_RATES),__default:{...rates}},
    })),[]),
    clearMarketRates:useCallback(market=>setState(p=>{
      const key=String(market||'').trim();
      const next={...(p.marketRates||SEED_MARKET_RATES)};
      delete next[key];
      return{...p,marketRates:next};
    }),[]),
    saveInvestor:useCallback((inv)=>{
      const rec={...inv,id:inv.id||uid(),updatedAt:new Date().toISOString()};
      setState(p=>{
        const list=p.investors||[];
        const i=list.findIndex(x=>x.id===rec.id);
        return{...p,investors:i>=0?list.map(x=>x.id===rec.id?rec:x):[...list,rec]};
      });
      return rec.id;
    },[]),
    deleteInvestor:useCallback(id=>setState(p=>({
      ...p,
      investors:(p.investors||[]).filter(x=>x.id!==id),
      // Detach the profile from any deal that referenced it, but keep that
      // deal's already-snapshotted numbers intact.
      deals:p.deals.map(d=>d.investorId===id?{...d,investorId:'',investorName:(d.investorName||'')+' (deleted)'}:d),
    })),[]),
    applyInvestor:useCallback(id=>setState(p=>{
      const inv=(p.investors||[]).find(x=>x.id===id);
      if(!inv)return p;
      return{...p,deals:p.deals.map(d=>d.id===p.activeDealId
        ?{...d,investorId:inv.id,investorName:inv.name,uwDefaults:{...(inv.uw||{})}}
        :d)};
    }),[]),
    // Snapshot a DFYA Buy Box profile onto this deal. Missing questionnaire
    // fields fall back to TPHP defaults rather than to zero.
    applyInvestorProfile:useCallback(inv=>up(d=>({
      ...d,investorId:inv.id,investorName:inv.name,uwDefaults:{...(inv.uw||{})},
    })),[]),
    clearInvestor:useCallback(()=>up(d=>({...d,investorId:'',investorName:'',uwDefaults:{}})),[]),
    updateDeal:useCallback(u=>up(d=>({...d,...u})),[]),
    updateFDIF:useCallback((f,v)=>up(d=>{const r={...d,fdif:{...d.fdif,[f]:v}};if(f==='address'&&v)r.name=v;return r}),[]),
    updateQO:useCallback((f,v)=>up(d=>({...d,quickOffer:{...d.quickOffer,[f]:v}})),[]),
    updateComp:useCallback((t,cid,f,v)=>up(d=>({...d,comps:{...d.comps,[t]:d.comps[t].map(c=>c.id===cid?{...c,[f]:v}:c)}})),[]),
    addComp:useCallback(t=>up(d=>({...d,comps:{...d.comps,[t]:[...d.comps[t],blankComp()]}})),[]),
    removeComp:useCallback((t,cid)=>up(d=>{const remaining=d.comps[t].filter(c=>c.id!==cid);return{...d,comps:{...d.comps,[t]:remaining.length>0?remaining:[]}};}),[]),
    updateCF:useCallback((f,v)=>up(d=>({...d,comps:{...d.comps,[f]:v}})),[]),
    /* Apply a parsed underwriter package. Comps replace the existing set rather
       than appending, because a package is a complete re-analysis, not an
       addition. Subject fields only fill blanks unless overwrite is asked for. */
    applyCompPackage:useCallback((pkg,{overwriteSubject}={})=>up(d=>{
      const mk=c=>({...blankComp(),id:uid(),address:c.address,bedBath:c.bedBath,sqft:c.sqft,
        price:c.price,listPrice:c.listPrice,dom:c.dom,saleDate:c.saleDate,status:c.status,
        distance:c.distance,yearBuilt:c.yearBuilt,pool:c.pool,garageSpaces:c.garageSpaces,
        condition:c.condition,notes:c.notes,similarity:'',flip:''});
      const asIs=pkg.comps.filter(c=>c.classification==='asIs').map(mk);
      const reno=pkg.comps.filter(c=>c.classification==='renovated').map(mk);
      const fdif={...d.fdif};
      Object.entries(pkg.subject).forEach(([k,v])=>{
        if(!v)return;
        if(overwriteSubject||!String(fdif[k]||'').trim())fdif[k]=v;
      });
      const mkt={...d.market};
      if(pkg.market.activeListings)mkt.activeListings=pkg.market.activeListings;
      if(pkg.market.closedLast30)mkt.closedLast30=pkg.market.closedLast30;
      return{...d,fdif,market:mkt,
        comps:{...d.comps,asIs:asIs.length?asIs:[blankComp()],renovated:reno.length?reno:[blankComp()]},
        // The underwriter's adjusted values, kept beside the comp-derived ones.
        uwPackage:{
          importedAt:new Date().toISOString(),
          dealId:pkg.dealId||'',
          valuations:pkg.valuations,
          underwriterMAO:pkg.underwriterMAO,
          useArvOverride:!!pkg.valuations.arv.value,
        }};
    }),[]),
    /* A package opened from the header badge is staged on the deal, so the
       existing Full Deal Eval preview is the single place an import is
       reviewed and approved. */
    stagePackage:useCallback(pkg=>up(d=>({...d,stagedPackage:pkg})),[]),
    clearStagedPackage:useCallback(()=>up(d=>({...d,stagedPackage:null})),[]),
    setArvOverrideUse:useCallback(v=>up(d=>({...d,uwPackage:{...(d.uwPackage||{}),useArvOverride:!!v}})),[]),
    importComps:useCallback((staged)=>{
      up(d=>{
        const mapComp=c=>({id:uid(),address:c.address,bedBath:c.bedBath,sqft:c.sqft,price:c.price,listPrice:c.listPrice||'',dom:c.dom||'',saleDate:c.saleDate,similarity:c.similarity||'',status:c.status||'',distance:c.distance||'',yearBuilt:c.yearBuilt||'',pool:c.pool||'',garageSpaces:c.garageSpaces||'',flip:c.flip||'',condition:c.condition||'',notes:c.propertyType||''});
        const asIsNew=staged.filter(c=>c.classification==='asIs').map(mapComp);
        const renoNew=staged.filter(c=>c.classification==='renovated').map(mapComp);
        const curAI=d.comps.asIs.filter(c=>c.address||c.price);
        const curRN=d.comps.renovated.filter(c=>c.address||c.price);
        return{...d,comps:{...d.comps,
          asIs:[...curAI,...asIsNew].length?[...curAI,...asIsNew]:[blankComp()],
          renovated:[...curRN,...renoNew].length?[...curRN,...renoNew]:[blankComp()],
        }};
      });
    },[]),
    updateMkt:useCallback((f,v)=>up(d=>({...d,market:{...d.market,[f]:v}})),[]),
    updateRS:useCallback((c,l)=>up(d=>({...d,renoScope:{...d.renoScope,[c]:l}})),[]),
    updateRN:useCallback((c,n)=>up(d=>({...d,renoNotes:{...d.renoNotes,[c]:n}})),[]),
    setRenoCustom:useCallback(rc=>up(d=>({...d,renoCustom:rc})),[]),
    clearRenoCustom:useCallback(()=>up(d=>({...d,renoCustom:null,renoNotes:{}})),[]),
    updateRenoItem:useCallback((idx,field,val)=>up(d=>{
      if(!d.renoCustom)return d;
      const items=[...d.renoCustom.lineItems];
      items[idx]={...items[idx],[field]:val};
      return{...d,renoCustom:{...d.renoCustom,lineItems:items}};
    }),[]),
    setPoolChoice:useCallback(choice=>up(d=>{
      if(!d.renoCustom)return d;
      return{...d,renoCustom:{...d.renoCustom,poolChoice:choice}};
    }),[]),
    updateUW:useCallback((f,v)=>up(d=>({...d,underwriting:{...d.underwriting,[f]:v}})),[]),
    updateUWD:useCallback((f,v)=>up(d=>({...d,uwDefaults:{...d.uwDefaults,[f]:v}})),[]),
    updateSellerSummary:useCallback((f,v)=>up(d=>({...d,sellerSummary:{draft:'',notes:'',approved:false,...(d.sellerSummary||{}),[f]:v}})),[]),
    updateDispo:useCallback((f,v)=>up(d=>({...d,dispo:{...blankDispo(),...(d.dispo||{}),[f]:v}})),[]),
    updateIA:useCallback((f,v)=>up(d=>({...d,ia:{...(d.ia||{}),[f]:v}})),[]),
    updateIAD:useCallback((f,v)=>up(d=>({...d,iaDefaults:{...(d.iaDefaults||{}),[f]:v}})),[]),
    updateLS:useCallback((f,v)=>up(d=>({...d,listingStrategy:{...(d.listingStrategy||{}),[f]:v}})),[]),
    addPhotos:useCallback(photos=>up(d=>({...d,photos:[...(d.photos||[]),...photos]})),[]),
    removePhoto:useCallback(id=>up(d=>({...d,photos:(d.photos||[]).filter(p=>p.id!==id)})),[]),
    movePhoto:useCallback((id,delta)=>up(d=>{
      const arr=[...(d.photos||[])];
      const i=arr.findIndex(p=>p.id===id);
      if(i<0)return d;
      const j=i+delta;
      if(j<0||j>=arr.length)return d;
      [arr[i],arr[j]]=[arr[j],arr[i]];
      return{...d,photos:arr};
    }),[]),
    clearPhotos:useCallback(()=>up(d=>({...d,photos:[]})),[]),
    newDeal:useCallback(()=>{const b=blankDeal();setState(p=>({deals:[...p.deals,b],activeDealId:b.id}))},[]),
    switchDeal:useCallback(id=>setState(p=>({...p,activeDealId:id})),[]),
    deleteDeal:useCallback(id=>setState(p=>{const rem=p.deals.filter(d=>d.id!==id);if(!rem.length){const b=blankDeal();return{deals:[b],activeDealId:b.id}}return{deals:rem,activeDealId:p.activeDealId===id?rem[0].id:p.activeDealId}}),[]),
    clearDeal:useCallback(()=>setState(p=>{
      // Blank the active deal in place, then drop any OTHER deal that is still
      // untouched so the dropdown doesn't accumulate duplicate "New Deal" rows.
      const cleared=p.deals.map(d=>d.id===p.activeDealId?{...blankDeal(),id:d.id}:d);
      const kept=cleared.filter(d=>d.id===p.activeDealId||!isEmptyDeal(d));
      return{deals:kept.length?kept:cleared,activeDealId:p.activeDealId};
    }),[]),
    resetAll:useCallback(()=>{const b=blankDeal();setState({deals:[b],activeDealId:b.id})},[]),
    exportData:useCallback(()=>{
      const json=JSON.stringify(state,null,2);
      const blob=new Blob([json],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;a.download='tphp-deal-data.json';a.click();
      URL.revokeObjectURL(url);
    },[state]),
    // Insert a deal pulled from the server, or refresh the local copy in place.
    // Local photos are preserved, since they are never synced.
    // keepActive: used by bulk refresh so a loop does not drag the user onto
    // whichever deal happened to be pulled last.
    upsertDeal:useCallback((incoming,exists,keepActive)=>setState(p=>{
      const base=blankDeal();
      const merged={...base,...incoming,photos:undefined};
      const deals=exists
        ?p.deals.map(d=>d.id===incoming.id?{...merged,photos:d.photos||[]}:d)
        :[...p.deals,{...merged,photos:[]}];
      return{...p,deals,activeDealId:keepActive?p.activeDealId:incoming.id};
    }),[]),
    importData:useCallback((file,mode)=>{
      const reader=new FileReader();
      reader.onload=e=>{
        try{
          const data=JSON.parse(e.target.result);
          if(!data?.deals?.length){alert('Invalid backup file — no deals found.');return}
          if(mode==='replace'){setState({...data,investors:data.investors||[]});return}
          // MERGE: keep everything already here, add what's incoming.
          // Colliding ids are re-issued rather than overwritten, so nothing
          // on this machine is ever silently replaced by an imported file.
          setState(p=>{
            const byId=new Map(p.deals.map(d=>[d.id,d]));
            // A colliding id means this is the SAME deal, not a different one.
            // Re-issuing a new id here created exact twins that then synced as
            // separate records. Take the newer copy instead and never duplicate.
            const newer=(a,b)=>{
              const ta=Date.parse(a&&a.updatedAt||a&&a.createdAt||0)||0;
              const tb=Date.parse(b&&b.updatedAt||b&&b.createdAt||0)||0;
              return ta>=tb;
            };
            let replaced=0,skipped=0;
            const merged=p.deals.map(d=>{
              const inc=data.deals.find(x=>x.id===d.id);
              if(!inc)return d;
              if(newer(inc,d)){replaced++;return{...inc,photos:d.photos||inc.photos||[]}}
              skipped++;return d;
            });
            const added=data.deals.filter(d=>!byId.has(d.id));
            const haveInvName=new Set((p.investors||[]).map(i=>(i.name||'').toLowerCase()));
            const newInvs=(data.investors||[]).filter(i=>!haveInvName.has((i.name||'').toLowerCase()));
            setTimeout(()=>alert('Import complete.\n\n'+added.length+' new deal(s) added.\n'
              +replaced+' existing deal(s) updated from the file.\n'
              +skipped+' left alone (your copy was newer).\n\nNo duplicates were created.'),0);
            return{...p,deals:[...merged,...added],investors:[...(p.investors||[]),...newInvs]};
          });
        }catch(err){alert('Could not read file: '+err.message)}
      };
      reader.readAsText(file);
    },[]),
  }
}

// Address comes first because the HouseCanary fetch needs it and autofills Property Basics.

function TabFDIF({D}){
  const{fdif}=D.deal;
  const warn=fdif.yearBuilt&&parseInt(fdif.yearBuilt)<1980;
  const unpermitted=fdif.unpermittedWork&&fdif.unpermittedWork.toLowerCase()!=='no'&&fdif.unpermittedWork.toLowerCase()!=='none'&&fdif.unpermittedWork!=='';

  // ─── HouseCanary autofill (Phase 2 integration) ───────────────────────
  const[hcFetching,setHcFetching]=useState(false);
  const[hcAddrPopup,setHcAddrPopup]=useState(false);     // {address, zipcode} when open, false when closed
  const[hcDiff,setHcDiff]=useState(null);                // {fields:[{key,label,current,proposed,target,keep}], summary} when modal open
  const[hcToast,setHcToast]=useState('');                // brief success/info banner

  // Parse "123 Main St, City, CA 92019, USA" into {address, zipcode}.
  // HouseCanary accepts a full street+city+state in `address` as long as `zipcode` is correct.
  function parseAddr(full){
    if(!full)return{address:'',zipcode:null};
    // Find a 5-digit ZIP near the end (allow trailing ", USA" or whitespace).
    const m=full.match(/(\d{5})(?:-\d{4})?(?=[\s,]*(?:USA|US|United States)?\s*$)/i);
    if(m){
      const addr=full.slice(0,m.index).replace(/,\s*$/,'').trim();
      return{address:addr||full.trim(),zipcode:m[1]};
    }
    // Fallback: any 5-digit run; take the last.
    const all=full.match(/\b\d{5}\b/g);
    if(all){
      const zip=all[all.length-1];
      const idx=full.lastIndexOf(zip);
      return{address:full.slice(0,idx).replace(/,\s*$/,'').trim()||full.trim(),zipcode:zip};
    }
    return{address:full.trim(),zipcode:null};
  }

  // Format HC `details` and `value` responses into a list of proposed updates.
  // Each item: {key, label, target ('fdif'|'qo'), proposed, current}.
  function buildProposed(hcResults){
    const out=[];
    const det=hcResults?.details?.ok?(hcResults.details.data?.[0]?.['property/details']?.result?.property)||null:null;
    const val=hcResults?.value?.ok?(hcResults.value.data?.[0]?.['property/value']?.result?.value)||null:null;

    if(det){
      // beds / baths
      const beds=det.number_of_bedrooms;
      const fb=det.full_bath_count;
      const pb=det.partial_bath_count;
      if(beds!=null||fb!=null){
        const bathStr=fb!=null?(pb?`${fb}.${pb>=5?5:pb}`:String(fb)):'';
        const proposed=beds!=null&&bathStr?`${beds}/${bathStr}`:(beds!=null?`${beds}/`:'');
        if(proposed)out.push({key:'bedsBaths',label:'Bed/Bath',target:'fdif',proposed,current:fdif.bedsBaths||''});
      }
      if(det.building_area_sq_ft!=null){
        out.push({key:'sqft',label:'Square Footage',target:'fdif',proposed:String(det.building_area_sq_ft),current:fdif.sqft||''});
      }
      if(det.year_built!=null){
        out.push({key:'yearBuilt',label:'Year Built',target:'fdif',proposed:String(det.year_built),current:fdif.yearBuilt||''});
      }
      if(det.site_area_acres!=null){
        // HC reports lot in acres; convert to sq ft for the FDIF lotSize field
        const sqft=Math.round(det.site_area_acres*43560);
        out.push({key:'lotSize',label:'Lot Size',target:'fdif',proposed:`${sqft.toLocaleString()} sqft`,current:fdif.lotSize||''});
      }
      if(typeof det.pool==='boolean'){
        const proposed=det.pool?'Yes — confirm pump/filter/heater age with seller':'No';
        out.push({key:'poolDetails',label:'Pool',target:'fdif',proposed,current:fdif.poolDetails||''});
      }
    }

    if(val&&val.price_mean!=null){
      out.push({key:'houseCanaryAVM',label:'House Canary AVM',target:'qo',proposed:String(val.price_mean),current:D.deal.quickOffer.houseCanaryAVM||''});
    }

    return{items:out,valueMeta:val?{mean:val.price_mean,lwr:val.price_lwr,upr:val.price_upr,fsd:val.fsd}:null};
  }

  // Apply a list of {key,target,proposed} updates to the deal.
  function applyUpdates(items){
    for(const it of items){
      if(it.target==='fdif')D.updateFDIF(it.key,it.proposed);
      else if(it.target==='qo')D.updateQO(it.key,it.proposed);
    }
    D.updateFDIF('hcFetched',true);
    D.updateFDIF('hcLastFetchAt',new Date().toISOString());
  }

  // Format the success-toast summary line.
  function summaryLine(items,valueMeta){
    const bedsItem=items.find(i=>i.key==='bedsBaths');
    const sqftItem=items.find(i=>i.key==='sqft');
    const parts=[];
    if(bedsItem)parts.push(bedsItem.proposed);
    if(sqftItem)parts.push(`${parseInt(sqftItem.proposed).toLocaleString()} sqft`);
    if(valueMeta&&valueMeta.mean)parts.push(`AVM $${Math.round(valueMeta.mean).toLocaleString()}`);
    return parts.length?`Property data loaded: ${parts.join(', ')}`:'Property data loaded';
  }

  // Main entry: called when user clicks the big button or submits the address popup.
  async function fetchHC(addressOverride,zipOverride){
    const sourceAddr=addressOverride!=null?addressOverride:fdif.address;
    if(!sourceAddr||!sourceAddr.trim()){
      setHcAddrPopup({address:'',zipcode:''});
      return;
    }
    let{address,zipcode}=parseAddr(sourceAddr);
    if(zipOverride)zipcode=zipOverride;
    if(!zipcode){
      setHcAddrPopup({address:sourceAddr,zipcode:''});
      return;
    }
    setHcFetching(true);
    setHcToast('');
    try{
      const resp=await fetch('/.netlify/functions/api-proxy',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({target:'housecanary',action:'property_data',data:{address,zipcode}}),
      });
      const raw=await resp.text();
      let json;
      try{json=JSON.parse(raw)}
      catch{
        if(resp.status===404||/^\s*<(!doctype|html)/i.test(raw)){
          alert('The API proxy function is not deployed.\n\n/.netlify/functions/api-proxy returned a web page instead of JSON (HTTP '+resp.status+').\n\nYour Netlify deploy folder must contain netlify.toml and netlify/functions/api-proxy.js. Re-deploy with those included.');
        }else{
          alert('HouseCanary fetch failed: server returned a non-JSON response (HTTP '+resp.status+').\n\nFirst 200 characters:\n'+raw.slice(0,200));
        }
        setHcFetching(false);
        return;
      }
      if(!resp.ok||!json.ok){
        alert('HouseCanary fetch failed: '+(json.error||resp.statusText||'unknown error'));
        setHcFetching(false);
        return;
      }
      // If the user typed the address into the popup (override flow), commit it back to the FDIF.
      if(addressOverride&&addressOverride!==fdif.address)D.updateFDIF('address',addressOverride);

      const{items,valueMeta}=buildProposed(json.results);
      if(items.length===0){
        alert('HouseCanary returned no usable property data for this address.');
        setHcFetching(false);
        return;
      }
      // Partition: empty/identical (auto-apply) vs conflict (need user decision).
      const auto=[],conflicts=[];
      for(const it of items){
        const cur=(it.current||'').toString().trim();
        const prop=(it.proposed||'').toString().trim();
        if(!cur)auto.push(it);
        else if(cur===prop){/* identical — skip silently */}
        else conflicts.push(it);
      }
      if(conflicts.length===0){
        applyUpdates(auto);
        setHcToast(summaryLine(items,valueMeta));
        setTimeout(()=>setHcToast(''),6000);
      }else{
        // Open diff modal. Pre-apply non-conflicting fields so user only decides on conflicts.
        applyUpdates(auto);
        setHcDiff({
          fields:conflicts.map(it=>({...it,keep:'proposed'})), // default: take HC's value
          autoCount:auto.length,
          valueMeta,
          allItems:items,
        });
      }
    }catch(e){
      console.error('HC fetch error:',e);
      alert('HouseCanary fetch failed: '+e.message);
    }finally{
      setHcFetching(false);
    }
  }

  // Confirm the diff modal: apply the user's choices.
  function confirmDiff(){
    if(!hcDiff)return;
    const toApply=hcDiff.fields.filter(f=>f.keep==='proposed');
    applyUpdates(toApply);
    setHcToast(summaryLine(hcDiff.allItems,hcDiff.valueMeta));
    setTimeout(()=>setHcToast(''),6000);
    setHcDiff(null);
  }

  // ──────────────────────────────────────────────────────────────────────

  // Progress tracking
  const mandFilled=MAND_FIELDS.filter(k=>fdif[k]&&fdif[k].toString().trim()!=='').length;
  const reqFilled=REQ_FIELDS.filter(k=>fdif[k]&&fdif[k].toString().trim()!=='').length;
  const mandTotal=MAND_FIELDS.length;
  const reqTotal=REQ_FIELDS.length;
  const[collapsed,setCollapsed]=useState({});
  // Photos are "covered" once the seller has committed to sending them, or they
  // have arrived. Until then condition has to come out verbally.
  const havePhotos=!!(fdif.photosReceived||(fdif.photosNeeded&&fdif.photosPromised)||fdif.photosOnlineOk);
  // Verified online photos mean we can see the interior ourselves, so that
  // section collapses instead of walking the seller through a room tour.
  // Still expandable: ages and what is broken do not show up in a photo.
  const isCollapsed=sec=>(sec.photoLight&&fdif.photosOnlineOk&&collapsed[sec.s]===undefined)?true:!!collapsed[sec.s];
  const hasAddr=!!(fdif.address&&fdif.address.trim());

  const knownMarkets=useMemo(()=>Array.from(new Set(
    (D.deals||[]).map(d=>(d.fdif&&d.fdif.marketArea||'').trim()).filter(Boolean)
  )).sort(),[D.deals]);

    <div className="f ac jb mb4">

        <div style={{fontSize:'.78rem',color:'var(--text-sec)',marginTop:2}}>DIS fills this out during the first call with the seller</div>
      </div>
      {/* HC autofill button — large, red until used, green after success. */}
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',marginRight:24}}>
        <button
          type="button"
          onClick={()=>fetchHC()}
          disabled={hcFetching||!hasAddr}

          {hcFetching?'⏳ Fetching…':(!hasAddr?'⚡ Fetch Property Data':(fdif.hcFetched?'✓ Property Data Loaded':'⚡ Fetch Property Data'))}
        </button>
        {!hasAddr&&<div style={{fontSize:'.68rem',color:'var(--text-sec)',marginTop:4,textAlign:'center',maxWidth:180}}>Enter Property Address to enable</div>}
      </div>
      <div>
        <div style={{textAlign:'right'}}>
          <div style={{fontSize:'.72rem',textTransform:'uppercase',letterSpacing:'.04em',color:mandDone?'var(--green)':'var(--amber)',fontWeight:600}}>
            {mandDone?'READY FOR EVAL':'MANDATORY FIELDS INCOMPLETE'}
          </div>
          <div style={{fontSize:'.78rem',color:'var(--text-sec)'}}>
            <span className="mono">{mandFilled}/{mandTotal}</span> mandatory &nbsp;·&nbsp; <span className="mono">{reqFilled}/{reqTotal}</span> recommended
          </div>
          <div style={{fontSize:'.75rem',fontWeight:600,marginTop:3,color:callBooked?'var(--green)':'var(--red)'}}>

          </div>}
        </div>
      </div>
    </div>

    {/* HC success toast */}
    {hcToast&&<div style={{padding:'10px 14px',marginBottom:12,background:'var(--green-bg)',border:'1px solid var(--green-border)',borderRadius:'var(--r)',fontSize:'.85rem',color:'var(--green)',fontWeight:500}}>
      ✓ {hcToast}
    </div>}

    {/* Legend */}
    <div style={{display:'flex',gap:16,marginBottom:16,fontSize:'.75rem',color:'var(--text-sec)'}}>
      <span><span style={{display:'inline-block',width:10,height:10,background:'#FFFF00',border:'1px solid #ccc',borderRadius:2,marginRight:4,verticalAlign:'middle'}}></span> Mandatory (must fill before eval)</span>
      <span><span style={{display:'inline-block',width:10,height:10,background:'var(--green-bg)',border:'1px solid var(--green-border)',borderRadius:2,marginRight:4,verticalAlign:'middle'}}></span> Recommended</span>
      <span><span style={{display:'inline-block',width:10,height:10,background:'#FFE0B2',border:'1px solid #FFCC80',borderRadius:2,marginRight:4,verticalAlign:'middle'}}></span> Flag item</span>

    <div style={{marginBottom:14,padding:'12px 14px',background:'var(--bg-white)',border:'1px solid var(--border)',borderRadius:'var(--r-lg)'}}>
      <div style={{fontSize:'.65rem',textTransform:'uppercase',letterSpacing:'.08em',fontWeight:700,color:'var(--text-sec)',marginBottom:8}}>How this call runs</div>
      <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
        {PHASES.map((p,i)=>{
          const secs=FDIF_SECTIONS.filter(s=>s.phase===p.k);

            background:pct===100?'var(--green-bg)':'var(--bg)',border:'1px solid '+(pct===100?'var(--green)':'var(--border)')}}>
            <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:3}}>
              <span style={{fontSize:'.58rem',fontWeight:800,letterSpacing:'.06em',padding:'1px 6px',borderRadius:99,background:PHASE_COLOR[p.k],color:'#fff'}}>{i+1}</span>
              <span style={{fontSize:'.78rem',fontWeight:700}}>{p.t}</span>
              {pct===100&&<span style={{color:'var(--green)',fontWeight:700}}>✓</span>}
            </div>
            <div style={{fontSize:'.68rem',color:'var(--text-sec)',lineHeight:1.4}}>{p.d}</div>
          </div>;
        })}
      </div>
    </div>

        <button className="btn btn-sm btn-s" style={{fontSize:'.68rem',padding:'2px 8px'}}
          onClick={()=>setCollapsed(c=>Object.keys(c).length?{}:Object.fromEntries(FDIF_SECTIONS.map(s=>[s.s,true])))}>

        </button>
      </div>
      <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
        {FDIF_SECTIONS.map(sec=>{
          const tot=sec.fields.length;
          const done=sec.fields.filter(f=>fdif[f.k]&&fdif[f.k].toString().trim()!=='').length;
          const full=done===tot, none=done===0;
          return <button key={sec.s} onClick={()=>{
            setCollapsed(c=>{const n={...c};delete n[sec.s];return n});
            const el=document.getElementById('sec-'+sec.s.replace(/\W+/g,'-'));
            if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
          }} title={done+' of '+tot+' answered'}
          style={{padding:'3px 9px',borderRadius:99,fontSize:'.7rem',fontWeight:600,cursor:'pointer',
            border:'1px solid '+(full?'var(--green)':none?'var(--border)':'var(--accent)'),
            background:full?'var(--green-bg)':none?'var(--bg-white)':'#EEF4FF',
            color:full?'var(--green)':none?'var(--text-sec)':'var(--accent)'}}>
            {sec.s.replace(/^Interior Details — /,'')} <span className="mono" style={{opacity:.75}}>{done}/{tot}</span>
          </button>;
        })}
      </div>
    </div>

    {FDIF_SECTIONS.map(sec=><React.Fragment key={sec.s}>
    {sec.photoLight&&<>
      {/* ── PHOTO REQUEST: ask while still on the call, before the pre-offer booking ── */}
      <div style={{
        border:'3px solid '+(!fdif.photosNeeded?'var(--border)':(fdif.photosPromised?'var(--green)':'#E8A317')),
        background:!fdif.photosNeeded?'var(--bg-white)':(fdif.photosPromised?'var(--green-bg)':'#FFF8E7'),
        borderRadius:'var(--r-lg)',padding:'20px 24px',marginBottom:16,boxShadow:'var(--shadow)',
      }}>
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:20,flexWrap:'wrap'}}>
          <div style={{flex:'1 1 340px',minWidth:260}}>
            <div style={{fontSize:'.72rem',textTransform:'uppercase',letterSpacing:'.06em',fontWeight:700,
              color:!fdif.photosNeeded?'var(--text-sec)':(fdif.photosPromised?'var(--green)':'#9E6B00'),marginBottom:4}}>
              {!fdif.photosNeeded?'Check before you move on':(fdif.photosPromised?'\u2713 Photos requested':'\u26a0\ufe0f Photos still need requesting')}
            </div>
            <div style={{fontSize:'1.05rem',fontWeight:700,marginBottom:6}}>Do we have usable photos?</div>
            <div style={{fontSize:'.85rem',color:'var(--text-sec)',lineHeight:1.5}}>
              Check the Zillow link above. If there are no photos, they are years old, or they do not show current condition, ask the seller to <strong>text them to you</strong> now, while you still have them on the phone. Texting is fastest and they can do it from the phone they are already holding.
            </div>
          </div>
          <label style={{display:'flex',alignItems:'center',gap:8,fontSize:'.9rem',fontWeight:600,cursor:'pointer',flex:'0 0 auto'}}>
            <input type="checkbox" checked={!!fdif.photosNeeded}
              onChange={e=>{D.updateFDIF('photosNeeded',e.target.checked);if(e.target.checked)D.updateFDIF('photosOnlineOk',false)}}
              style={{width:18,height:18,cursor:'pointer'}}/>
            We need photos from the seller
          </label>
        </div>
        {!fdif.photosNeeded&&<label style={{display:'flex',alignItems:'center',gap:8,fontSize:'.85rem',fontWeight:600,cursor:'pointer',marginTop:12,paddingTop:12,borderTop:'1px solid var(--border)'}}>
          <input type="checkbox" checked={!!fdif.photosOnlineOk}
            onChange={e=>D.updateFDIF('photosOnlineOk',e.target.checked)}

          The online photos are current and show the real condition

        </label>}

        {fdif.photosNeeded&&<div style={{marginTop:16,paddingTop:14,borderTop:'1px solid '+(fdif.photosPromised?'var(--green-border)':'#F0DCA8')}}>
          <div style={{padding:'8px 12px',marginBottom:14,background:'#FFFDE7',borderRadius:'var(--r-sm)',fontSize:'.88rem',color:'#5D4037',borderLeft:'3px solid #FFD600'}}>
            <span style={{fontSize:'.62rem',textTransform:'uppercase',letterSpacing:'.07em',fontWeight:700,color:'#9E7B00',display:'block',marginBottom:2}}>Say this to ask for photos</span>

          </div>
          <div style={{fontSize:'.8rem',fontWeight:700,marginBottom:8}}>How is the seller sending them?</div>

              <label key={opt} style={{display:'flex',alignItems:'center',gap:6,fontSize:'.85rem',cursor:'pointer',

          </div>

              style={{background:fdif.photosNote?'var(--bg-white)':'#FFFF00'}}/>
          </div>
          <label style={{display:'flex',alignItems:'center',gap:8,fontSize:'.88rem',fontWeight:600,cursor:'pointer'}}>
            <input type="checkbox" checked={!!fdif.photosReceived}
              onChange={e=>D.updateFDIF('photosReceived',e.target.checked)}
              style={{width:18,height:18,cursor:'pointer',accentColor:'var(--green)'}}/>
            Photos received (tick once they actually arrive)
          </label>
        </div>}
      </div>
    </>}
    <div id={'sec-'+sec.s.replace(/\W+/g,'-')} className="card mb4">
      <div className="card-h" onClick={()=>setCollapsed(c=>({...c,[sec.s]:!c[sec.s]}))}
        style={{background:'var(--accent-bg)',color:'var(--accent)',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'space-between',gap:10}}>
        <span style={{display:'flex',alignItems:'center',gap:10}}>
          <span>{isCollapsed(sec)?'▸':'▾'} {sec.s}</span>

        </span>

      <div className="card-b" style={{display:isCollapsed(sec)?'none':'block'}}>
        {/* Presenter note: why this section exists. Gray box, not read aloud. */}
        {sec.purpose&&<div style={{padding:'8px 12px',marginBottom:10,background:'#F4F5F7',borderRadius:'var(--r-sm)',
          fontSize:'.8rem',color:'#4A4A4A',borderLeft:'3px solid #B0B4BA',lineHeight:1.5}}>
          <span style={{fontSize:'.6rem',textTransform:'uppercase',letterSpacing:'.07em',fontWeight:700,color:'#6B7076',display:'block',marginBottom:2}}>Note to me, do not read aloud</span>
          {sec.purpose}
        </div>}

        {/* SAY box: the transition line, read aloud. */}
        {sec.leadin&&<div style={{padding:'8px 12px',marginBottom:10,background:'#FFFDE7',borderRadius:'var(--r-sm)',fontSize:'.88rem',color:'#5D4037',borderLeft:'3px solid #FFD600'}}>

          <span style={{fontStyle:'italic'}}>"{sec.leadin}"</span>

        {/* What I am listening for. */}
        {sec.listen&&<div style={{padding:'8px 12px',marginBottom:12,background:'#EEF4FF',borderRadius:'var(--r-sm)',
          fontSize:'.8rem',color:'#2C3E63',borderLeft:'3px solid var(--accent)',lineHeight:1.5}}>

        </div>}
        {sec.s==='Final Price Conversation'&&(fdif.sellerMotivation||fdif.idealCloseDate||fdif.speedVsPrice||fdif.situationFlags)&&
          <div style={{padding:'10px 12px',marginBottom:12,background:'#EEF4FF',border:'1px solid var(--accent)',borderRadius:'var(--r-sm)',fontSize:'.8rem'}}>
            <span style={{fontSize:'.62rem',textTransform:'uppercase',letterSpacing:'.07em',fontWeight:700,color:'var(--accent)',display:'block',marginBottom:4}}>What they told you earlier — use their words</span>
            {fdif.sellerMotivation&&<div><strong>Matters most:</strong> {fdif.sellerMotivation}</div>}
            {fdif.speedVsPrice&&<div><strong>Speed vs price:</strong> {fdif.speedVsPrice}</div>}
            {fdif.idealCloseDate&&<div><strong>Ideal closing:</strong> {fdif.idealCloseDate}</div>}
