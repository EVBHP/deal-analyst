          <span style={{fontSize:'.6rem',textTransform:'uppercase',letterSpacing:'.07em',fontWeight:700,color:'var(--green)',display:'block',marginBottom:2}}>Photos are covering the finishes</span>
          {fdif.photosOnlineOk
            ?'The online photos are verified current, so I can see the interior myself. This section is collapsed by default. Open it only if I need an age or a repair history that a photo cannot show me.'
            :'Finish questions are hidden because photos are '+(fdif.photosReceived?'in hand':'on the way')+'. Skip the room tour and keep to what a photo cannot tell me: ages, what has been replaced, and what is broken.'}
        </div>}
        {sec.photoLight&&!havePhotos&&<div className="warn-box" style={{marginBottom:12,fontSize:'.8rem'}}>
          No photos yet, so I have to get condition verbally. Tick the photo request at the bottom of this form if the online photos are missing or out of date, and these finish questions will drop away.
        </div>}
        {sec.fields.map(f=>{
          if(f.photoCovered&&havePhotos)return null;
          const isMand=f.mand;
          const isReq=f.req;
          const isFlag=!!f.flag;
          const filled=fdif[f.k]&&fdif[f.k].toString().trim()!=='';
          // A label ending in "?" is a question to ask out loud. Anything else
          // ("Contact Name", "Year Built") is a value to record, not a script line.
          const isSpoken=/\?\s*$/.test(f.l);
          const labelStyle={display:'flex',alignItems:'center',gap:6,marginBottom:4};
          const rowBg=isMand&&!filled?'#FFFFF0':isFlag?'#FFF8F0':'transparent';

          return <div key={f.k} style={{padding:'8px 10px',marginBottom:2,borderRadius:'var(--r-sm)',background:rowBg,borderLeft:isMand?'3px solid #FFD600':isReq?'3px solid var(--green-border)':'3px solid transparent'}}>
            <div style={labelStyle}>
              <label style={{display:'block',fontSize:isSpoken?'.92rem':'.78rem',fontWeight:isSpoken?600:500,color:isSpoken?'var(--text)':'var(--text-sec)',marginBottom:0,textTransform:isSpoken?'none':'uppercase',letterSpacing:isSpoken?'normal':'.04em',flex:1}}>
                {f.l}
                {isMand&&<span style={{marginLeft:6,fontSize:'.68rem',padding:'1px 5px',borderRadius:3,background:'#FFD600',color:'#333',fontWeight:700}}>REQUIRED</span>}
              </label>
              {filled&&<span style={{color:'var(--green)',fontSize:'.75rem',fontWeight:600}}>✓</span>}
            </div>
            {f.hint&&<div style={{fontSize:'.72rem',color:'var(--text-muted)',marginBottom:4}}>{f.hint}</div>}
            {f.opts
              ?<select className="inp" value={fdif[f.k]||''} onChange={e=>D.updateFDIF(f.k,e.target.value)} style={{maxWidth:400}}>
                <option value="">Select...</option>{f.opts.map(o=><option key={o}>{o}</option>)}
              </select>
              :f.datalist
              ?<><input className="inp" list={'dl-'+f.k} value={fdif[f.k]||''} onChange={e=>D.updateFDIF(f.k,e.target.value)} placeholder="Type or pick an existing market" style={{maxWidth:400,background:filled?'var(--green-bg)':'var(--bg-white)'}}/>
                <datalist id={'dl-'+f.k}>{knownMarkets.map(m=><option key={m} value={m}/>)}</datalist></>
              :<AutoTextarea className="inp" value={fdif[f.k]||''} onChange={e=>D.updateFDIF(f.k,e.target.value)}
                 style={{background:filled?'var(--green-bg)':'var(--bg-white)'}}/>
            }
            {/* Zillow link row — auto-generated + override */}
            {f.zillow&&fdif.address&&(()=>{
              const addr=fdif.address.trim();
              const autoUrl='https://www.zillow.com/homes/'+encodeURIComponent(addr.replace(/\s+/g,'-'))+'_rb/';
              const finalUrl=fdif.zillowUrl&&fdif.zillowUrl.trim()?fdif.zillowUrl.trim():autoUrl;
              return <div style={{marginTop:6,display:'flex',alignItems:'center',gap:8}}>
                <a href={finalUrl} target="_blank" rel="noopener noreferrer" style={{display:'inline-flex',alignItems:'center',gap:4,fontSize:'.78rem',color:'var(--accent)',textDecoration:'none',fontWeight:500}}>
                  <span style={{fontSize:'1rem'}}>🔗</span> {fdif.zillowUrl?'View Zillow Listing':'Search Zillow for this address'}
                </a>
                {!fdif.zillowUrl&&<span style={{fontSize:'.7rem',color:'var(--text-muted)'}}>(auto-generated)</span>}
              </div>
            })()}
            {f.fu&&<div style={{marginTop:6,paddingLeft:10,borderLeft:'2px solid #FFD600'}}>
              <span style={{fontSize:'.6rem',textTransform:'uppercase',letterSpacing:'.06em',fontWeight:700,color:'#9E7B00',display:'block',marginBottom:3}}>
                {filled?'Did I ask a second question?':'If the answer is short, ask'}
              </span>
              {f.fu.map((q,qi)=><div key={qi} style={{fontSize:'.8rem',color:'#5D4037',fontStyle:'italic',lineHeight:1.5}}>"{q}"</div>)}
            </div>}
            {f.must&&<div style={{marginTop:6,fontSize:'.72rem',color:'var(--accent)',fontWeight:600,lineHeight:1.45}}>
              {f.must}
            </div>}
            {f.obj&&<details style={{marginTop:8}}>
              <summary style={{cursor:'pointer',fontSize:'.68rem',textTransform:'uppercase',letterSpacing:'.06em',
                fontWeight:700,color:'#A33A4A',listStyle:'none',userSelect:'none'}}>
                If they push back ({f.obj.length})
              </summary>
              <div style={{marginTop:6,padding:'10px 12px',background:'#FDF0F2',border:'1px solid #E8C4CC',
                borderLeft:'3px solid #A33A4A',borderRadius:'var(--r-sm)'}}>
                {f.obj.map((x,oi)=><div key={oi} style={{marginBottom:oi===f.obj.length-1?0:10}}>
                  <div style={{fontSize:'.78rem',fontWeight:700,color:'#A33A4A',marginBottom:3}}>
                    They say: "{x.o}"
                  </div>
                  <div style={{fontSize:'.83rem',color:'#4A2C33',fontStyle:'italic',lineHeight:1.5,paddingLeft:10,borderLeft:'2px solid #E8C4CC'}}>
                    "{x.r}"
                  </div>
                </div>)}
              </div>
            </details>}
            {f.flag&&fdif[f.k]&&fdif[f.k].toLowerCase()!=='no'&&fdif[f.k].toLowerCase()!=='none'&&<div style={{marginTop:4,padding:'4px 8px',background:'#FFE0B2',borderRadius:'var(--r-sm)',fontSize:'.75rem',color:'#CC6600',fontWeight:500}}>⚠️ {f.flag}</div>}
          </div>
        })}
        {sec.s==='Property Basics'&&warn&&<div className="warn-box mt2" style={{marginLeft:10,marginRight:10}}>⚠️ PRE-1980: Confirm asbestos (popcorn ceiling, floor tiles, duct wrap, pipe insulation) & lead paint status on discovery call</div>}
        {/* GET THE YES: agreement checkpoint before moving on. */}
        {sec.yes&&<div style={{margin:'14px 10px 2px',padding:'10px 12px',background:'var(--green-bg)',
          border:'1px solid var(--green)',borderRadius:'var(--r-sm)',display:'flex',alignItems:'flex-start',gap:10}}>
          <input type="checkbox" checked={!!(fdif.yesChecks&&fdif.yesChecks[sec.s])}
            onChange={e=>D.updateFDIF('yesChecks',{...(fdif.yesChecks||{}),[sec.s]:e.target.checked})}
            style={{width:17,height:17,marginTop:1,cursor:'pointer',accentColor:'var(--green)',flex:'0 0 auto'}}/>
          <div>
            <span style={{fontSize:'.6rem',textTransform:'uppercase',letterSpacing:'.07em',fontWeight:800,color:'var(--green)',display:'block',marginBottom:2}}>Get the yes before moving on</span>
            <span style={{fontSize:'.85rem',fontWeight:600}}>{sec.yes}</span>
          </div>
        </div>}
      </div>
    </div>
    </React.Fragment>)}

    {/* ── PRE-OFFER CALL: booked by the DIS while still on the phone with the seller ── */}
    <div style={{
      border:'3px solid '+(callBooked?'var(--green)':'var(--red)'),
      background:callBooked?'var(--green-bg)':'#FFF4F4',
      borderRadius:'var(--r-lg)',
      padding:'20px 24px',
      marginBottom:16,
      boxShadow:'var(--shadow)',
    }}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:20,flexWrap:'wrap'}}>
        <div style={{flex:'1 1 340px',minWidth:260}}>
          <div style={{fontSize:'.72rem',textTransform:'uppercase',letterSpacing:'.06em',fontWeight:700,color:callBooked?'var(--green)':'var(--red)',marginBottom:4}}>
            {callBooked?'✓ Pre-Offer Call Scheduled':'⚠️ Required Before You End This Call'}
          </div>
          <div style={{fontSize:'1.05rem',fontWeight:700,marginBottom:6}}>Schedule the Pre-Offer Call</div>
          <div style={{fontSize:'.85rem',color:'var(--text-sec)',lineHeight:1.5}}>
            Open the scheduler and book the time yourself while the seller is still on the phone. Do not send them the link and hope they book it.
          </div>
        </div>
        <div style={{display:'flex',flexDirection:'column',alignItems:'stretch',gap:8,flex:'0 0 auto'}}>
          <a href="https://calendly.com/tphp/pre-offer-call" target="_blank" rel="noopener noreferrer"
            style={{
              display:'inline-block',padding:'16px 28px',borderRadius:'var(--r)',
              fontWeight:700,fontSize:'1rem',textAlign:'center',textDecoration:'none',
              color:'#fff',background:callBooked?'var(--green)':'var(--red)',
              border:'2px solid '+(callBooked?'var(--green)':'var(--red)'),
              boxShadow:'var(--shadow)',whiteSpace:'nowrap',
            }}>
            📅 Open Scheduler
          </a>
          <div style={{fontSize:'.68rem',color:'var(--text-sec)',textAlign:'center'}}>Opens in a new tab</div>
        </div>
      </div>

      <div style={{marginTop:16,paddingTop:14,borderTop:'1px solid '+(callBooked?'var(--green-border)':'#F5C6C6'),display:'flex',alignItems:'center',gap:16,flexWrap:'wrap'}}>
        <label style={{display:'flex',alignItems:'center',gap:8,fontSize:'.9rem',fontWeight:600,cursor:'pointer'}}>
          <input type="checkbox" checked={callBooked}
            onChange={e=>D.updateFDIF('preOfferCallBooked',e.target.checked)}
            style={{width:18,height:18,cursor:'pointer',accentColor:'var(--green)'}}/>
          Call is booked and confirmed with the seller
        </label>
        <div style={{display:'flex',alignItems:'center',gap:8,flex:'1 1 240px'}}>
          <span style={{fontSize:'.8rem',color:'var(--text-sec)',whiteSpace:'nowrap'}}>Date / time booked:</span>
          <input value={fdif.preOfferCallTime||''}
            onChange={e=>D.updateFDIF('preOfferCallTime',e.target.value)}
            placeholder="e.g. Thu Sep 4, 2:00 PM MST"
            className="inp" style={{flex:1,minWidth:160,background:callBooked||fdif.preOfferCallTime?'#fff':'#FFFF00'}}/>
        </div>
      </div>
    </div>

    {/* Bottom instruction */}
    <div style={{textAlign:'center',padding:'16px',fontSize:'.85rem',color:'var(--text-sec)',fontWeight:500}}>
      Fill out all mandatory fields → Switch to remaining tabs to complete the Deal Evaluation
    </div>

    {/* HC address prompt popup (when address field is empty or ZIP can't be parsed) */}
    {hcAddrPopup&&<div onClick={()=>setHcAddrPopup(false)} style={{position:'fixed',inset:0,background:'rgba(15,23,42,.45)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
      <div onClick={e=>e.stopPropagation()} style={{background:'#fff',borderRadius:'var(--r-lg)',padding:24,maxWidth:480,width:'100%',boxShadow:'var(--shadow-md)'}}>
        <h3 style={{fontSize:'1.05rem',fontWeight:700,marginBottom:6}}>Property address required</h3>
        <div style={{fontSize:'.85rem',color:'var(--text-sec)',marginBottom:16}}>
          {hcAddrPopup.address?'We need the ZIP code to look this up on HouseCanary.':'Enter the property address to fetch data from HouseCanary.'}
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:16}}>
          <div>
            <label style={{display:'block',fontSize:'.78rem',fontWeight:600,color:'var(--text-sec)',marginBottom:4}}>Address</label>
            <input className="inp" autoFocus={!hcAddrPopup.address} value={hcAddrPopup.address} onChange={e=>setHcAddrPopup({...hcAddrPopup,address:e.target.value})} placeholder="123 Main St, City, CA 92019"/>
          </div>
          <div>
            <label style={{display:'block',fontSize:'.78rem',fontWeight:600,color:'var(--text-sec)',marginBottom:4}}>ZIP code</label>
            <input className="inp" autoFocus={!!hcAddrPopup.address} value={hcAddrPopup.zipcode} onChange={e=>setHcAddrPopup({...hcAddrPopup,zipcode:e.target.value.replace(/\D/g,'').slice(0,5)})} placeholder="92019" maxLength={5} style={{maxWidth:120}}/>
          </div>
        </div>
        <div style={{display:'flex',justifyContent:'flex-end',gap:8}}>
          <button type="button" className="btn btn-s" onClick={()=>setHcAddrPopup(false)}>Cancel</button>
          <button type="button" className="btn btn-p" disabled={!hcAddrPopup.address.trim()||hcAddrPopup.zipcode.length!==5}
            onClick={()=>{const a=hcAddrPopup.address.trim();const z=hcAddrPopup.zipcode;setHcAddrPopup(false);fetchHC(a,z)}}>
            Fetch
          </button>
        </div>
      </div>
    </div>}

    {/* HC diff modal — shown when HC values conflict with already-entered fields */}
    {hcDiff&&<div onClick={()=>setHcDiff(null)} style={{position:'fixed',inset:0,background:'rgba(15,23,42,.5)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
      <div onClick={e=>e.stopPropagation()} style={{background:'#fff',borderRadius:'var(--r-lg)',padding:24,maxWidth:720,width:'100%',maxHeight:'85vh',overflow:'auto',boxShadow:'var(--shadow-md)'}}>
        <h3 style={{fontSize:'1.1rem',fontWeight:700,marginBottom:6}}>Review HouseCanary updates</h3>
        <div style={{fontSize:'.85rem',color:'var(--text-sec)',marginBottom:16}}>
          {hcDiff.autoCount>0&&<span><strong>{hcDiff.autoCount}</strong> empty field{hcDiff.autoCount===1?'':'s'} {hcDiff.autoCount===1?'was':'were'} filled automatically. </span>}
          The fields below have existing values that differ — pick which to keep for each.
        </div>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:'.85rem',marginBottom:16}}>
          <thead>
            <tr style={{borderBottom:'2px solid var(--border)',textAlign:'left'}}>
              <th style={{padding:'8px 6px',fontSize:'.75rem',textTransform:'uppercase',color:'var(--text-muted)',letterSpacing:'.04em'}}>Field</th>
              <th style={{padding:'8px 6px',fontSize:'.75rem',textTransform:'uppercase',color:'var(--text-muted)',letterSpacing:'.04em'}}>Current</th>
              <th style={{padding:'8px 6px',fontSize:'.75rem',textTransform:'uppercase',color:'var(--text-muted)',letterSpacing:'.04em'}}>HouseCanary</th>
              <th style={{padding:'8px 6px',fontSize:'.75rem',textTransform:'uppercase',color:'var(--text-muted)',letterSpacing:'.04em',textAlign:'center'}}>Keep</th>
            </tr>
          </thead>
          <tbody>
            {hcDiff.fields.map((f,i)=><tr key={f.key} style={{borderBottom:'1px solid var(--border-light)'}}>
              <td style={{padding:'10px 6px',fontWeight:600}}>{f.label}</td>
              <td style={{padding:'10px 6px',color:f.keep==='current'?'var(--text)':'var(--text-muted)',background:f.keep==='current'?'var(--blue-bg)':'transparent',borderRadius:'var(--r-sm)'}}>{f.current||<em style={{color:'var(--text-muted)'}}>(empty)</em>}</td>
              <td style={{padding:'10px 6px',color:f.keep==='proposed'?'var(--text)':'var(--text-muted)',background:f.keep==='proposed'?'var(--green-bg)':'transparent',borderRadius:'var(--r-sm)'}}>{f.proposed}</td>
              <td style={{padding:'10px 6px',textAlign:'center'}}>
                <div style={{display:'inline-flex',gap:4,background:'var(--bg)',borderRadius:'var(--r-sm)',padding:2}}>
                  <button type="button" onClick={()=>setHcDiff({...hcDiff,fields:hcDiff.fields.map((x,j)=>j===i?{...x,keep:'current'}:x)})} style={{padding:'4px 10px',fontSize:'.75rem',fontWeight:600,border:'none',borderRadius:'var(--r-sm)',cursor:'pointer',background:f.keep==='current'?'var(--accent)':'transparent',color:f.keep==='current'?'#fff':'var(--text-sec)'}}>Mine</button>
                  <button type="button" onClick={()=>setHcDiff({...hcDiff,fields:hcDiff.fields.map((x,j)=>j===i?{...x,keep:'proposed'}:x)})} style={{padding:'4px 10px',fontSize:'.75rem',fontWeight:600,border:'none',borderRadius:'var(--r-sm)',cursor:'pointer',background:f.keep==='proposed'?'var(--green)':'transparent',color:f.keep==='proposed'?'#fff':'var(--text-sec)'}}>HC</button>
                </div>
              </td>
            </tr>)}
          </tbody>
        </table>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}>
          <div style={{fontSize:'.78rem',color:'var(--text-muted)'}}>
            {hcDiff.fields.filter(f=>f.keep==='proposed').length} of {hcDiff.fields.length} HC values selected
          </div>
          <div style={{display:'flex',gap:8}}>
            <button type="button" className="btn btn-s" onClick={()=>setHcDiff(null)}>Cancel</button>
            <button type="button" className="btn btn-p" onClick={confirmDiff}>Apply selections</button>
          </div>
        </div>
      </div>
    </div>}

  </div>
}

/* ═══════════════════════════════════════
   TAB 2: QUICK OFFER
   ═══════════════════════════════════════ */
const STRATS=['Cash Offer | Assignment','Cash Offer | Flip','Cash Offer | List','Listing','Creative'];

function TabQuickOffer({D}){
  const{fdif,quickOffer:qo,comps}=D.deal;
  const sqft=pn(fdif.sqft);
  const avmVals=[pn(qo.zillowAVM),pn(qo.redfinAVM),pn(qo.realtorAVM),pn(qo.houseCanaryAVM),pn(qo.cmaAVM)].filter(v=>v>0);
  const avgAVM=avmVals.length?Math.round(avmVals.reduce((a,b)=>a+b,0)/avmVals.length):0;
  const asIsARV=useMemo(()=>{
    const cv=calcARV(comps.asIs.filter(c=>c.price&&c.sqft).map(c=>({price:pn(c.price),sqft:pn(c.sqft)})),sqft,(comps.adjustAsIs||100)/100);
    if(cv)return cv;return avgAVM;
  },[comps,sqft,avgAVM]);
  // Estimated reno for cash offer — priority: manual $ → QO $/SF → Full Deal Eval $/SF → Full Deal Eval scope
  // All $/SF paths use raw (sqft × $/SF) with NO contingency added — keeps numbers consistent across tabs
  const fullDealReno=useMemo(()=>{
    const psfVal=pn(D.deal.renoPSF||'');
    if(psfVal>0&&sqft) return Math.round(psfVal*sqft);
    const rc=D.deal.renoCustom||{};
    const cpct=D.deal.renoContingencyPct;
    const b=calcRenoBudget(D.deal.renoScope,rc,cpct);
    return b.subtotal||0;
  },[D.deal.renoScope,D.deal.renoCustom,D.deal.renoContingencyPct,D.deal.renoPSF,sqft]);
  // Default to the Cosmetic tier for this market when nothing is chosen yet, so
  // the Quick Offer opens on a sensible screening level rather than no reno.
  const qoDefaultPSF=useMemo(()=>{
    const t=renoTiersFor(D.marketRates,(D.deal.fdif.marketArea||'').trim()).find(x=>x.id===DEFAULT_TIER_ID);
    return t?t.psf:0;
  },[D.marketRates,D.deal.fdif.marketArea]);
  const qoPSF=pn(qo.renoPSF||'')||qoDefaultPSF;
  const qoPSFTotal=qoPSF>0&&sqft?Math.round(qoPSF*sqft):0;
  const estReno=pn(qo.estReno)||(qoPSFTotal>0?qoPSFTotal:fullDealReno);
  const renoSource=pn(qo.estReno)?'manual':qoPSFTotal>0?'qopsf':fullDealReno>0?'fulldeal':'none';
  // Follow whichever investor the deal is assigned to. Loading a profile on the
  // Underwriting tab snapshots their terms into uwDefaults, so the Quick Offer
  // reprices with them. With no investor assigned it falls back to TPHP house
  // figures, which is the normal case on a first call.
  const qoInvestor=(D.deal.investorName||'').trim();
  // Rates key off the property's market, not the header filter, because the
  // rate describes where the house is.
  const qoMarket=(D.deal.fdif.marketArea||'').trim();
  const qoTiers=useMemo(()=>renoTiersFor(D.marketRates,qoMarket),[D.marketRates,qoMarket]);
  const[rateEdit,setRateEdit]=useState(false);
  const[rateDraft,setRateDraft]=useState({});
  const activeUW=useMemo(()=>({...DEF_UW,...(D.deal.uwDefaults||{})}),[D.deal.uwDefaults]);
  const qoHold=pn(qo.holdMonths)||6;
  const offers=useMemo(()=>calcQuickOffers(asIsARV,estReno,{arv:avgAVM||asIsARV,uw:activeUW,holdMonths:qoHold}),
    [asIsARV,estReno,avgAVM,qoHold,activeUW]);

  // Build quick-link URLs from address
  const addr=fdif.address?fdif.address.trim():'';
  const addrEnc=encodeURIComponent(addr);
  const addrDash=addr.replace(/\s+/g,'-');
  const zillowLink=addr?fdif.zillowUrl||('https://www.zillow.com/homes/'+encodeURIComponent(addrDash)+'_rb/'):'';
  const redfinLink=addr?'https://www.redfin.com/search?query='+addrEnc:'';
  // Realtor.com: use Google site-search since direct realtor.com search URLs are fragile
  const realtorLink=addr?'https://www.google.com/search?q=site%3Arealtor.com+'+addrEnc:'';

  // Currency display for AVM inputs
  const fmtCurrency=(v)=>{if(!v||v==='')return'';const n=parseFloat(String(v).replace(/[,$]/g,''));return isNaN(n)?v:'$'+Math.round(n).toLocaleString()};
  const [editingField,setEditingField]=useState(null);

  // HC PDF upload
  const hcFileRef=useRef(null);
  const [hcUploading,setHcUploading]=useState(false);
  const [hcFileName,setHcFileName]=useState('');

  // CMA PDF upload
  const cmaFileRef=useRef(null);
  const [cmaUploading,setCmaUploading]=useState(false);
  const [cmaFileName,setCmaFileName]=useState('');
  const [cmaData,setCmaData]=useState(null);
  const [cmaError,setCmaError]=useState(null);

  return <div>
    <h2 style={{fontSize:'1.15rem',fontWeight:700,marginBottom:16}}>Quick Offer Calculator</h2>
    {/* Property summary bar */}
    <div className="card mb4"><div className="card-b" style={{display:'flex',gap:32,flexWrap:'wrap'}}>
      <div><span className="tmut" style={{fontSize:'.72rem',textTransform:'uppercase',letterSpacing:'.04em'}}>Address</span><br/><strong>{fdif.address||'—'}</strong></div>
      <div><span className="tmut" style={{fontSize:'.72rem',textTransform:'uppercase',letterSpacing:'.04em'}}>Bed/Bath</span><br/><strong>{fdif.bedsBaths||'—'}</strong></div>
      <div><span className="tmut" style={{fontSize:'.72rem',textTransform:'uppercase',letterSpacing:'.04em'}}>SQFT</span><br/><strong className="mono">{sqft?sqft.toLocaleString():'—'}</strong></div>
      <div><span className="tmut" style={{fontSize:'.72rem',textTransform:'uppercase',letterSpacing:'.04em'}}>Year Built</span><br/><strong>{fdif.yearBuilt||'—'}</strong></div>
    </div></div>

    <div className="grid2 mb4">
      {/* Strategy */}
      <div className="card"><div className="card-h">Strategy</div><div className="card-b">
        <select className="inp" value={qo.strategy} onChange={e=>D.updateQO('strategy',e.target.value)}>{STRATS.map(s=><option key={s}>{s}</option>)}</select>
      </div></div>

      {/* Automated Valuations */}
      <div className="card"><div className="card-h">
        <span>Automated Valuations</span>
        {avmVals.length>0&&<span className="mono" style={{fontSize:'.78rem',color:'var(--text-sec)'}}>Avg: <strong style={{color:'var(--accent)'}}>{fmt(avgAVM)}</strong> ({avmVals.length} source{avmVals.length>1?'s':''})</span>}
      </div><div className="card-b">
        {/* AVM rows: Zillow, Redfin, Realtor, House Canary */}
        {[
          {key:'zillowAVM',label:'Zillow',link:zillowLink,btnLabel:'Open Zillow'},
          {key:'redfinAVM',label:'Redfin',link:redfinLink,btnLabel:'Open Redfin'},
          {key:'realtorAVM',label:'Realtor.com',link:realtorLink,btnLabel:'Open Realtor.com'},
        ].map(avm=><div key={avm.key} className="fg" style={{marginBottom:8}}>
          <div className="f ac jb" style={{marginBottom:4}}>
            <label style={{marginBottom:0}}>{avm.label} AVM</label>
            {avm.link&&<a href={avm.link} target="_blank" rel="noopener noreferrer" style={{textDecoration:'none'}}>
              <button type="button" className="btn btn-sm btn-p" style={{fontSize:'.7rem',padding:'3px 10px'}}>{avm.btnLabel}</button>
            </a>}
          </div>
          {editingField===avm.key
            ?<input className="inp inp-m" type="number" autoFocus placeholder="Enter value" value={qo[avm.key]} onChange={e=>D.updateQO(avm.key,e.target.value)} onBlur={()=>setEditingField(null)} onKeyDown={e=>{if(e.key==='Enter')setEditingField(null)}}/>
            :<div className="inp inp-m" style={{cursor:'text',color:qo[avm.key]?'var(--text)':'var(--text-muted)',background:qo[avm.key]?'var(--green-bg)':'var(--bg-white)',minHeight:32,display:'flex',alignItems:'center'}} onClick={()=>setEditingField(avm.key)}>
              {qo[avm.key]?fmtCurrency(qo[avm.key]):'Click to enter value...'}
            </div>
          }
        </div>)}

        {/* House Canary — manual + PDF upload */}
        <div className="fg" style={{marginBottom:0}}>
          <div className="f ac jb" style={{marginBottom:4}}>
            <label style={{marginBottom:0}}>House Canary AVM</label>
            <div className="f ac g2">
              <input type="file" accept=".pdf" ref={hcFileRef} style={{display:'none'}} onChange={async e=>{
                const file=e.target.files?.[0];
                if(!file)return;
                setHcFileName(file.name);
                setHcUploading(true);
                try{
                  const parsed=await parseHouseCanaryPDF(file);
                  if(parsed.valueEstimate){
                    D.updateQO('houseCanaryAVM',parsed.valueEstimate);
                  }
                  // Auto-fill Market Velocity + Market Risk from HC market data
                  if(parsed.market){
                    if(parsed.market.avgDOM)D.updateMkt('avgDOM',parsed.market.avgDOM);
                    if(parsed.market.activeFromComps)D.updateMkt('activeListings',String(parsed.market.activeFromComps));
                    if(parsed.market.closedFromComps)D.updateMkt('closedLast30',String(parsed.market.closedFromComps));
                    if(parsed.market.pendingFromComps)D.updateMkt('pendingLast30',String(parsed.market.pendingFromComps));
                    for(const k of ['riskOfDecline','riskLevel','riskLastYear','monthsOfSupply','mosLastYear','domLastYear','forecast1yrPct','forecast2yrPct','forecast3yrPct','forecast1yrVal','forecast2yrVal','forecast3yrVal','forecastYr1','forecastYr2','forecastYr3'])
                      if(parsed.market[k])D.updateMkt(k,parsed.market[k]);
                  }
                }catch(err){console.error('HC PDF parse error:',err)}
                setHcUploading(false);
                if(hcFileRef.current)hcFileRef.current.value='';
              }}/>
              <button type="button" className="btn btn-sm btn-s" style={{fontSize:'.7rem',padding:'3px 10px'}} onClick={()=>hcFileRef.current?.click()}>
                {hcUploading?'Reading...':'Upload PDF'}
              </button>
            </div>
          </div>
          {hcFileName&&<div style={{fontSize:'.7rem',color:'var(--text-muted)',marginBottom:4}}>Uploaded: {hcFileName}</div>}
          {editingField==='houseCanaryAVM'
            ?<input className="inp inp-m" type="number" autoFocus placeholder="Enter value" value={qo.houseCanaryAVM} onChange={e=>D.updateQO('houseCanaryAVM',e.target.value)} onBlur={()=>setEditingField(null)} onKeyDown={e=>{if(e.key==='Enter')setEditingField(null)}}/>
            :<div className="inp inp-m" style={{cursor:'text',color:qo.houseCanaryAVM?'var(--text)':'var(--text-muted)',background:qo.houseCanaryAVM?'var(--green-bg)':'var(--bg-white)',minHeight:32,display:'flex',alignItems:'center'}} onClick={()=>setEditingField('houseCanaryAVM')}>
              {qo.houseCanaryAVM?fmtCurrency(qo.houseCanaryAVM):'Click to enter value or upload PDF...'}
            </div>
          }
        </div>
        {/* CMA (MLS) — manual + PDF upload */}
        <div className="fg" style={{marginBottom:0,marginTop:8,paddingTop:8,borderTop:'1px solid var(--border-light)'}}>
          <div className="f ac jb" style={{marginBottom:4}}>
            <label style={{marginBottom:0}}>CMA (MLS) AVM</label>
            <div className="f ac g2">
              <input type="file" accept=".pdf" ref={cmaFileRef} style={{display:'none'}} onChange={async e=>{
                const file=e.target.files?.[0];
                if(!file)return;
                setCmaFileName(file.name);
                setCmaUploading(true);
                setCmaData(null);
                setCmaError(null);
                try{
                  const parsed=await parseCMAPDF(file);
                  setCmaData(parsed.summary);
                  // Use SP Median as the CMA AVM (most representative for investors)
                  const val=parsed.summary.spMedian||parsed.summary.spAvg;
                  if(val)D.updateQO('cmaAVM',val);
                }catch(err){console.error('CMA parse error:',err);setCmaError(err.message||String(err))}
                setCmaUploading(false);
                if(cmaFileRef.current)cmaFileRef.current.value='';
              }}/>
              <button type="button" className="btn btn-sm btn-s" style={{fontSize:'.7rem',padding:'3px 10px'}} onClick={()=>cmaFileRef.current?.click()}>
                {cmaUploading?'Reading...':'Upload CMA PDF'}
              </button>
            </div>
          </div>
          {cmaFileName&&<div style={{fontSize:'.7rem',color:'var(--text-muted)',marginBottom:4}}>Uploaded: {cmaFileName}</div>}
          {cmaData&&<div style={{fontSize:'.72rem',padding:'6px 10px',background:'var(--blue-bg)',border:'1px solid var(--blue-border)',borderRadius:'var(--r-sm)',marginBottom:6}}>
            <div style={{display:'flex',gap:16,flexWrap:'wrap'}}>
              <span><strong>SP Avg:</strong> <span className="mono" style={{color:'var(--accent)',fontWeight:600}}>{cmaData.spAvg?'$'+Number(cmaData.spAvg).toLocaleString():'—'}</span></span>
              <span><strong>SP Med:</strong> <span className="mono" style={{color:'var(--accent)',fontWeight:600}}>{cmaData.spMedian?'$'+Number(cmaData.spMedian).toLocaleString():'—'}</span></span>
              <span><strong>LP Avg:</strong> <span className="mono" style={{color:'var(--accent)',fontWeight:600}}>{cmaData.lpAvg?'$'+Number(cmaData.lpAvg).toLocaleString():'—'}</span></span>
              <span><strong>LP Med:</strong> <span className="mono" style={{color:'var(--accent)',fontWeight:600}}>{cmaData.lpMedian?'$'+Number(cmaData.lpMedian).toLocaleString():'—'}</span></span>
            </div>
            <div style={{marginTop:3,color:'var(--text-muted)'}}>Using SP Median as CMA value</div>
          </div>}
          {cmaError&&<div style={{fontSize:'.72rem',padding:'6px 10px',background:'#fef2f2',border:'1px solid #fca5a5',borderRadius:'var(--r-sm)',marginBottom:6,color:'#b91c1c'}}>CMA Parse Error: {cmaError}</div>}
          {editingField==='cmaAVM'
            ?<input className="inp inp-m" type="number" autoFocus placeholder="Enter value" value={qo.cmaAVM} onChange={e=>D.updateQO('cmaAVM',e.target.value)} onBlur={()=>setEditingField(null)} onKeyDown={e=>{if(e.key==='Enter')setEditingField(null)}}/>
            :<div className="inp inp-m" style={{cursor:'text',color:qo.cmaAVM?'var(--text)':'var(--text-muted)',background:qo.cmaAVM?'var(--green-bg)':'var(--bg-white)',minHeight:32,display:'flex',alignItems:'center'}} onClick={()=>setEditingField('cmaAVM')}>
              {qo.cmaAVM?fmtCurrency(qo.cmaAVM):'Click to enter value or upload CMA PDF...'}
            </div>
          }
        </div>
      </div></div>
    </div>

    {/* Offer Calculations */}
    <div className="card mb4"><div className="card-h">Offer Calculations</div><div className="card-b">
      <div className="mr">
        <div className="mc hl"><div className="lbl">As-Is Value</div><div className="val">{fmt(asIsARV)}</div><div className="sub">Based on {comps.asIs.filter(c=>c.price).length>0?'comps':avmVals.length>0?'avg of '+avmVals.length+' AVM'+(avmVals.length>1?'s':''):'no data'}</div></div>
        {offers&&<><div className="mc"><div className="lbl">Net to Seller (8% fees)</div><div className="val mono">{fmt(offers.netToSeller)}</div></div>
        <div className="mc"><div className="lbl">Cash Offer</div><div className="val mono">{fmt(offers.cashOffer)}</div><div className="sub">MAO at {fmt(offers.minProfitTarget)} profit</div></div></>}
      </div>
      {/* ===== RENO ESTIMATE FOR CASH OFFER ===== */}
      <div style={{marginBottom:16}}>
        <div style={{fontSize:'.72rem',fontWeight:500,color:'var(--text-sec)',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:8}}>Est. Reno Budget (for Cash Offer)</div>
        {/* $/SF quick estimate */}
        <div style={{display:'flex',alignItems:'flex-end',gap:16,padding:'10px 14px',background:qoPSF>0?'var(--blue-bg)':'var(--bg)',borderRadius:'var(--r-sm)',border:qoPSF>0?'1px solid var(--blue-border)':'1px solid var(--border-light)',marginBottom:10}}>
          <div style={{flex:'0 0 auto'}}>
            <div style={{fontSize:'.72rem',fontWeight:500,color:'var(--text-sec)',marginBottom:4}}>Quick $/SF Estimate</div>
            <div className="f ac g2">
              <span style={{fontSize:'.85rem',color:'var(--text-sec)'}}>$</span>
              <input className="inp inp-m" type="number" step="1" placeholder="e.g. 75" value={qo.renoPSF||''} onChange={e=>D.updateQO('renoPSF',e.target.value)} style={{width:80,padding:'4px 8px'}}/>
              <span style={{fontSize:'.85rem',color:'var(--text-sec)'}}>/SF</span>
            </div>
          </div>
          {qoPSF>0&&sqft?<div style={{flex:'0 0 auto'}}>
            <span style={{fontSize:'.78rem',color:'var(--text-muted)'}}>× {fmtNum(sqft)} SF = </span>
            <strong className="mono" style={{fontSize:'.95rem'}}>{fmt(qoPSFTotal)}</strong>
          </div>:qoPSF>0&&!sqft?<div style={{fontSize:'.75rem',color:'var(--amber)'}}> Enter SQFT on the FDIF tab</div>
          :<div style={{fontSize:'.75rem',color:'var(--text-muted)',paddingBottom:4}}>Type $/SF to quickly estimate, or enter a dollar amount below</div>}
        </div>
        {/* Manual dollar override */}
        <div style={{maxWidth:320}}>
          <div style={{fontSize:'.72rem',color:'var(--text-muted)',marginBottom:4}}>Or enter exact amount</div>
          <input className="inp inp-m" type="text" placeholder={renoSource==='qopsf'?fmt(qoPSFTotal)+' from $/SF above':fullDealReno?fmt(fullDealReno)+' from Deal Eval':'$0'} value={qo.estReno||''} onChange={e=>D.updateQO('estReno',e.target.value)}/>
          {renoSource==='fulldeal'&&<div className="hint">Auto-filled from Full Deal Eval reno budget</div>}
          {renoSource==='qopsf'&&!pn(qo.estReno)&&<div className="hint">Using $/SF estimate above</div>}
        </div>
      </div>

      {/* AVM Comparison Mini-Table */}
      {avmVals.length>1&&<div style={{marginBottom:16}}>
        <table className="tbl" style={{maxWidth:500}}>
          <thead><tr><th>Source</th><th className="r">Value</th><th className="r">vs Avg</th></tr></thead>
          <tbody>
            {[['Zillow',pn(qo.zillowAVM)],['Redfin',pn(qo.redfinAVM)],['Realtor.com',pn(qo.realtorAVM)],['House Canary',pn(qo.houseCanaryAVM)]].filter(([,v])=>v>0).map(([name,val])=>{
              const diff=avgAVM>0?(val-avgAVM)/avgAVM:0;
              return <tr key={name}><td>{name}</td><td className="r mono">{fmt(val)}</td><td className={'r mono '+(diff>0.02?'tgrn':diff<-0.02?'tred':'tmut')}>{diff>0?'+':''}{fmtPct(diff)}</td></tr>
            })}
            <tr style={{fontWeight:700,borderTop:'2px solid var(--border)'}}><td>Average</td><td className="r mono">{fmt(avgAVM)}</td><td className="r mono tmut">—</td></tr>
          </tbody>
        </table>
      </div>}

      {offers&&<>
      <div style={{padding:'12px 14px',marginBottom:10,background:'var(--bg-white)',border:'1px solid var(--border)',borderRadius:'var(--r-sm)'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:10,flexWrap:'wrap',marginBottom:8}}>
          <div style={{fontSize:'.72rem',textTransform:'uppercase',letterSpacing:'.06em',fontWeight:700,color:'var(--text-sec)'}}>
            Renovation level
            <span style={{textTransform:'none',letterSpacing:'normal',fontWeight:500,color:'var(--text-sec)'}}>
              {' '}&middot; {qoMarket?qoMarket:'no market set'}{qoMarket&&!marketHasOwnRates(D.marketRates,qoMarket)?' (using default rates)':''}
            </span>
          </div>
          <button className="btn btn-sm btn-s" onClick={()=>{setRateEdit(e=>!e);setRateDraft(Object.fromEntries(qoTiers.map(t=>[t.id,t.psf])))}}>
            {rateEdit?'Cancel':'Edit rates'}
          </button>
        </div>

        {!rateEdit&&<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(190px,1fr))',gap:8}}>
          {qoTiers.map(t=>{
            // Compare against the resolved rate so the default tier shows as
            // selected before the user has clicked anything.
            const on=qoPSF===t.psf;
            return <button key={t.id} onClick={()=>{D.updateQO('renoPSF',t.psf);D.updateQO('estReno','')}}
              style={{padding:'10px 12px',borderRadius:'var(--r-sm)',cursor:'pointer',textAlign:'left',
                border:'2px solid '+(on?'var(--accent)':'var(--border)'),background:on?'#EEF4FF':'var(--bg-white)'}}>
              <div style={{fontWeight:700,fontSize:'.85rem',color:on?'var(--accent)':'var(--text)'}}>{t.label} &middot; ${t.psf}/sf</div>
              <div style={{fontSize:'.68rem',color:'var(--text-sec)',lineHeight:1.4,minHeight:'2.6em',marginTop:2}}>{t.desc}</div>
              <div className="mono" style={{fontSize:'.8rem',fontWeight:700,marginTop:4}}>{sqft?fmt(t.psf*sqft):'\u2014'}</div>
            </button>;
          })}
        </div>}

        {rateEdit&&<div>
          <div style={{fontSize:'.78rem',color:'var(--text-sec)',marginBottom:8,lineHeight:1.5}}>
            Rates are per square foot and apply to {qoMarket||'this market'}. Saving for a market only affects that market. Saving as default sets the rates any market inherits until it has its own.
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(190px,1fr))',gap:8}}>
            {RENO_TIER_DEFS.map(t=><div key={t.id} className="fg" style={{marginBottom:0}}>
              <label>{t.label}</label>
              <input className="inp inp-m" type="number" step={1} min={0} value={rateDraft[t.id]??''}
                onChange={e=>setRateDraft(d=>({...d,[t.id]:e.target.value}))}/>
              <div className="hint">{sqft?fmt((pn(rateDraft[t.id])||0)*sqft):'enter sqft to preview'}</div>
            </div>)}
          </div>
          <div className="mt2" style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            <button className="btn btn-sm btn-p" disabled={!qoMarket} onClick={()=>{
              const rates=Object.fromEntries(RENO_TIER_DEFS.map(t=>[t.id,pn(rateDraft[t.id])||0]));
              D.saveMarketRates(qoMarket,rates);setRateEdit(false);
            }}>{qoMarket?'Save for '+qoMarket:'Set a market first'}</button>
            <button className="btn btn-sm btn-s" onClick={()=>{
              const rates=Object.fromEntries(RENO_TIER_DEFS.map(t=>[t.id,pn(rateDraft[t.id])||0]));
              if(confirm('Set these as the default rates for every market that has none of its own?'))
                {D.saveDefaultRates(rates);setRateEdit(false)}
            }}>Save as default for new markets</button>
            {marketHasOwnRates(D.marketRates,qoMarket)&&<button className="btn btn-sm btn-d" onClick={()=>{
              if(confirm('Remove '+qoMarket+"'s own rates and fall back to the default set?"))
                {D.clearMarketRates(qoMarket);setRateEdit(false)}
            }}>Reset {qoMarket} to default</button>}
          </div>
          {!qoMarket&&<div className="warn-box" style={{marginTop:8,fontSize:'.78rem'}}>
            This deal has no Market / Area set on the FDIF, so rates cannot be saved against a market. You can still save them as the default.
          </div>}
        </div>}
      </div>

      <div style={{padding:'10px 12px',marginBottom:10,background:'var(--bg)',border:'1px solid var(--border)',borderRadius:'var(--r-sm)',fontSize:'.78rem',lineHeight:1.6}}>
        <span style={{fontSize:'.6rem',textTransform:'uppercase',letterSpacing:'.07em',fontWeight:700,
          color:qoInvestor?'var(--accent)':'var(--text-sec)',display:'block',marginBottom:3}}>
          What these numbers assume ({qoInvestor?qoInvestor+"'s terms":'TPHP house figures'})</span>
        ARV <strong>{fmt(offers.arvUsed)}</strong> (AVM average) &nbsp;·&nbsp;
        Reno + contingency <strong>{fmt(offers.renoWithContingency)}</strong> &nbsp;·&nbsp;
        Hold <strong>{offers.holdMonths}mo</strong> &nbsp;·&nbsp;
        Carry <strong>{fmt(offers.carry)}</strong> &nbsp;·&nbsp;
        Financing <strong>{fmt(offers.financing)}</strong> &nbsp;·&nbsp;
        Selling <strong>{fmt(offers.sellingCost)}</strong> &nbsp;·&nbsp;
        Min profit <strong>{fmt(offers.minProfitTarget)}</strong>
        <div style={{marginTop:4}}>
          <label style={{display:'inline-flex',alignItems:'center',gap:6}}>Hold months:
            <input className="inp inp-m" type="number" step={1} min={0} style={{width:70}}
              value={D.deal.quickOffer.holdMonths??6} onChange={e=>D.updateQO('holdMonths',e.target.value)}/>
          </label>
        </div>
      </div>

      <table className="tbl"><thead><tr><th>Offer Type</th><th className="r">Amount</th><th className="r">% of As-Is</th><th>Basis</th></tr></thead><tbody>
        <tr><td><strong>Novation Contract Price</strong></td><td className="r mono">{fmt(offers.novationPrice)}</td><td className="r mono">{fmtPct(asIsARV>0?offers.novationPrice/asIsARV:0)}</td><td className="tmut">As-Is less {fmtPct(offers.sellPct)} selling costs</td></tr>
        <tr style={{background:'var(--blue-bg)'}}><td><strong>Cash Offer (ceiling)</strong></td><td className="r mono">{fmt(offers.cashOffer)}</td><td className="r mono">{fmtPct(asIsARV>0?offers.cashOffer/asIsARV:0)}</td><td className="tmut">MAO, {offers.maoBinding==='roi'?offers.minAnnualROI+'%/yr ROI floor binding':fmt(offers.minProfitTarget)+' profit floor binding'}</td></tr>
        {offers.wholesale.map(w=><tr key={w.fee}>
          <td><strong>Wholesale, {fmt(w.fee)} fee</strong></td>
          <td className="r mono">{fmt(w.price)}</td>
          <td className="r mono">{fmtPct(asIsARV>0?w.price/asIsARV:0)}</td>
          <td className="tmut">Cash offer less our assignment fee</td>
        </tr>)}
      </tbody></table>
      <div style={{marginTop:12,padding:'12px 14px',background:'var(--bg-white)',border:'1px solid var(--border)',borderRadius:'var(--r-sm)'}}>
        <div style={{fontSize:'.72rem',textTransform:'uppercase',letterSpacing:'.06em',fontWeight:700,color:'var(--text-sec)',marginBottom:8}}>Offer range — quote from the low end</div>
        <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
          {[['Conservative',offers.conservative,'ARV −8%, reno +25%','var(--red)'],
            ['Point estimate',offers.cashOffer,'as entered','var(--accent)'],
            ['Optimistic',offers.optimistic,'ARV +8%, reno −15%','var(--green)']].map(([n,v,d,c])=>
            <div key={n} style={{flex:'1 1 150px',padding:'10px 12px',borderRadius:'var(--r-sm)',border:'1px solid '+c,background:'var(--bg)'}}>
              <div style={{fontSize:'.68rem',fontWeight:700,color:c,textTransform:'uppercase',letterSpacing:'.05em'}}>{n}</div>
              <div className="mono" style={{fontSize:'1.05rem',fontWeight:700,marginTop:2}}>{fmt(v)}</div>
              <div style={{fontSize:'.66rem',color:'var(--text-sec)'}}>{d}</div>
            </div>)}
        </div>
        <div style={{marginTop:10,paddingTop:10,borderTop:'1px solid var(--border)',fontSize:'.78rem'}}>
          <strong>Head check:</strong> ARV × 0.80 − reno × 1.5 = <span className="mono">{fmt(offers.ruleOfThumb)}</span>
          {offers.cashOffer>0&&Math.abs(offers.ruleOfThumb-offers.cashOffer)>offers.cashOffer*0.25&&
            <span style={{color:'var(--red)',fontWeight:600}}> — that is more than 25% off the engine. Check the ARV and the reno figure before quoting anything.</span>}
        </div>
      </div>
      <div style={{marginTop:8,fontSize:'.75rem',color:'var(--text-sec)',lineHeight:1.5}}>
        ARV here is the AVM average, not comps, and the reno figure is a $/SF guess. The range above is wide because those inputs are estimates. Getting photos is what narrows it. Run the Full Deal Eval before contracting.
      </div>
      </>}
      {!offers&&<div className="empty">Enter SQFT on the FDIF tab and AVM values above to calculate offers.</div>}
    </div></div>
  </div>
}

/* ═══════════════════════════════════════
   TAB 3: FULL DEAL EVAL
   ═══════════════════════════════════════ */
function CompTbl({title,tag,comps,type,D,subjectYr,subjectPool}){
  return <div className="card mb4">
    <div className="card-h"><span>{title} <span className={'tag '+(tag==='as-is'?'tag-ai':'tag-rn')}>{tag==='as-is'?'AS-IS':'RENOVATED'}</span></span>
      <button className="btn btn-sm btn-s" onClick={()=>D.addComp(type)}>+ Add Comp</button></div>
    <div className="card-b" style={{overflowX:'auto'}}>
      <table className="tbl" style={{fontSize:'.78rem'}}><thead><tr>
        <th>#</th><th>Sim</th><th>Status</th><th>Address</th><th>Dist</th><th>Bed/Ba</th><th>SQFT</th>
        <th>Sale Price</th><th>List Price</th><th>Diff</th><th>$/SF</th><th>DOM</th>
        <th>Sale Date</th><th>Days</th><th>Yr Built</th><th>Pool</th><th>Gar</th>
        <th>Flip</th><th>Condition</th><th></th>
      </tr></thead>
      <tbody>{comps.length===0?<tr><td colSpan={20} className="tmut tc" style={{padding:'12px 0'}}>No comps — click "+ Add Comp" or upload a House Canary PDF</td></tr>:comps.map((c,i)=>{
        const psf=c.price&&c.sqft?pn(c.price)/pn(c.sqft):null;

          <td><input className="mono" value={c.sqft} onChange={e=>D.updateComp(type,c.id,'sqft',e.target.value)} placeholder="1500" style={{border:'none',borderBottom:'1px dashed var(--border)',width:60,textAlign:'right',padding:'2px 4px',fontSize:'.78rem'}}/></td>
          <td><input className="mono" value={c.price} onChange={e=>D.updateComp(type,c.id,'price',e.target.value)} placeholder="950000" style={{border:'none',borderBottom:'1px dashed var(--border)',width:90,textAlign:'right',padding:'2px 4px',fontSize:'.78rem'}}/></td>
          <td><input className="mono" value={c.listPrice||''} onChange={e=>D.updateComp(type,c.id,'listPrice',e.target.value)} placeholder="" style={{border:'none',borderBottom:'1px dashed var(--border)',width:90,textAlign:'right',padding:'2px 4px',fontSize:'.78rem'}}/></td>
          <td className="mono r" style={{fontWeight:600,color:priceDiff>0?'var(--green)':priceDiff<0?'var(--red)':'var(--text-muted)',whiteSpace:'nowrap',fontSize:'.75rem'}}>{priceDiff!=null?(priceDiff>0?'+':'')+fmt(priceDiff):''}</td>
          <td className="mono" style={{color:'var(--accent)',fontWeight:500}}>{psf?fmtSF(psf):'—'}</td>
          <td><input className="mono" value={c.dom||''} onChange={e=>D.updateComp(type,c.id,'dom',e.target.value)} style={{border:'none',borderBottom:'1px dashed var(--border)',width:40,textAlign:'right',padding:'2px 4px',fontSize:'.78rem'}}/></td>
          <td><input type="date" value={c.saleDate} onChange={e=>D.updateComp(type,c.id,'saleDate',e.target.value)} style={{border:'none',borderBottom:'1px dashed var(--border)',padding:'2px 4px',fontSize:'.78rem',width:120}}/></td>

          <td style={{background:poolDiff?'var(--amber-bg)':'',fontWeight:poolDiff?700:400}}><select value={c.pool||''} onChange={e=>D.updateComp(type,c.id,'pool',e.target.value)} style={{border:'none',borderBottom:'1px dashed var(--border)',padding:'2px',fontSize:'.72rem',background:'transparent',fontWeight:'inherit'}}><option value="">—</option><option value="Yes">Yes</option><option value="No">No</option></select></td>
          <td><input className="mono" value={c.garageSpaces||''} onChange={e=>D.updateComp(type,c.id,'garageSpaces',e.target.value)} style={{border:'none',borderBottom:'1px dashed var(--border)',width:30,textAlign:'center',padding:'2px 4px',fontSize:'.78rem'}}/></td>
          <td style={{color:c.flip==='Yes'?'var(--accent)':'',fontWeight:c.flip==='Yes'?700:400}}><select value={c.flip||''} onChange={e=>D.updateComp(type,c.id,'flip',e.target.value)} style={{border:'none',borderBottom:'1px dashed var(--border)',padding:'2px',fontSize:'.72rem',background:'transparent',color:'inherit',fontWeight:'inherit'}}><option value="">—</option><option value="Yes">Yes</option><option value="No">No</option></select></td>
          <td><select value={c.condition||''} onChange={e=>D.updateComp(type,c.id,'condition',e.target.value)} title={c.condition&&!COND_OPTS.includes(c.condition)?'Imported value, not on the standard scale':''} style={{border:'none',borderBottom:'1px dashed var(--border)',padding:'2px',fontSize:'.72rem',background:'transparent',width:104,color:c.condition&&!COND_OPTS.includes(c.condition)?'var(--amber)':'inherit'}}>
            <option value="">—</option>

            {c.condition&&!COND_OPTS.includes(c.condition)&&<option value={c.condition}>{c.condition} (imported)</option>}
          </select></td>
          <td><button className="btn-i" title="Remove" onClick={()=>D.removeComp(type,c.id)} style={{color:'var(--red)'}}>✕</button></td>

}

      <tbody>
        {Object.keys(RENO_COSTS).map(cat=><tr key={cat}>
          <td style={{...tdS,fontWeight:500}}>{CAT_LABELS[cat]}</td>

        <tr style={{fontWeight:700,borderTop:'2px solid var(--border)'}}><td style={{padding:'6px 10px'}}>Subtotal</td><td></td><td style={{padding:'6px 10px',fontFamily:'var(--mono)',textAlign:'right'}}>{fmt(fr.subtotal)}</td><td></td></tr>

      </tbody>
    </table>}
  </div></div>
}

function TabFullDeal({D}){
  const{fdif,comps,renoScope,renoNotes,renoCustom}=D.deal;
  const[pkg,setPkg]=useState(null);
  // A package staged from the header badge opens the same preview as a file drop.
  useEffect(()=>{
    const st=D.deal.stagedPackage;
    if(st&&(!pkg||pkg.packageId!==st.packageId)){setPkg(st);D.clearStagedPackage()}
  },[D.deal.stagedPackage]);
  // The bot's light lane assumes a condition nobody has verified. Photos in
  // hand, or verified online photos, are what make it usable.
  const photosConfirmed=!!(fdif.photosReceived||fdif.photosOnlineOk);
  const[pkgOverwrite,setPkgOverwrite]=useState(false);
  const market=D.deal.market||{activeListings:'',pendingLast30:'',closedLast30:'',avgDOM:''};
  const sqft=pn(fdif.sqft);
  const pp=pn(D.deal.underwriting.purchasePrice)||pn(fdif.winWinPrice);
  const aiC=comps.asIs.filter(c=>c.price&&c.sqft).map(c=>({price:pn(c.price),sqft:pn(c.sqft)}));
  const rnC=comps.renovated.filter(c=>c.price&&c.sqft).map(c=>({price:pn(c.price),sqft:pn(c.sqft)}));
  const arvRes=resolveARVs(D.deal,sqft);
  const aiARV=arvRes.aiARV, rnARV=arvRes.frARV;
  const aiPSF=aiARV&&sqft?aiARV/sqft:calcAvgPSF(aiC);
  const rnPSF=rnARV&&sqft?rnARV/sqft:calcAvgPSF(rnC);
  const mos=calcMOS(pn(market.activeListings),pn(market.closedLast30));
  const mc=getMktCond(mos),mcc=getMktClass(mos);
  const rc=renoCustom||{};
  const cpct=D.deal.renoContingencyPct;
  const renoPSFVal=pn(D.deal.renoPSF||'');
  const baseFr=useMemo(()=>calcRenoBudget(renoScope,rc,cpct),[renoScope,rc,cpct]);
  // $/SF override: when set, builds a simple flat-budget that feeds into UW calcs
  const fr=useMemo(()=>{
    if(renoPSFVal>0&&sqft){
      const sub=Math.round(renoPSFVal*sqft);
      const pct=cpct!=null?cpct/100:0.2;
      return{lineItems:baseFr.lineItems,subtotal:sub,contingency:Math.round(sub*pct),total:Math.round(sub*(1+pct)),contingencyPct:pct};
    }
    return baseFr;
  },[baseFr,renoPSFVal,sqft,cpct]);
  const baseQf=useMemo(()=>calcQFBudget(fr.lineItems,fr.contingencyPct),[fr]);
  const qfPSFVal=pn(D.deal.qfRenoPSF||'');
  const qf=useMemo(()=>{
    if(qfPSFVal>0&&sqft){const sub=Math.round(qfPSFVal*sqft);const pct=cpct!=null?cpct/100:0.2;return{lineItems:baseQf.lineItems,subtotal:sub,contingency:Math.round(sub*pct),total:Math.round(sub*(1+pct)),contingencyPct:pct};}
    return baseQf;
  },[baseQf,qfPSFVal,sqft,cpct]);
  const ai=useMemo(()=>calcAIBudget(fr.lineItems,fr.contingencyPct),[fr]);

  const uwD={...DEF_UW,...(D.deal.uwDefaults||{})};
  const uw=D.deal.underwriting;
  const holds=[uw.holdFullReno||6,uw.holdQuickFlip||3,uw.holdAsIs??0];
  const rsubs=[fr.subtotal,qf.subtotal,ai.subtotal];
  const qfArvOverride=pn(D.deal.qfArv||'');
  const exitArvs=[rnARV,qfArvOverride||aiARV,aiARV];  // Quick Flip uses manual QF ARV or falls back to As-Is
  const dpAmt=pn(uw.downPayment)||0;
  const fdifHOA=pn(fdif.hoaDues)||0;
  const frS=useMemo(()=>(!exitArvs[0]||!pp)?null:calcUW({purchasePrice:pp,arv:exitArvs[0],sqft,holdMonths:holds[0],renoSubtotal:rsubs[0],contingencyPct:uwD.contingencyPct,uw:uwD,downPayment:dpAmt,hoaMonthly:fdifHOA}),[exitArvs[0],pp,sqft,holds[0],rsubs[0],dpAmt,fdifHOA,JSON.stringify(uwD)]);
  const qfS=useMemo(()=>(!exitArvs[1]||!pp)?null:calcUW({purchasePrice:pp,arv:exitArvs[1],sqft,holdMonths:holds[1],renoSubtotal:rsubs[1],contingencyPct:uwD.contingencyPct,uw:uwD,downPayment:dpAmt,hoaMonthly:fdifHOA}),[exitArvs[1],pp,sqft,holds[1],rsubs[1],dpAmt,fdifHOA,JSON.stringify(uwD)]);
  const aiS=useMemo(()=>(!exitArvs[2]||!pp)?null:calcUW({purchasePrice:pp,arv:exitArvs[2],sqft,holdMonths:holds[2],renoSubtotal:rsubs[2],contingencyPct:uwD.contingencyPct,uw:uwD,downPayment:dpAmt}),[exitArvs[2],pp,sqft,holds[2],rsubs[2],dpAmt,JSON.stringify(uwD)]);

  // House Canary PDF import state
  const hcPDFRef=useRef(null);
  const [hcParsing,setHcParsing]=useState(false);
  const [hcStaged,setHcStaged]=useState(null); // {valueEstimate, comps:[{...comp, classification}]}
  const [hcError,setHcError]=useState('');
  const [hcFileName,setHcFileName]=useState('');

  const handleHCUpload=async(e)=>{
    const file=e.target.files?.[0];
    if(!file)return;
    setHcFileName(file.name);
    setHcParsing(true);
    setHcError('');
    setHcStaged(null);
    try{
      const parsed=await parseHouseCanaryPDF(file);
      if(!parsed.comps.length&&!parsed.valueEstimate){
        setHcError('Could not extract comp data or value estimate from this PDF. Please check that it is a House Canary Property Explorer report.');
      }else{
        // Default every staged comp to "selected" so the user can simply click Import to bring all in,
        // or uncheck specific rows when they only want a subset (e.g. revised HC report).
        if(parsed.comps&&parsed.comps.length){
          parsed.comps=parsed.comps.map(c=>({...c,selected:true}));
        }
        setHcStaged(parsed);
        // Auto-fill HC AVM if value found
        if(parsed.valueEstimate){
          D.updateQO('houseCanaryAVM',parsed.valueEstimate);
        }
        // Auto-fill Market Velocity + Market Risk from HC market data
        if(parsed.market){
          if(parsed.market.avgDOM)D.updateMkt('avgDOM',parsed.market.avgDOM);
          if(parsed.market.activeFromComps)D.updateMkt('activeListings',String(parsed.market.activeFromComps));
          if(parsed.market.closedFromComps)D.updateMkt('closedLast30',String(parsed.market.closedFromComps));
          if(parsed.market.pendingFromComps)D.updateMkt('pendingLast30',String(parsed.market.pendingFromComps));
          for(const k of ['riskOfDecline','riskLevel','riskLastYear','monthsOfSupply','mosLastYear','domLastYear','forecast1yrPct','forecast2yrPct','forecast3yrPct','forecast1yrVal','forecast2yrVal','forecast3yrVal','forecastYr1','forecastYr2','forecastYr3'])
            if(parsed.market[k])D.updateMkt(k,parsed.market[k]);
        }
      }
    }catch(err){
      setHcError('Error reading PDF: '+err.message);
    }
    setHcParsing(false);
    if(hcPDFRef.current)hcPDFRef.current.value='';
  };

  const updateStagedClass=(idx,cls)=>{
    setHcStaged(prev=>({...prev,comps:prev.comps.map((c,i)=>i===idx?{...c,classification:cls}:c)}));
  };

  const toggleStagedSelected=(idx)=>{
    setHcStaged(prev=>({...prev,comps:prev.comps.map((c,i)=>i===idx?{...c,selected:!c.selected}:c)}));
  };

  const setAllStagedSelected=(val)=>{
    setHcStaged(prev=>({...prev,comps:prev.comps.map(c=>({...c,selected:val}))}));
  };

  const removeStagedComp=(idx)=>{
    setHcStaged(prev=>{
      const newComps=prev.comps.filter((_,i)=>i!==idx);
      return newComps.length?{...prev,comps:newComps}:null;
    });
  };

  const importStagedComps=()=>{
    if(!hcStaged?.comps?.length)return;
    const toImport=hcStaged.comps.filter(c=>c.selected);
    if(!toImport.length)return;
    D.importComps(toImport);
    setHcStaged(null);
  };

  return <div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:12,flexWrap:'wrap',marginBottom:16}}>
      <h2 style={{fontSize:'1.15rem',fontWeight:700,margin:0}}>Full Deal Evaluation</h2>
      <label className="btn btn-sm btn-p" style={{cursor:'pointer',margin:0}}>
        Import comp package
        <input type="file" accept=".json,application/json" style={{display:'none'}} onChange={e=>{
          const file=e.target.files&&e.target.files[0]; e.target.value='';
          if(!file)return;
          const r=new FileReader();
          r.onload=ev=>{
            const res=parseCompPackage(String(ev.target.result||''));
            if(!res.ok){alert('Could not read that package.\n\n'+res.error);return}
            setPkg(res);
          };
          r.readAsText(file);
        }}/>
      </label>
    </div>

    {pkg&&<div className="card mb4" style={{borderLeft:'4px solid var(--accent)'}}>
      <div className="card-h" style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:10,flexWrap:'wrap'}}>
        <span>Comp package preview{pkg.dealId?' \u00b7 '+pkg.dealId:''}</span>
        <button className="btn btn-sm btn-s" onClick={()=>setPkg(null)}>Discard</button>
      </div>
      <div className="card-b">
        <div style={{fontSize:'.8rem',marginBottom:10}}>
          <strong>{pkg.counts.total}</strong> comps: <strong>{pkg.counts.asIsClosed}</strong> closed as-is,
          {' '}<strong>{pkg.counts.renovatedClosed}</strong> closed renovated,
          {' '}<strong>{pkg.counts.context}</strong> active or pending (context only).
        </div>

        <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:10}}>
          {[['As-Is',pkg.valuations.asIs],['Light Prep',pkg.valuations.lightPrep],['ARV',pkg.valuations.arv]].map(([lbl,v])=>
            <div key={lbl} style={{flex:'1 1 150px',padding:'8px 10px',borderRadius:'var(--r-sm)',
              border:'1px solid '+(v.value?'var(--accent)':'var(--border)'),background:v.value?'#EEF4FF':'var(--bg)'}}>
              <div style={{fontSize:'.65rem',textTransform:'uppercase',letterSpacing:'.05em',fontWeight:700,color:'var(--text-sec)'}}>{lbl}</div>
              <div className="mono" style={{fontSize:'1rem',fontWeight:700}}>{v.value?fmt(v.value):'\u2014'}</div>
              {v.value&&v.low&&v.high&&<div style={{fontSize:'.66rem',color:'var(--text-sec)'}}>{fmt(v.low)} to {fmt(v.high)}{v.confidence?' \u00b7 '+v.confidence:''}</div>}
            </div>)}
        </div>

        {pkg.underwriterMAO.contract&&<div style={{fontSize:'.78rem',color:'var(--text-sec)',marginBottom:10,lineHeight:1.6}}>
          <div>Underwriter's contract MAO {fmt(pkg.underwriterMAO.contract)}, funded {fmt(pkg.underwriterMAO.funded)}, target {fmt(pkg.underwriterMAO.target)}. Reference only; this app's MAO follows the assigned investor's terms.</div>
          {pkg.underwriterMAO.lightContract&&<div style={{marginTop:2}}>
            Light rent-ready lane {fmt(pkg.underwriterMAO.lightContract)}
            {pkg.underwriterMAO.lightPhotoDependent
              ?(photosConfirmed
                ?' \u00b7 photos are in hand, so this lane is live.'
                :' \u00b7 withheld until photos confirm condition. Request them on the FDIF.')
              :'.'}
          </div>}
        </div>}

        {pkg.warnings.length>0&&<div className="warn-box" style={{fontSize:'.78rem',marginBottom:10}}>
          {pkg.warnings.map((w,i)=><div key={i} style={{marginBottom:4}}>{w}</div>)}
        </div>}

        <div style={{maxHeight:220,overflowY:'auto',border:'1px solid var(--border)',borderRadius:'var(--r-sm)',marginBottom:10}}>
          <table className="tbl"><thead><tr><th>Address</th><th>Set</th><th>Status</th><th className="r">Price</th><th className="r">SqFt</th><th>Bed/Ba</th><th>Condition</th></tr></thead><tbody>
            {pkg.comps.map((c,i)=><tr key={i} style={{opacity:c.status==='Closed'?1:.6}}>
              <td style={{fontSize:'.75rem'}}>{c.address}</td>
              <td style={{fontSize:'.72rem'}}>{c.classification==='renovated'?'Renovated':'As-Is'}</td>
              <td style={{fontSize:'.72rem'}}>{c.status||'\u2014'}</td>
              <td className="r mono" style={{fontSize:'.75rem'}}>{c.price?fmt(pn(c.price)):(c.listPrice?fmt(pn(c.listPrice))+' list':'\u2014')}</td>
              <td className="r mono" style={{fontSize:'.75rem'}}>{c.sqft||'\u2014'}</td>
              <td style={{fontSize:'.72rem'}}>{c.bedBath||'\u2014'}</td>
              <td style={{fontSize:'.72rem'}}>{c.condition||'\u2014'}</td>
            </tr>)}
          </tbody></table>
        </div>

        <label style={{display:'flex',alignItems:'center',gap:8,fontSize:'.8rem',marginBottom:10,cursor:'pointer'}}>
          <input type="checkbox" checked={pkgOverwrite} onChange={e=>setPkgOverwrite(e.target.checked)}/>
          Overwrite subject details that are already filled in (beds, sqft, year, lot, pool)
        </label>

        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <button className="btn btn-sm btn-p" onClick={()=>{
            if(!confirm('Replace the comps on this deal with the '+pkg.counts.total+' from the package?\n\nThe existing comps are removed.'))return;
            D.applyCompPackage(pkg,{overwriteSubject:pkgOverwrite});
            if(pkg.packageId&&D.markPackage)D.markPackage(pkg.packageId,'Imported');
            setPkg(null);
          }}>Import into this deal</button>
          <button className="btn btn-sm btn-s" onClick={()=>setPkg(null)}>Cancel</button>
        </div>
      </div>
    </div>}

    <div className="mr">
      <div className={'mc hl'+(aiARV?'':' tmut')}><div className="lbl">As-Is ARV</div><div className="val">{fmt(aiARV)}</div>
        <div className="sub">{arvRes.source==='underwriter'?'Underwriter, adjusted':(aiPSF?fmtSF(aiPSF)+' avg':'Add comps below')}</div></div>
      <div className={'mc hl'+(rnARV?'':' tmut')}><div className="lbl">Full Reno ARV</div><div className="val">{fmt(rnARV)}</div>
        <div className="sub">{arvRes.source==='underwriter'?'Underwriter, adjusted':(rnPSF?fmtSF(rnPSF)+' avg':'Add comps below')}</div></div>
      <div className="mc"><div className="lbl">Market Condition</div><div className={'val '+mcc} style={{fontSize:'1rem'}}>{mc}</div><div className="sub">{mos!=null?mos.toFixed(1)+' months supply':'Enter market data'}</div></div>
      <div className="mc"><div className="lbl">Full Reno Budget</div><div className="val mono">{fmt(fr.total)}</div><div className="sub">{sqft?fmtSF(fr.total/sqft):'—'}</div></div>
    </div>

    {arvRes.source==='underwriter'&&<div className="card mb4" style={{borderLeft:'4px solid var(--green)'}}>
      <div className="card-h">Valuation source: underwriter package</div>
      <div className="card-b">
        <div style={{fontSize:'.8rem',lineHeight:1.6,marginBottom:10}}>
          These ARVs come from the underwriter's adjusted grid, which adjusts every comp to this property for size, beds, pool, lot, style and condition, then weights by reliability. The figure below it is the app's own unweighted $/sqft average with no adjustments. That is a sanity check, not the number this deal is priced on.
        </div>
        <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
          {[['As-Is',aiARV,arvRes.compAsIs,arvRes.asIsDeviation],
            ['Full Reno',rnARV,arvRes.compReno,arvRes.renoDeviation]].map(([lbl,used,comp,dev])=>
            <div key={lbl} style={{flex:'1 1 220px',padding:'10px 12px',borderRadius:'var(--r-sm)',border:'1px solid var(--border)',background:'var(--bg)'}}>
              <div style={{fontSize:'.65rem',textTransform:'uppercase',letterSpacing:'.05em',fontWeight:700,color:'var(--text-sec)'}}>{lbl}</div>
              <div className="mono" style={{fontSize:'1rem',fontWeight:700}}>{fmt(used)} <span style={{fontSize:'.68rem',fontWeight:500,color:'var(--green)'}}>used</span></div>
              {comp>0&&<div style={{fontSize:'.72rem',color:'var(--text-sec)'}}>
                comps average {fmt(comp)}{dev!=null?' ('+(comp>used?'+':'')+Math.round((comp-used)/used*100)+'%)':''}
              </div>}
            </div>)}
        </div>
        {(arvRes.asIsDeviation>0.10||arvRes.renoDeviation>0.10)&&<div className="warn-box" style={{marginTop:10,fontSize:'.78rem'}}>
          The comps average sits more than 10% from the underwriter's figure. That is expected when the comps differ from this property on beds, pool or condition, since averaging cannot adjust for any of it. Worth a look if the gap is much wider, because it can also mean a comp landed in the wrong set.
        </div>}
        <label style={{display:'flex',alignItems:'center',gap:8,fontSize:'.8rem',marginTop:10,cursor:'pointer'}}>
          <input type="checkbox" checked={D.deal.uwPackage.useArvOverride!==false}
            onChange={e=>D.setArvOverrideUse(e.target.checked)}/>
          Use the underwriter's valuations. Untick to price off the comp average instead.
        </label>
      </div>
    </div>}

    {/* House Canary PDF Import */}
    <div className="card mb4">
      <div className="card-h">
        <span>Import Comps from House Canary PDF</span>
        <div className="f ac g2">
          <input type="file" accept=".pdf" ref={hcPDFRef} style={{display:'none'}} onChange={handleHCUpload}/>
          <button className="btn btn-sm btn-p" onClick={()=>hcPDFRef.current?.click()} disabled={hcParsing}>
            {hcParsing?'Parsing PDF...':'Upload House Canary Report'}
          </button>
        </div>
      </div>
      <div className="card-b">
        {!hcStaged&&!hcError&&!hcParsing&&<div className="tmut" style={{fontSize:'.85rem',padding:'8px 0'}}>
          Upload a House Canary Property Explorer PDF to automatically extract the Value Estimate and comparable properties. Each comp can be classified as As-Is or Renovated before importing.
          {hcFileName&&<span style={{marginLeft:8,color:'var(--text-sec)'}}>Last uploaded: {hcFileName}</span>}
        </div>}
        {hcParsing&&<div style={{padding:'16px 0',textAlign:'center',color:'var(--accent)'}}>
          <span style={{display:'inline-block',animation:'spin 1s linear infinite',marginRight:8}}>&#8635;</span> Extracting data from PDF...
        </div>}
        {hcError&&<div className="warn-box">{hcError}</div>}

        {hcStaged&&<div>
          {hcStaged.valueEstimate&&<div style={{padding:'8px 14px',background:'var(--green-bg)',border:'1px solid var(--green-border)',borderRadius:'var(--r)',marginBottom:12,fontSize:'.85rem'}}>
            <strong>Value Estimate extracted:</strong> <span className="mono" style={{color:'var(--green)',fontWeight:600}}>${Number(hcStaged.valueEstimate).toLocaleString()}</span>
            <span className="tmut" style={{marginLeft:8}}>(auto-saved to House Canary AVM on Quick Offer tab)</span>
          </div>}

          {hcStaged.comps.length>0&&<div>
            <div style={{fontSize:'.85rem',fontWeight:600,marginBottom:8,display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:8}}>
              <span>{hcStaged.comps.length} comparable{hcStaged.comps.length>1?'s':''} found — check the ones to import and classify each as As-Is or Renovated:</span>
              <span style={{fontSize:'.72rem',fontWeight:500,display:'flex',gap:6}}>
                <button type="button" className="btn btn-sm btn-s" style={{fontSize:'.7rem',padding:'2px 8px'}} onClick={()=>setAllStagedSelected(true)}>Select All</button>
                <button type="button" className="btn btn-sm btn-s" style={{fontSize:'.7rem',padding:'2px 8px'}} onClick={()=>setAllStagedSelected(false)}>Select None</button>
              </span>
            </div>
            <div style={{overflowX:'auto'}}>
              <table className="tbl" style={{fontSize:'.78rem'}}>
                <thead><tr>
                  <th style={{width:24}}><input type="checkbox" checked={hcStaged.comps.every(c=>c.selected)} ref={el=>{if(el)el.indeterminate=hcStaged.comps.some(c=>c.selected)&&!hcStaged.comps.every(c=>c.selected)}} onChange={e=>setAllStagedSelected(e.target.checked)} title="Select / deselect all"/></th>
                  <th>Class</th><th>Sim</th><th>Address</th><th>Dist</th><th>Status</th><th>Bed/Ba</th><th>SQFT</th><th>Sale $</th><th>List $</th><th>Diff</th><th>$/SF</th><th>DOM</th><th>Yr Built</th><th>Pool</th><th>Gar</th><th>Flip</th><th>Condition</th><th></th>
                </tr></thead>
                <tbody>{hcStaged.comps.map((c,i)=>{
                  const psf=c.price&&c.sqft?pn(c.price)/pn(c.sqft):null;
                  const sp=pn(c.price),lp=pn(c.listPrice);
                  const priceDiff=sp&&lp?(sp-lp):null;
                  const subYr=pn(hcStaged.subjectProperty?.yearBuilt);
                  const cYr=pn(c.yearBuilt);
                  const yrDiff=subYr&&cYr?Math.abs(subYr-cYr):0;
                  const subPool=hcStaged.subjectProperty?.pool||'';
                  const poolDiff=subPool&&c.pool&&c.pool.toLowerCase()!==subPool.toLowerCase();
                  return <tr key={i} style={{background:c.selected?(c.classification==='renovated'?'var(--green-bg)':'var(--amber-bg)'):'var(--bg)',opacity:c.selected?1:0.55}}>
                    <td style={{textAlign:'center'}}><input type="checkbox" checked={!!c.selected} onChange={()=>toggleStagedSelected(i)}/></td>
                    <td><select className="inp" value={c.classification} onChange={e=>updateStagedClass(i,e.target.value)} style={{fontSize:'.72rem',padding:'2px 4px',width:90,fontWeight:600,color:c.classification==='renovated'?'var(--green)':'var(--amber)'}}>
                      <option value="asIs">As-Is</option>
                      <option value="renovated">Renovated</option>
                    </select></td>
                    <td className="mono" style={{fontWeight:600,color:'var(--accent)'}}>{c.similarity||'—'}</td>
                    <td style={{fontWeight:500,fontSize:'.78rem',whiteSpace:'nowrap'}}><div style={{display:'flex',alignItems:'center',gap:4}}>{c.address}{c.address&&<a href={'https://www.zillow.com/homes/'+encodeURIComponent(c.address.replace(/\s+/g,'-'))+'_rb/'} target="_blank" rel="noopener noreferrer" style={{flexShrink:0,textDecoration:'none'}}><button type="button" className="btn btn-sm btn-p" style={{fontSize:'.6rem',padding:'1px 6px',lineHeight:'1.4'}}>Zillow</button></a>}</div></td>
                    <td className="tmut">{c.distance}</td>
                    <td><span className={'badge '+(c.status==='Closed'?'bg-g':'bg-a')} style={{fontSize:'.65rem'}}>{c.status}</span></td>
                    <td className="mono">{c.bedBath}</td>
                    <td className="mono r">{c.sqft?Number(c.sqft).toLocaleString():''}</td>
                    <td className="mono r" style={{fontWeight:600}}>{sp?'$'+sp.toLocaleString():''}</td>
                    <td className="mono r">{lp?'$'+lp.toLocaleString():''}</td>
                    <td className="mono r" style={{fontWeight:600,color:priceDiff>0?'var(--green)':priceDiff<0?'var(--red)':'var(--text-muted)'}}>{priceDiff!=null?(priceDiff>0?'+':'')+fmt(priceDiff):''}</td>
                    <td className="mono r" style={{color:'var(--accent)'}}>{psf?'$'+Math.round(psf):''}</td>
                    <td className="mono">{c.dom||'—'}</td>
                    <td className="mono" style={{background:yrDiff>10?'var(--amber-bg)':'',fontWeight:yrDiff>10?600:400}}>{c.yearBuilt||'—'}</td>
                    <td style={{background:poolDiff?'var(--amber-bg)':'',fontWeight:poolDiff?600:400}}>{c.pool||'—'}</td>
                    <td className="mono">{c.garageSpaces||'—'}</td>
                    <td style={{color:c.flip==='Yes'?'var(--accent)':'',fontWeight:c.flip==='Yes'?600:400}}>{c.flip||'—'}</td>
                    <td style={{fontSize:'.72rem'}}>{c.condition||'—'}</td>
                    <td><button className="btn-i" title="Remove" onClick={()=>removeStagedComp(i)} style={{color:'var(--red)'}}>✕</button></td>
                  </tr>})}</tbody>
              </table>
            </div>
            <div style={{marginTop:12,display:'flex',gap:8,alignItems:'center'}}>
              {(()=>{
                const sel=hcStaged.comps.filter(c=>c.selected);
                const nAI=sel.filter(c=>c.classification==='asIs').length;
                const nRN=sel.filter(c=>c.classification==='renovated').length;
                const disabled=sel.length===0;
                return <button className="btn btn-p" onClick={importStagedComps} disabled={disabled} style={disabled?{opacity:.5,cursor:'not-allowed'}:undefined}>
                  {disabled?'Select at least one comp to import':`Add ${nAI} As-Is + ${nRN} Renovated to Existing Comps`}
                </button>;
              })()}
              <button className="btn btn-s" onClick={()=>setHcStaged(null)}>Cancel</button>
            </div>
          </div>}

          {hcStaged.comps.length===0&&<div className="tmut" style={{padding:'8px 0'}}>No comparable properties found in this PDF. Value Estimate was extracted above.</div>}
        </div>}
      </div>
    </div>

  const fv=v=>{if(v==null||v===''||isNaN(v))return'—';if(typeof v==='number'&&Math.abs(v)<2&&Math.abs(v)!==0&&!Number.isInteger(v))return fmtPct(v);return fmt(v)};
